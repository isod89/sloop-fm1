  const info = parse[CMD.INFO](await rq(req.info(), { timeout: 1000, retries: 2 }));
  const newest = Math.max(0, ...[0, 2, 3, 4, 5].filter((id) => m.has(id)).map((id) => bkProjFormat(m.get(id))));
  if (newest > bkDevFormat(info)) throw new BackupError("bkNewer", `${file.firmware || "?"} > ${info.version}`);
  /* (2.6) a backup of a 2.6 FM-1 without object 10 had the MIDI settings at their defaults (nothing learned, channels
     1 2 3, drums 10, OTHER SEL, BEND 2): restored as such, not left as the device has them now */
  if (!m.has(10) && bkFwAtLeast(file.firmware, [2, 5, 1])) {
    const d = new Uint8Array(40);
    d.set([1, 2, 3, 10, 2], 32);
    m.set(10, d);
  }
  const total = [...m.values()].reduce((s, d) => s + d.length, 0) || 1;
  let done = 0;
  for (const id of BK.RESTORE) {
    if (!m.has(id)) continue;
    const d = m.get(id);
    let r = parse[CMD.BK_PUT](await rq(req.bkBegin(id, d.length, crc32(d)), { timeout: 1500, retries: 1 }));
    if ((r.rc === 1 || r.rc === 5) && (id === 8 || id === 9 || id === 10)) continue;   /* a device without the FM6 bank (v8) /
                                                       * the SYN kits (v9) / MIDI LEARN (2.6): skipped (its BK_PUT answers
                                                       * an unknown id's begin with 5) */
    if (r.rc) throw new BackupError("bkWrite", `begin ${id} rc ${r.rc}`);
    for (let off = 0; off < d.length; off += 256) {
      r = parse[CMD.BK_PUT](await rq(req.bkData(id, off, d.subarray(off, off + 256)), { timeout: 1500, retries: 1 }));
      if (r.rc) throw new BackupError("bkWrite", `data ${id}+${off} rc ${r.rc}`);
      done += Math.min(256, d.length - off);
      progress(done, total);
    }
    r = parse[CMD.BK_PUT](await rq(req.bkCommit(id), { timeout: 5000, retries: 0 }));
    if (r.rc === 3) throw new BackupError("bkStop", "stop the song first");
    if (r.rc) throw new BackupError("bkWrite", `commit ${id} rc ${r.rc}`);
  }
  for (const id of BK.SAMPLES) {
    if (!m.has(id)) continue;
    const d = m.get(id), k = id - 32;
    if (!d.length) {
      const e = parse[CMD.SMP_ERASE](await rq(req.smpErase(k), { timeout: 2500, retries: 0 }));
      if (e.rc) throw new BackupError("bkWrite", `erase USR${k + 1} rc ${e.rc}`);
      continue;
    }
    let r = parse[CMD.SMP_BEGIN](await rq(req.smpBegin(k), { timeout: 1000, retries: 0 }));
    if (r.rc) throw new BackupError("bkWrite", `USR${k + 1} begin rc ${r.rc}`);
    const data = d.subarray(SMP.DATA_OFF);
    for (let off = 0; off < data.length; off += 256) {
      const w = parse[CMD.SMP_WRITE](await rq(req.smpWrite(k, SMP.DATA_OFF + off, data.subarray(off, off + 256)), { timeout: 1000, retries: 1 }));
      if (w.rc) throw new BackupError("bkWrite", `USR${k + 1} write rc ${w.rc}`);
      done += Math.min(256, data.length - off);
      progress(done, total);
    }
    r = parse[CMD.SMP_END](await rq(req.smpEnd(k, d.subarray(0, SMP.HDR_LEN)), { timeout: 2000, retries: 0 }));
    if (r.rc) throw new BackupError("bkWrite", `USR${k + 1} end rc ${r.rc}`);
  }
  return true;
}

/* 2.5 Store cartridge: packed patches into B1..Bn in one write. The bank (backup object 8) is read whole, slots
   0..n-1 replaced, the others kept, and written back whole (BK_PUT, as a restore: one flash write, stopped only).
   -> 0 written, 3 the song plays (nothing changed), "old" a device without object 8 (before v9) */
async function fm6CartWrite(rq, packs) {
  if (!packs.length || packs.length > FM6.BANK_N) throw new Error(`bank: ${packs.length} voices`);
  const L = parse[CMD.BK_LIST](await rq(req.bkList(), { timeout: 5000, retries: 0 }));
  if (L.rc) throw new Error(`bank: LIST rc ${L.rc}`);
  const it = L.items.find((x) => x.id === 8);
  if (!it) return "old";
  const cur = new Uint8Array(it.len);
  for (let off = 0; off < it.len; off += 256) {
    const nn = Math.min(256, it.len - off);
    const g = parse[CMD.BK_GET](await rq(req.bkGet(8, off, nn), { timeout: 1500, retries: 2 }));
    if (g.rc || g.data.length !== nn) throw new Error(`bank: GET rc ${g.rc}`);
    cur.set(g.data, off);
  }
  const slots = FM6.bankUnobj(cur);                  /* a bank this page can't read is never overwritten */
  if (!slots) throw new Error("bank: unknown format");
  packs.forEach((pk, i) => { slots[i] = FM6.pack(FM6.unpack(pk)); });   /* every value in range, as fm6_bank_put */
  const d = FM6.bankObj(slots);
  let r = parse[CMD.BK_PUT](await rq(req.bkBegin(8, d.length, crc32(d)), { timeout: 1500, retries: 1 }));
  if (r.rc) throw new Error(`bank: begin rc ${r.rc}`);
  for (let off = 0; off < d.length; off += 256) {
    r = parse[CMD.BK_PUT](await rq(req.bkData(8, off, d.subarray(off, off + 256)), { timeout: 1500, retries: 1 }));
    if (r.rc) throw new Error(`bank: data rc ${r.rc}`);
  }
  r = parse[CMD.BK_PUT](await rq(req.bkCommit(8), { timeout: 5000, retries: 0 }));
  if (r.rc === 3) return 3;
  if (r.rc) throw new Error(`bank: commit rc ${r.rc}`);
  return 0;
}
/* 2.5: a user preset that plays bank slot k (B(k+1)): engine FM6, the voice's name, every value at its default
   (base: P_COUNT values; the macros neutral, so the patch plays as it is), PTCH (P_E7) = F count + k. A user preset
   keeps PTCH, not the patch (a record has no room for 128 bytes): loading it loads B(k+1) */
function fm6CartPreset(info, base, nf, k, name) {
  const p = Array.from({ length: info.pcount }, (_, i) => base[i] ?? 0);
  p[info.pe0 + 7] = nf + k;
  return { engine: info.engines.indexOf("FM6"), name: upName(name || `FM6 B${k + 1}`), p, pattern: [] };
}
/* the preset slots for n voices: from "free" = the first n free ones, from a slot s = s..s+n-1; null: no room */
function fm6CartSlots(list, n, from) {
  if (from === "free") {
    const f = list.slots.filter((x) => !x.used).map((x) => x.slot);
    return f.length >= n ? f.slice(0, n) : null;
  }
  const s = from | 0;
  return s >= 0 && s + n <= list.total ? Array.from({ length: n }, (_, i) => s + i) : null;
}
/* the presets after the bank (fm6CartWrite): one UP_PUT each -> 0, or the first rc (3: the song plays) */
async function fm6CartPresets(rq, puts) {
  for (const { slot, pt } of puts) {
    const rc = await bank.put(rq, slot, pt);
    if (rc) return rc;
  }
  return 0;
}

async function capturePatch(rq, info, name) {
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const steps = [];
  for (let i = 0; i < UP.PAT && i < info.nstep; i++) steps.push(parse[CMD.STEP_GET](await rq(req.stepGet(i))));
  return { patch: cleanPatch({ name, engine: dump.engine, engineName: info.engines[dump.engine], p: dump.p, pattern: patternFromSteps(steps) }), dump, steps };
}

/* what loading a sound leaves alone (firmware ui.c param_kept): the mix (LEVEL, PAN, MUTE), the pattern
   parameters (LEN, DIV, SWG, GATE) and the key the part plays in (ROOT, SCL, QNT; CHORD from SLOOP 2.0); the track FILTER (2.4) */
const keptIds = (info) => new Set([0, 25, 26, 27, 29, 30, 31, 32, 39, 40, ...(info.pe0 > 49 ? [49] : []), ...(info.pe0 > 50 ? [50] : []), ...(info.pe0 > 52 ? [51, 52] : [])]);
/* play a patch without writing flash, as UP_LOAD would load it: SET the engine (G_ENGSEL, engine defaults),
   then every parameter of the sound that differs. Never the pattern (LIVE: a sound never changes the
   sequence), the mix or the key. opt: {gEng: G_ENGSEL id, progress(i, n)} -> {wrote: false} */
async function auditionPatch(rq, info, pt, opt = {}) {
  await rq(req.set(1, opt.gEng ?? 20, pt.engine));
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const n = Math.min(info.pcount, pt.p.length), kept = keptIds(info);
  for (let i = 0; i < n; i++) {
    const v = pt.p[i];
    if (opt.progress) opt.progress(i, n);
    if (v == null || kept.has(i) || v === dump.p[i]) continue;
    await rq(req.set(0, i, v));
  }
  return { wrote: false };
}

/* WATCH on (asking for TRACK_CHANGED too): false when the firmware does not know it (older than protocol v2),
   else 1, or 3 when it also has TRACK_PARAM / TRACK_CHANGED (protocol v4) */
async function startWatch(rq) {
  try { const on = parse[CMD.WATCH](await rq(req.watch(3), { timeout: 300, retries: 1, quiet: true })).on; return on & 1 ? on & 3 : false; }
  catch (e) { if (e.message === "closed") throw e; return false; }
}

/* ------------------------------------------------------------ mixer (v3) --- */
/* The TRACKS page in the editor: TRACK (engine, preset, level, mute, armed of all four) and TRACK_DUMP
   of each track for its P_PAN. Level and mute go through TRACK_MIX (any track; the drum level is
   G_DRLVL). Pan: TRACK_PARAM (v4, any track); with v3 firmware a plain SET, which reaches only the
   selected track: another track is selected for it and the selection is put back (TRACK pushes no
   RELOAD). ids: {pan: P_PAN id} */
const mixer = {
  async read(rq, info, ids) {
    const tr = parse[CMD.TRACK](await rq(req.track()));
    for (let i = 0; i < tr.ntrk; i++) {
      const d = parse[CMD.TRACK_DUMP](await rq(req.trackDump(i)), info);
      tr.tracks[i].pan = ids.pan == null ? null : d.p[ids.pan];
      tr.tracks[i].e0 = d.p[info.pe0];               /* the drum track: its kit */
    }
    return tr;
  },
  /* -> {track, level, mute} as the device has them now */
  async setMix(rq, track, level, mute, opt) { return parse[CMD.TRACK_MIX](await rq(req.trackMix(track, level, mute), opt)); },
  /* -> the pan value after clamping. v4: TRACK_PARAM, the selection stays */
  async setPan(rq, track, sel, panId, v, v4) {
    if (v4) return parse[CMD.TRACK_PARAM](await rq(req.trackParam(track, panId, v), { key: "pan:" + track })).value;
    if (track === sel) return parse[CMD.SET](await rq(req.set(0, panId, v))).value;
    await rq(req.track(track));
    try { return parse[CMD.SET](await rq(req.set(0, panId, v))).value; }
    finally { await rq(req.track(sel)).catch(() => {}); }
  },
};

/* ------------------------------------------------------------ mock device --- */
/* Implements the protocol like firmware/src/editor.c, with tables copied from params.c
   and the engine sources. Used with ?mock=1 (add &legacy=1 for a firmware without cmds 16..26).
   opt: {legacy: no user bank / WATCH, v3: no TRACK_PARAM / TRACK_CHANGED (firmware 0.8),
         auto: false = no simulated knobs (tests drive sim.*),
         watchMs: how long WATCH lasts after the last request (3000), slots: user bank size (32)} */
/* ------------------------------------------------------------------- FM6 --- */
/* The FM6 engine's patches (eng_fm6.c, EDITOR_PROTOCOL.md "FM6 patches", firmware v9): the generic 6-operator voice.
   voice: 155 bytes, 6 x 21 operator bytes (the sixth operator first, as the format has them), then 19 voice bytes
   and a 10-character name. packed: the 128-byte record of a 32-voice bank (every byte 7-bit). SysEx files: a
   single voice (F0 43 0n 00 01 1B, 155 bytes, checksum, F7: 163 bytes) or 32 packed voices (F0 43 0n 09 20 00,
   4096 bytes, checksum, F7: 4104 bytes); raw 155 / 128 / 4096-byte files are read too, and damaged ones as far
   as they go (parseSysex). */
const FM6 = (() => {
  /* per operator byte: name, highest value; then the voice bytes */
  const OP = [["R1", 99], ["R2", 99], ["R3", 99], ["R4", 99], ["L1", 99], ["L2", 99], ["L3", 99], ["L4", 99],
    ["BP", 99], ["LD", 99], ["RD", 99], ["LC", 3], ["RC", 3], ["RS", 7], ["AMS", 3], ["KVS", 7], ["OL", 99],
    ["MODE", 1], ["FC", 31], ["FF", 99], ["DET", 14]];
  const VOICE = [["PR1", 99], ["PR2", 99], ["PR3", 99], ["PR4", 99], ["PL1", 99], ["PL2", 99], ["PL3", 99], ["PL4", 99],
    ["ALG", 31], ["FB", 7], ["OKS", 1], ["LFS", 99], ["LFD", 99], ["LPMD", 99], ["LAMD", 99], ["LKS", 1], ["LFW", 5],
    ["LPMS", 7], ["TRNSP", 48]];
  const OPI = Object.fromEntries(OP.map(([n], i) => [n, i])), VI = Object.fromEntries(VOICE.map(([n], i) => [n, 126 + i]));
  const NAME = 145, SIZE = 155, PACKED = 128;
  const max = (i) => (i < 126 ? OP[i % 21][1] : i < NAME ? VOICE[i - 126][1] : 126);
  /* byte i of operator n (1..6) */
  const at = (n, field) => (6 - n) * 21 + OPI[field];
  function sanitize(v) {
    const o = Uint8Array.from(v.slice(0, SIZE));
    for (let i = 0; i < SIZE; i++) o[i] = i >= NAME ? (o[i] < 32 || o[i] > 126 ? 32 : o[i]) : Math.min(o[i], max(i));
    return o;
  }
  function unpack(b) {                            /* eng_fm6.c fm6_unpack */
    const v = new Uint8Array(SIZE);
    for (let k = 0; k < 6; k++) {
      const o = k * 17, d = k * 21;
      for (let i = 0; i < 11; i++) v[d + i] = b[o + i] & 127;
      v[d + 11] = b[o + 11] & 3; v[d + 12] = b[o + 11] >> 2 & 3; v[d + 13] = b[o + 12] & 7; v[d + 20] = b[o + 12] >> 3 & 15;
      v[d + 14] = b[o + 13] & 3; v[d + 15] = b[o + 13] >> 2 & 7; v[d + 16] = b[o + 14] & 127; v[d + 17] = b[o + 15] & 1;
      v[d + 18] = b[o + 15] >> 1 & 31; v[d + 19] = b[o + 16] & 127;
    }
    for (let i = 0; i < 9; i++) v[126 + i] = b[102 + i] & 127;
    v[134] &= 31; v[135] = b[111] & 7; v[136] = b[111] >> 3 & 1;
    for (let i = 0; i < 4; i++) v[137 + i] = b[112 + i] & 127;
    v[141] = b[116] & 1; v[142] = b[116] >> 1 & 7; v[143] = b[116] >> 4 & 7; v[144] = b[117] & 127;
    for (let i = 0; i < 10; i++) v[NAME + i] = b[118 + i] & 127;
    return sanitize(v);
  }
  function pack(v) {                              /* eng_fm6.c fm6_pack */
    const b = new Array(PACKED).fill(0);
    for (let k = 0; k < 6; k++) {
      const o = k * 17, d = k * 21;
      for (let i = 0; i < 11; i++) b[o + i] = v[d + i] & 127;
      b[o + 11] = (v[d + 11] & 3) | (v[d + 12] & 3) << 2; b[o + 12] = (v[d + 13] & 7) | (v[d + 20] & 15) << 3;
      b[o + 13] = (v[d + 14] & 3) | (v[d + 15] & 7) << 2; b[o + 14] = v[d + 16] & 127;
      b[o + 15] = (v[d + 17] & 1) | (v[d + 18] & 31) << 1; b[o + 16] = v[d + 19] & 127;
    }
    for (let i = 0; i < 9; i++) b[102 + i] = v[126 + i] & 127;
    b[110] &= 31; b[111] = (v[135] & 7) | (v[136] & 1) << 3;
    for (let i = 0; i < 4; i++) b[112 + i] = v[137 + i] & 127;
    b[116] = (v[141] & 1) | (v[142] & 7) << 1 | (v[143] & 7) << 4; b[117] = v[144] & 127;
    for (let i = 0; i < 10; i++) b[118 + i] = v[NAME + i] & 127;
    return b;
  }
  const name = (v) => String.fromCharCode(...v.slice(NAME, NAME + 10)).replace(/\s+$/, "");
  function setName(v, s) {
    const t = String(s).toUpperCase().replace(/[^\x20-\x7E]/g, " ").slice(0, 10).padEnd(10, " ");
    for (let i = 0; i < 10; i++) v[NAME + i] = t.charCodeAt(i);
    return v;
  }
  const checksum = (a) => (128 - (a.reduce((s, x) => s + x, 0) & 127)) & 127;
  /* every voice in a file's bytes: [{name, v}] (after Felucca 1.0.3's editor: files cut short, banks with a bad
     checksum, several banks or voices in one file, raw 4096-byte banks one after another are read); badSum: messages
     whose checksum did not match (still read), short: messages cut short (their whole voices read), skipped / kinds:
     the SysEx that were not 6-operator voices (4-op, another maker, universal...), sysex: the file held any */
  function parseSysex(bytes) {
    const d = Uint8Array.from(bytes), voices = [], kinds = [];
    let badSum = 0, short = 0, skipped = 0;
    const add = (v) => voices.push({ v, name: name(v) });
    const kind = (k) => { skipped++; if (!kinds.includes(k)) kinds.push(k); };
    const sysex = d.includes(0xF0);
    if (d[0] !== 0xF0 && !sysex) {                  /* raw data: banks of 4096, one voice of 155 or packed 128 */
      if (d.length && d.length % 4096 === 0) {
        for (let o = 0; o < d.length; o += 128) add(unpack(d.subarray(o, o + 128)));
      } else if (d.length === SIZE) add(sanitize(d));
      else if (d.length === PACKED) add(unpack(d));
      return { voices, badSum, short, skipped, kinds, sysex };
    }
    for (let i = 0; i < d.length; i++) {
      if (d[i] !== 0xF0) continue;
      const id = d[i + 1], st = d[i + 2], f = d[i + 3];
      if (id === 0x43 && st !== undefined && (st & 0xF0) === 0 && (f === 0 || f === 9) && i + 6 <= d.length) {
        const want = f === 0 ? SIZE : 4096, s0 = i + 6;
        let e = s0;
        while (e < d.length && e < s0 + want && d[e] < 0x80) e++;
        const data = d.subarray(s0, e);
        if (data.length < want) short++;
        else if (e < d.length && d[e] < 0x80 && checksum(data) !== d[e]) badSum++;
        if (f === 0) {
          if (data.length >= NAME) { const v = new Uint8Array(SIZE); v.set(data); add(sanitize(v)); }
        } else {
          for (let o = 0; o + 118 <= data.length; o += 128) {    /* whole voices, and one cut in its name (at 118) */
            const pk = new Uint8Array(128); pk.set(data.subarray(o, o + 128)); add(unpack(pk));
          }
        }
        i = e - 1;                                  /* on to the next F0 (the checksum, F7, junk are passed over) */
        continue;
      }
      if (id === 0x43) kind(f === 3 || f === 4 ? "fm4" : "other43");
      else if (id === 0x7E || id === 0x7F) kind("universal");
      else if (id !== undefined && id < 0x80) kind("maker:" + (id === 0 ? [0, d[i + 2], d[i + 3]] : [id])
        .map((x) => (x ?? 0).toString(16).toUpperCase().padStart(2, "0")).join(" "));
    }
    return { voices, badSum, short, skipped, kinds, sysex };
  }
  function singleSysex(v, ch = 0) {
    const data = Array.from(sanitize(v));
    return Uint8Array.from([0xF0, 0x43, ch & 15, 0, 0x01, 0x1B, ...data, checksum(data), 0xF7]);
  }
  function bankSysex(voices, ch = 0) {            /* up to 32 voices (155 bytes each), the rest the init voice */
    const data = [];
    for (let k = 0; k < 32; k++) data.push(...(voices[k] ? pack(voices[k]) : INIT_PK));
    return Uint8Array.from([0xF0, 0x43, ch & 15, 9, 0x20, 0, ...data, checksum(data), 0xF7]);
  }
  /* the 32 algorithms (msfa's tables; fm6_core.c FM6_ALG): per operator, the sixth first */
  const ALG = [[0xc1, 0x11, 0x11, 0x14, 0x01, 0x14], [0x01, 0x11, 0x11, 0x14, 0xc1, 0x14], [0xc1, 0x11, 0x14, 0x01, 0x11, 0x14],
    [0xc1, 0x11, 0x94, 0x01, 0x11, 0x14], [0xc1, 0x14, 0x01, 0x14, 0x01, 0x14], [0xc1, 0x94, 0x01, 0x14, 0x01, 0x14],
    [0xc1, 0x11, 0x05, 0x14, 0x01, 0x14], [0x01, 0x11, 0xc5, 0x14, 0x01, 0x14], [0x01, 0x11, 0x05, 0x14, 0xc1, 0x14],
    [0x01, 0x05, 0x14, 0xc1, 0x11, 0x14], [0xc1, 0x05, 0x14, 0x01, 0x11, 0x14], [0x01, 0x05, 0x05, 0x14, 0xc1, 0x14],
    [0xc1, 0x05, 0x05, 0x14, 0x01, 0x14], [0xc1, 0x05, 0x11, 0x14, 0x01, 0x14], [0x01, 0x05, 0x11, 0x14, 0xc1, 0x14],
    [0xc1, 0x11, 0x02, 0x25, 0x05, 0x14], [0x01, 0x11, 0x02, 0x25, 0xc5, 0x14], [0x01, 0x11, 0x11, 0xc5, 0x05, 0x14],
    [0xc1, 0x14, 0x14, 0x01, 0x11, 0x14], [0x01, 0x05, 0x14, 0xc1, 0x14, 0x14], [0x01, 0x14, 0x14, 0xc1, 0x14, 0x14],
    [0xc1, 0x14, 0x14, 0x14, 0x01, 0x14], [0xc1, 0x14, 0x14, 0x01, 0x14, 0x04], [0xc1, 0x14, 0x14, 0x14, 0x04, 0x04],
    [0xc1, 0x14, 0x14, 0x04, 0x04, 0x04], [0xc1, 0x05, 0x14, 0x01, 0x14, 0x04], [0x01, 0x05, 0x14, 0xc1, 0x14, 0x04],
    [0x04, 0xc1, 0x11, 0x14, 0x01, 0x14], [0xc1, 0x14, 0x01, 0x14, 0x04, 0x04], [0x04, 0xc1, 0x11, 0x14, 0x04, 0x04],
    [0xc1, 0x14, 0x04, 0x04, 0x04, 0x04], [0xc4, 0x04, 0x04, 0x04, 0x04, 0x04]];
  /* operators 1..6 that are carriers (on the output bus), and the one with the feedback, of algorithm a (0..31) */
  const carriers = (a) => [1, 2, 3, 4, 5, 6].filter((n) => !(ALG[a & 31][6 - n] & 3));
  const feedbackOp = (a) => [1, 2, 3, 4, 5, 6].find((n) => (ALG[a & 31][6 - n] & 0xc0) === 0xc0);
  /* an operator's frequency as text: x ratio, or Hz for a fixed one (msfa note osc_freq) */
  function freqText(v, n) {
    const fc = v[at(n, "FC")], ff = v[at(n, "FF")];
    if (v[at(n, "MODE")]) return (10 ** ((fc & 3) + ff / 100)).toPrecision(4) + " Hz";

      while (i + d < len && steps[i + d] && steps[i + d].time === 1) d++;
      out.push({ at: i, dur: d, notes: s.notes.slice(0, s.n), vel: s.vel, flags: s.flags });
    }
    return out;
  },
  /* the chord sounding at step i (its NOTE step), or -1 */
  owner(steps, i) {
    for (let k = i; k >= 0; k--) {
      const s = steps[k];
      if (ROLL.isNote(s)) return k;
      if (!s || s.time !== 1) return -1;
    }
    return -1;
  },
  /* the steps after a chord that ends at `end` and were holding it (TIE) become rests */
  _cutTies(steps, len, end, out) {
    for (let k = end; k < len && steps[k] && steps[k].time === 1 && !out.has(k); k++) out.set(k, ROLL.rest());
  },
  /* put note `pitch` at step `at` for `dur` steps. On a chord's first step: added to it (it keeps its length,
     at most 4 notes). Inside a held chord: that chord ends there and a new one starts. Elsewhere: a new chord. */
  place(steps, len, at, pitch, dur) {
    const out = new Map(), s = steps[at];
    if (at < 0 || at >= len) return out;
    if (ROLL.isNote(s)) {
      if (s.notes.slice(0, s.n).includes(pitch) || s.n >= 4) return out;
      const notes = s.notes.slice(0, s.n).concat(pitch);
      out.set(at, { ...s, n: notes.length, notes: notes.concat([0, 0, 0, 0]).slice(0, 4) });
      return out;
    }
    out.set(at, { n: 1, notes: [pitch, 0, 0, 0], time: 0, flags: 0, vel: 96, lvl: 0, rat: 0 });
    let k = 1;
    for (; k < dur && at + k < len; k++) {
      const x = steps[at + k];
      if (ROLL.isNote(x)) break;                       /* the next chord: this one stops before it */
      out.set(at + k, ROLL.tie());
    }
    ROLL._cutTies(steps, len, at + k, out);            /* (inside a long chord: its rest is silence now) */
    return out;
  },
  /* take note `pitch` off the chord starting at `at`; the last one leaves rests where the chord was */
  remove(steps, len, at, pitch) {
    const out = new Map(), s = steps[at];
    if (!ROLL.isNote(s)) return out;
    const notes = s.notes.slice(0, s.n).filter((n) => n !== pitch);
    if (notes.length === s.n) return out;
    if (notes.length) { out.set(at, { ...s, n: notes.length, notes: notes.concat([0, 0, 0, 0]).slice(0, 4) }); return out; }
    out.set(at, ROLL.rest());
    ROLL._cutTies(steps, len, at + 1, out);
    return out;
  },
  /* the chord at `at` lasts `dur` steps: shorter, the steps it leaves become rests; longer, it ties over
     the rests after it, up to the next chord */
  resize(steps, len, at, dur) {
    const out = new Map();
    if (!ROLL.isNote(steps[at])) return out;
    let cur = 1;
    while (at + cur < len && steps[at + cur] && steps[at + cur].time === 1) cur++;
    dur = Math.max(1, Math.min(dur, len - at));
    if (dur < cur) for (let k = dur; k < cur; k++) out.set(at + k, ROLL.rest());
    else for (let k = cur; k < dur; k++) { if (ROLL.isNote(steps[at + k])) break; out.set(at + k, ROLL.tie()); }
    return out;
  },
};

/* ------------------------------------------ SLOOP 2.5: Standard MIDI Files --- */
const SMF = {
  PPQ: 96,
  /* ticks of one step at DIV div (a quarter = ppq ticks) */
  stepTicks: (div, ppq = SMF.PPQ) => Math.round(ppq * 4 / (ROLL.DIV_PER_BAR[div] ?? 16)),
  vlq(n) { const a = [n & 0x7F]; while ((n >>= 7)) a.unshift(0x80 | (n & 0x7F)); return a; },
  /* a format 0 file: notes [{t, dur, key, vel}] on channel ch (0..15), the tempo, a track name */
  write(notes, { ppq = SMF.PPQ, bpm = 120, ch = 0, name = "" } = {}) {
    const ev = [];
    for (const n of notes) {
      ev.push({ t: n.t, o: 1, b: [0x90 | ch, n.key & 0x7F, Math.max(1, Math.min(127, n.vel | 0))] });
      ev.push({ t: n.t + Math.max(1, n.dur), o: 0, b: [0x80 | ch, n.key & 0x7F, 0] });
    }
    ev.sort((a, b) => a.t - b.t || a.o - b.o);           /* (a note-off before a note-on at the same tick) */
    const us = Math.round(60000000 / Math.max(1, bpm));
    const nm = Array.from(String(name), (c) => c.charCodeAt(0) & 0x7F);
    const tr = [0, 0xFF, 0x51, 3, (us >> 16) & 255, (us >> 8) & 255, us & 255, 0, 0xFF, 0x58, 4, 4, 2, 24, 8];
    if (nm.length) tr.push(0, 0xFF, 0x03, ...SMF.vlq(nm.length), ...nm);
    let last = 0;
    for (const e of ev) { tr.push(...SMF.vlq(e.t - last), ...e.b); last = e.t; }
    tr.push(0, 0xFF, 0x2F, 0);
    const u32 = (n) => [(n >>> 24) & 255, (n >> 16) & 255, (n >> 8) & 255, n & 255];
    return Uint8Array.from([0x4D, 0x54, 0x68, 0x64, ...u32(6), 0, 0, 0, 1, (ppq >> 8) & 255, ppq & 255,
      0x4D, 0x54, 0x72, 0x6B, ...u32(tr.length), ...tr]);
  },
  /* -> {format, ppq, bpm, tracks: [{name, notes: [{t, dur, key, vel, ch}]}]}; throws on a non-MIDI file */
  read(bytes) {
    const d = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
    const str = (o) => String.fromCharCode(d[o], d[o + 1], d[o + 2], d[o + 3]);
    const u32 = (o) => ((d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3]) >>> 0;
    if (d.length < 14 || str(0) !== "MThd") throw new Error("not a MIDI file");
    const format = (d[8] << 8) | d[9], ntrk = (d[10] << 8) | d[11], div = (d[12] << 8) | d[13];
    if (div & 0x8000) throw new Error("SMPTE time is not supported");
    let o = 8 + u32(4), bpm = 0;
    const tracks = [];
    for (let k = 0; k < ntrk && o + 8 <= d.length; k++) {
      if (str(o) !== "MTrk") { o += 8 + u32(o + 4); k--; if (o >= d.length) break; continue; }
      const end = Math.min(d.length, o + 8 + u32(o + 4));
      let p = o + 8, t = 0, run = 0, name = "";
      const on = new Map(), notes = [];
      const vlq = () => { let n = 0, c; do { c = d[p++]; n = (n << 7) | (c & 0x7F); } while (c & 0x80 && p < end); return n; };
      const off = (ch, key) => {
        const q = on.get(ch * 128 + key);
        if (q && q.length) { const n = q.shift(); n.dur = Math.max(1, t - n.t); notes.push(n); }
      };
      while (p < end) {
        t += vlq();
        let st = d[p];
        if (st & 0x80) p++; else st = run;
        if (st === 0xFF) {
          const type = d[p++], len = vlq();
          if (type === 0x51 && len === 3 && !bpm) bpm = 60000000 / ((d[p] << 16) | (d[p + 1] << 8) | d[p + 2]);
          if (type === 0x03 && !name) name = String.fromCharCode(...d.subarray(p, p + len)).replace(/[^\x20-\x7E]/g, "");
          p += len;
          continue;
        }
        if (st === 0xF0 || st === 0xF7) { p += vlq(); continue; }
        run = st;
        const hi = st & 0xF0, ch = st & 15;
        const a = d[p++], b = hi === 0xC0 || hi === 0xD0 ? 0 : d[p++];
        if (hi === 0x90 && b) {
          const q = on.get(ch * 128 + a) || [];
          q.push({ t, dur: 0, key: a, vel: b, ch });
          on.set(ch * 128 + a, q);
        } else if (hi === 0x80 || (hi === 0x90 && !b)) off(ch, a);
      }
      for (const [k, q] of on) for (const n of q) { n.dur = Math.max(1, t - n.t); notes.push(n); }   /* (no note-off: to the end) */
      notes.sort((x, y) => x.t - y.t || x.key - y.key);
      tracks.push({ name, notes });
      o = end;
    }
    return { format, ppq: div || SMF.PPQ, bpm: Math.round(bpm || 120), tracks };
  },
  /* a synth track's steps -> notes (a chord's notes last its steps; the step's level as the device plays it) */
  fromSteps(steps, len, div, ppq = SMF.PPQ) {
    const tk = SMF.stepTicks(div, ppq), V = [0, 42, 72, 127], out = [];
    for (const c of ROLL.chords(steps, len)) {
      const s = steps[c.at], base = s.flags & 1 ? 127 : s.vel || 96;
      c.notes.forEach((key, i) => {
        const lv = (s.lvl >> (2 * i)) & 3;
        out.push({ t: c.at * tk, dur: c.dur * tk - Math.max(1, tk >> 4), key, vel: lv ? V[lv] : base });
      });
    }
    return out;
  },
  /* the drum track's steps -> GM notes on their lanes (a hit lasts a quarter of its step) */
  fromDrums(dsteps, len, div, ppq = SMF.PPQ) {
    const tk = SMF.stepTicks(div, ppq), V = [100, 42, 72, 127], out = [];
    for (let i = 0; i < len; i++) {
      const d = dsteps[i];
      if (!d) continue;
      for (let l = 0; l < 16; l++) if ((d.on >> l) & 1) out.push({ t: i * tk, dur: Math.max(1, tk >> 2), key: DRUM_LANES[l][0], vel: V[d.lvl[l] & 3] });
    }
    return out;
  },
  /* the GM drum note -> its lane (firmware drums.c LANE_OF_GM) */
  LANE_OF_GM: [1, 0, 7, 2, 3, 8, 9, 4, 9, 6, 9, 5, 10, 10, 11, 10, 12, 11, 12, 13, 11, 15, 11, 13, 12, 14, 14, 14, 14, 14,
    14, 14, 15, 15, 13, 13, 15, 15, 13, 13, 7, 7, 7, 14, 14, 15, 15],
  laneOf: (key) => (key < 35 ? 0 : key > 81 ? 13 : SMF.LANE_OF_GM[key - 35]),
  levelOf: (vel) => (vel < 56 ? 1 : vel < 88 ? 2 : vel < 116 ? 0 : 3),   /* (drums.c vel_lvl: GHOST, SOFT, NORM, HARD) */
  /* notes -> the steps of a track at DIV div, at most nstep. The report says what changed on the way:
     {notes, steps, moved (off the grid by more than a quarter step), chordCut (notes over 4 on a step),
      overlap (a chord cut short by the next one), dropped (past the last step), merged (on the same step)} */
  toSteps(notes, ppq, div, nstep, drum = false) {
    const tk = ppq * 4 / (ROLL.DIV_PER_BAR[div] ?? 16);
    const rep = { notes: notes.length, steps: 0, moved: 0, chordCut: 0, overlap: 0, dropped: 0, merged: 0 };
    const at = new Map();
    for (const n of notes) {
      const pos = n.t / tk, i = Math.round(pos);
      if (Math.abs(pos - i) > 0.25) rep.moved++;
      if (i >= nstep) { rep.dropped++; continue; }
      if (!at.has(i)) at.set(i, []);
      at.get(i).push({ ...n, end: Math.max(i + 1, Math.round((n.t + n.dur) / tk)) });
    }
    if (drum) {
      const ds = Array.from({ length: nstep }, emptyDrum);
      let last = -1;
      for (const [i, list] of at) {
        for (const n of list) {
          const l = SMF.laneOf(n.key);
          if ((ds[i].on >> l) & 1) { rep.merged++; continue; }
          ds[i].on |= 1 << l;
          ds[i].lvl[l] = SMF.levelOf(n.vel);
        }
        last = Math.max(last, i);
      }
      rep.steps = last + 1;
      return { dsteps: ds, len: Math.max(1, last + 1), report: rep };
    }
    const steps = Array.from({ length: nstep }, ROLL.rest);
    const starts = [...at.keys()].sort((a, b) => a - b);
    let last = -1;
    starts.forEach((i, k) => {
      let list = at.get(i);
      const keys = new Set();
      list = list.filter((n) => (keys.has(n.key) ? (rep.merged++, false) : keys.add(n.key)));
      if (list.length > 4) { rep.chordCut += list.length - 4; list = list.slice().sort((a, b) => b.vel - a.vel).slice(0, 4); }
      list.sort((a, b) => a.key - b.key);
      const vel = Math.max(...list.map((n) => n.vel));
      let end = Math.min(nstep, Math.max(...list.map((n) => n.end)));
      const next = k + 1 < starts.length ? starts[k + 1] : nstep;
      if (end > next) { rep.overlap++; end = next; }
      steps[i] = { n: list.length, notes: list.map((n) => n.key).concat([0, 0, 0, 0]).slice(0, 4), time: 0, flags: 0, vel, lvl: 0, rat: 0 };
      for (let j = i + 1; j < end; j++) steps[j] = ROLL.tie();
      last = Math.max(last, end - 1);
    });
    rep.steps = last + 1;
    return { steps, len: Math.max(1, last + 1), report: rep };
  },
};

/* ------------------------------------------- SLOOP 2.5: the song order --- */
/* The song order lives in the settings object (backup object 1, firmware project.c persist_t): bytes 48..83
   are arranger.h arr_config_t: count, loop, 2 reserved, then 16 x {scene 0..3 = A..D, bars 1..64}. */
const ARR = {
  OFF: 48, STEPS: 16, SIZE: 36, MAX_BARS: 64, MAGIC: 0x50455233,
  ok: (b) => !!b && b.length >= ARR.OFF + ARR.SIZE && ((b[0] | (b[1] << 8) | (b[2] << 16) | (b[3] << 24)) >>> 0) === ARR.MAGIC,
  decode(b) {
    const count = b[ARR.OFF], loop = b[ARR.OFF + 1], entries = [];
    for (let i = 0; i < Math.min(count, ARR.STEPS); i++) entries.push({ scene: b[ARR.OFF + 4 + 2 * i], bars: b[ARR.OFF + 5 + 2 * i] });
    return { loop: loop === 1, entries };
  },
  /* the settings bytes with this song order (the rest kept as it was) */
  encode(b, song) {
    const o = Uint8Array.from(b), e = song.entries;
    o[ARR.OFF] = e.length; o[ARR.OFF + 1] = song.loop ? 1 : 0; o[ARR.OFF + 2] = o[ARR.OFF + 3] = 0;
    for (let i = 0; i < ARR.STEPS; i++) {
      o[ARR.OFF + 4 + 2 * i] = i < e.length ? e[i].scene : i % 4;
      o[ARR.OFF + 5 + 2 * i] = i < e.length ? e[i].bars : 4;
    }
    return o;
  },
  /* arranger.h arr_valid: 1..16 entries, sections A..D, 1..64 bars */
  valid: (song) => song.entries.length >= 1 && song.entries.length <= ARR.STEPS
    && song.entries.every((e) => e.scene >= 0 && e.scene < 4 && e.bars >= 1 && e.bars <= ARR.MAX_BARS),
  /* entries -> rows {scene, bars, times}: the same section with the same bars in a row is one row played `times` */
  group(entries) {
    const rows = [];
    for (const e of entries) {
      const r = rows[rows.length - 1];
      if (r && r.scene === e.scene && r.bars === e.bars) r.times++;
      else rows.push({ scene: e.scene, bars: e.bars, times: 1 });
    }
    return rows;
  },
  expand: (rows) => rows.flatMap((r) => Array.from({ length: Math.max(1, r.times | 0) }, () => ({ scene: r.scene, bars: r.bars }))),
};


/* ------------------------------------- v10 (SLOOP 2.5): the SYN drum kits --- */
/* A synthesised drum sound is the firmware's dsnd_t (drum_synth.c, tools/gen_drumkits.py), 22 bytes in this order.
   The tone (a wave with a falling pitch, a second partial), the click, the noise (white, the 808's six metallic
   squares, both, a chip LFSR; the clap's bursts), a resonant filter, drive and level. A kit: 16 of them and its
   crush (bits dropped in the low nibble, sample-and-hold - 1 in the high one). */
const DSYN = {
  USER: 64, NUSER: 4, LANES: 16, SIZE: 22,
  FIELDS: ["wave", "src", "pitch", "fine", "bend", "btime", "hold", "decay", "tlev", "t2", "t2lev", "click",
    "nlev", "nhold", "ndec", "flt", "fcut", "fenv", "hpf", "chip", "drive", "level"],
  /* the synthesised lanes (DS_MAP order) and the GM note each plays without an offset (drum_synth.c DS_LANE_NOTE) */
  LANES_N: ["KICK", "SNARE", "CLAP", "HAT", "OPEN HAT", "LOW TOM", "HI TOM", "CRASH", "RIDE", "SHAKER", "CONGA", "RIM",
    "COWBELL", "CLAVE", "KICK 2", "SNARE 2"],
  LANE_NOTE: [36, 38, 39, 42, 46, 43, 48, 49, 51, 70, 63, 37, 56, 75, 35, 40],
  WAVES: ["OFF", "SINE", "TRI", "SQUARE", "FM", "BELL"],
  NOISES: ["OFF", "WHITE", "METAL", "CYM", "CHIP"],
  FMODES: ["OFF", "LP", "BP", "HP"],
  STEPS_PER_OCT: 127 / Math.log2(16000 / 30),
  /* 22 bytes -> the values the page edits */
  decode(b) {
    const g = (k) => b[DSYN.FIELDS.indexOf(k)] & 255;
    const f = g("flt"), src = g("src"), fe = g("fenv");
    return { wave: g("wave"), noise: src & 15, clap: (src >> 4) & 1, pitch: g("pitch"), fine: g("fine"), bend: g("bend"),
      btime: g("btime"), hold: g("hold"), decay: g("decay"), tlev: g("tlev"), t2: g("t2"), t2lev: g("t2lev"), click: g("click"),
      nlev: g("nlev"), nhold: g("nhold"), ndec: g("ndec"), fmode: f & 3, fall: (f >> 2) & 1, res: f >> 3, fcut: g("fcut"),
      fenv: fe > 127 ? fe - 256 : fe, hpf: g("hpf"), chip: g("chip"), drive: g("drive"), level: g("level") };
  },
  /* the values -> 22 bytes, into the ranges the firmware keeps (editor_dsyn.c dsu_fix_sound) */
  encode(o) {
    const c = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(+v || 0)));
    const v = { wave: c(o.wave, 0, 5), src: c(o.noise, 0, 4) | (o.clap ? 16 : 0), pitch: c(o.pitch, 0, 127), fine: c(o.fine, 0, 15),
      bend: c(o.bend, 0, 96), btime: c(o.btime, 0, 127), hold: c(o.hold, 0, 255), decay: c(o.decay, 0, 127), tlev: c(o.tlev, 0, 127),
      t2: c(o.t2, 0, 255), t2lev: c(o.t2lev, 0, 127), click: c(o.click, 0, 127), nlev: c(o.nlev, 0, 127), nhold: c(o.nhold, 0, 255),
      ndec: c(o.ndec, 0, 127), flt: c(o.fmode, 0, 3) | (o.fall ? 4 : 0) | (c(o.res, 0, 31) << 3), fcut: c(o.fcut, 0, 127),
      fenv: c(o.fenv, -128, 127) & 255, hpf: c(o.hpf, 0, 127), chip: c(o.chip, 0, 127), drive: c(o.drive, 0, 127), level: c(o.level, 0, 255) };
    return Uint8Array.from(DSYN.FIELDS.map((k) => v[k]));
  },
  /* what the numbers mean (tools/gen_tables.py, gen_drumkits.py) */
  hz: (note, fine = 0) => 440 * 2 ** ((note + fine / 16 - 69) / 12),
  decayMs: (i) => 5 * 800 ** (i / 127),
  cutHz: (i) => 30 * (16000 / 30) ** (i / 127),
  db: (level) => (level - 128) / 4,
  name8: (s) => { const b = new Uint8Array(8); String(s || "").replace(/[^\x20-\x7E]/g, "").slice(0, 8).split("").forEach((ch, i) => { b[i] = ch.charCodeAt(0); }); return b; },
  /* a kit as a file: {format, version, name, crush, sounds: [22 numbers] x 16} */
  FORMAT: "sloop-drumsynth",
  toFile: (k) => ({ format: DSYN.FORMAT, version: 1, name: k.name, crush: k.crush, sounds: k.sounds.map((x) => Array.from(x)) }),
  /* backup object 9: the firmware's dsu_bank_t ("DSU1", 1, 4, then per kit: name 8, crush, src, 2 reserved, 16 x 22) */
  BANK_SIZE: 8 + 4 * 364,
  bankEncode(kits) {
    const o = new Uint8Array(DSYN.BANK_SIZE);
    o.set([0x44, 0x53, 0x55, 0x31, 1, 0, 4, 0]);
    kits.forEach((k, i) => {
      const at = 8 + i * 364;
      o.set(DSYN.name8(k.name), at); o[at + 8] = k.crush & 255; o[at + 9] = k.src & 255;
      k.sounds.forEach((x, l) => o.set(x, at + 12 + l * DSYN.SIZE));
    });
    return o;
  },
  bankDecode(b) {
    if (!b || b.length !== DSYN.BANK_SIZE || b[0] !== 0x44 || b[1] !== 0x53 || b[2] !== 0x55 || b[3] !== 0x31 || b[4] !== 1 || b[6] !== 4) return null;
    return Array.from({ length: 4 }, (_, i) => {
      const at = 8 + i * 364;
      return { name: String.fromCharCode(...b.subarray(at, at + 8)).replace(/\0.*$/, ""), crush: b[at + 8], src: b[at + 9],
        sounds: Array.from({ length: DSYN.LANES }, (_, l) => b.slice(at + 12 + l * DSYN.SIZE, at + 12 + (l + 1) * DSYN.SIZE)) };
    });
  },
  fromFile(j) {
    if (!j || j.format !== DSYN.FORMAT || !Array.isArray(j.sounds) || j.sounds.length !== DSYN.LANES
      || j.sounds.some((x) => !Array.isArray(x) || x.length !== DSYN.SIZE)) throw new Error("not a SLOOP drum synth kit");
    return { name: String(j.name || "KIT").replace(/[^\x20-\x7E]/g, "").slice(0, 8), crush: (j.crush | 0) & 255,
      sounds: j.sounds.map((x) => DSYN.encode(DSYN.decode(Uint8Array.from(x, (v) => v & 255)))) };
  },
};

/* SET coalescing (userSet), per control key: last = when the user last changed it (touched()), sent = the value last
   requested. A value equal to the last request is skipped only while that request is still pending (queued or in
   flight): it carries it already. Once answered, the device may hold something else under the same key (another track
   or sound under the controls, a knob turned on the FM-1), so the same value is sent again (2.6: setting DIV 1/8 on
   one track, then 1/8 on another, sent nothing the second time). clear(): another track / sound / device */
class SetGate {
  constructor() { this.m = new Map(); }
  get(k) { return this.m.get(k); }
  user(k, v, pending, now) {
    let st = this.m.get(k);
    if (!st) this.m.set(k, (st = { last: 0, sent: null }));
    st.last = now;
    return !(pending && v === st.sent);
  }
  clear() { this.m.clear(); }
}

  showTab(n.dataset.tab);
  n.focus();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) showTab(h); });

const QS = new URLSearchParams(location.search);
const MOCK = QS.get("mock") === "1";
$("mock").hidden = !MOCK;
let mock = null;

/* -------------------------------------------------------------- state --- */
let access = null;     /* MIDIAccess */
let dev = null;        /* {link, input, output, info, pdesc[], gdesc[], names[][], dump, steps[], slotUsed[],
                          keys[] (paramKeys), watch (pushes on), bank ({total, slots[]} or null: no user bank)} */
let busy = 0;          /* multi-request operations in progress: no polling */
let dragging = null;   /* key of the slider being dragged */
let wantConnected = false;
const ctl = new Map(); /* key "s:id" -> {input, out, desc, scope, id, row} */
const sets = new SetGate(); /* key -> {last: time of the user's last change, sent: the value last requested} */
let needReload = false; /* a RELOAD push came: re-read DESC, DUMP and steps when free */
let lastDump = 0;      /* Date.now() of the last DUMP */
/* the device also pushes RELOAD after loads the editor asked for (SET of G_ENGSEL, PRESET, PROJECT load,
   UP_LOAD); the editor re-reads after those anyway, so it skips that many RELOADs for a moment */
const selfReload = { n: 0, until: 0 };
function selfLoad() {
  if (!dev || !dev.watch) return;
  const now = Date.now();
  selfReload.n = now < selfReload.until ? selfReload.n + 1 : 1;
  selfReload.until = now + 1500;
}
const stepEdit = new Map(); /* index -> time of the last edit */

/* parameter ids (firmware/src/core.h); used only when P_COUNT / G_COUNT match */
/* pcount 71 / pe0 63: 2.6's INSERT, filter TYPE, ENV SYNC, LFO 2 (P_ITYPE 53 .. P_LPOL 62, after Felucca 1.4 / 1.5) */
const EXPECT = { pcount: [61, 71], gcount: [32, 33, 45], pe0: [53, 63] };   /* gcount 33: 2.5's drum DLY (G_DRDLY); 45: 2.6's GLO > MIDI, TEXTURE, BEND */
const P = { LEVEL: 0, SLEN: 29, CHORD: 49 };
const LAYOUT = (pe0) => {
  const v251 = pe0 >= 63;                         /* (2.6: the pages the device has for the new parameters) */
  const opt = (yes, ...pages) => (yes ? pages : []);
  return [
    { t: "ENV", pages: [["ENV", 0, [1, 2, 3, 4]], ["ENV DEST", 0, [5, 6, 7, 8]], ...opt(v251, ["ENV SYNC", 0, [59]])] },
    { t: "LFO", pages: [["LFO", 0, [9, 10, 11, 12]], ...opt(v251, ["LFO 2", 0, [60, 61, 62]]), ["LFO DEST", 0, [13, 14, 15, 16]]] },
    { t: "EDIT", engine: true, pages: [["EDIT 1", 0, [pe0, pe0 + 1, pe0 + 2, pe0 + 3]], ["EDIT 2", 0, [pe0 + 4, pe0 + 5, pe0 + 6, pe0 + 7]],
      ...opt(v251, ["FILTER", 0, [58], 0])] },     /* (4th: the engine it is shown with: ANALOG's filter TYPE) */
    { t: "VOICE", pages: [["LEVEL", 0, [0]], ["VOICE", 0, [37, 38, 41, 42]], ["VOICE 2", 0, [43, 44, 39, 40]]] },
    { t: "FX", pages: [["FX", 0, [33, 34, 35, 36]], ["FILTER", 0, [50]], ["SLICER", 0, [45, 46, 47, 48]],
      ...opt(v251, ["INSERT", 0, [53, 54, 55, 56]], ["INSERT 2", 0, [57]]), ["DLY", 1, [4, 5, 6, 7]], ["REV/CHO", 1, [8, 9, 10, 11]]] },
    { t: "SEL", pages: [["SEL", 0, [25, 26, 27, 49]], ["SEL 2", 0, [28, 51, 52]]] },
    { t: "ARP", pages: [["ARP", 0, [17, 18, 19, 20]], ["ARP 2", 0, [21, 22, 23, 24]]] },
    { t: "SEQ PATTERN", tab: "seqgroups", pages: [["PATTERN", 0, [29, 30, 31, 32]]] },
    { t: "GLOBAL", tab: "setgroups", pages: [["GLOBAL", 1, [0, 1, 2, 3]]] },
    { t: "MASTER", tab: "setgroups", pages: [["MASTER", 1, [27, 28, 29, 30]]] },
    { t: "DRUMS", tab: "setgroups", pages: [["DRUMS", 1, [24, 25, 26, 32]]] },
    ...opt(v251, { t: "MIDI", tab: "setgroups", pages: [["MIDI", 1, [33, 34, 35, 24]], ["MIDI 2", 1, [14, 36, 12, 44]]] }),   /* CH1 CH2 CH3 CH4 (drums);
                                                     * IN OTHER OUT BEND (settings of the FM-1; IN and OUT: the FM-1 only, G_SKIP) */
    ...opt(v251, { t: "TEXTURE", tab: "setgroups", pages: [["TEXTURE", 1, [37, 38, 39, 40]], ["TEXTURE 2", 1, [41, 42, 43]]] }),   /* the bed */
  ];
};
/* globals that are actions or placeholders on the device: buttons instead, or hidden */
const G_SKIP = new Set(["SLOT", "NAME", "LOAD", "SAVE", "ENG", "SET", "CLRSQ", "INIT", "MIDI", "OUT", "SYNC", "ROUT", "IN", "CPU", "NEW"]);
const key = (s, id) => s + ":" + id;
const gEng = () => { const i = dev.gdesc.findIndex((d) => d && d.label === "ENG"); return i >= 0 ? i : 20; };
const pSlen = () => { const i = dev.pdesc.findIndex((d) => d && d.fmt === F.STEPS); return i >= 0 ? i : P.SLEN; };
/* mixer ids by DESC label (core.h: P_PAN 39, P_MUTE 40, G_DRLVL 25) */
const pById = (label, def) => { const i = dev.pdesc.findIndex((d, k) => d && k < dev.info.pe0 && d.label === label); return i >= 0 ? i : def; };
const pPan = () => pById("PAN", 39), pMute = () => pById("MUTE", 40);
const gDrLvl = () => { const i = dev.gdesc.findIndex((d, k) => d && k > gEng() && (d.label === "LVL" || d.label === "LEVEL")); return i >= 0 ? i : 25; };
const isDrum = () => !!dev && !!dev.dump && dev.dump.engine >= dev.info.nengines;
/* v5 (SLOOP 2.0): the drum track is edited as its 16 lanes (DRUM_STEP); older firmware: as GM notes */
const drumGrid = () => isDrum() && !!dev.info.proto && dev.info.proto >= 5;

/* -------------------------------------------------------------- MIDI --- */
async function connect() {
  wantConnected = true;
  if (!MOCK && !navigator.requestMIDIAccess) { sayK("nomidi"); return; }
  $("connect").disabled = true;
  sayK("connecting");
  try {
    if (!access) {
      if (MOCK) { mock = makeMockDevice({ legacy: QS.get("legacy") === "1" }); access = mock.access; }
      else {
        try { access = await navigator.requestMIDIAccess({ sysex: true }); }
        catch (e) { sayK("denied"); return; }
      }
      access.onstatechange = onState;
    }
    const isF = (p) => /felucca/i.test(p.name || "") && p.state !== "disconnected";
    const input = [...access.inputs.values()].find(isF);
    const output = [...access.outputs.values()].find(isF);
    if (!input || !output) { sayK("nodevice"); return; }
    const link = new Link((d) => output.send(d), {
      timeout: 300,
      onUnknown: (f) => console.debug("ignored reply", f),
      onTimeout: () => sayK("noreply"),
      onPush: (f) => onPush(f),
      onGap: () => { rewatch = true; },
    });
    input.onmidimessage = (e) => link.receive(e.data);
    if (input.open) await input.open().catch(() => {});
    dev = { link, input, output, info: null, pdesc: [], gdesc: [], names: [], dump: null, steps: [], slotUsed: [null, null, null, null],
      keys: null, watch: false, bank: null };
    sets.clear();                                    /* (another FM-1, maybe) */
    setLabel($("connect"), t("disconnect"));
    renderLive();
    await load(dev);
  } catch (e) {
    console.error(e);
    if (dev) {                                       /* not unplugged meanwhile (that says "lost") */
      const timeout = /^timeout/.test(e.message);
      disconnect();
      sayK(timeout ? "noreply" : "error", timeout ? "" : e.message);
    }
  } finally {
    $("connect").disabled = false;
  }
}

function disconnect(reasonKey = "disconnected") {
  if (dev) {
    dev.link.close();
    dev.input.onmidimessage = null;
  }
  dev = null;
  busy = 0;
  needReload = false;
  renderPanels();
  renderMixer();
  renderSysinfo();
  renderLive();
  renderLib();
  renderBank();
  $("version").textContent = "";
  setLabel($("connect"), t("connect"));
  sayK(reasonKey);
}

function onState(e) {
  const p = e.port;
  if (!p || !/felucca/i.test(p.name || "")) return;
  if (dev && p.state === "disconnected" && (p.id === dev.input.id || p.id === dev.output.id)) {
    disconnect("lost");
  } else if (!dev && wantConnected && p.state === "connected" && p.type === "output") {
    clearTimeout(onState.tm);                       /* the device came back: reconnect */
    onState.tm = setTimeout(() => { if (!dev && wantConnected) connect(); }, 800);
  }
}

const rq = (r, opt) => dev.link.request(r, opt);
async function getDesc(scope, id) { return parse[CMD.DESC](await rq(req.desc(scope, id))); }
async function getDump() { lastDump = Date.now(); return parse[CMD.DUMP](await rq(req.dump()), dev.info); }
async function getStep(i) { return parse[CMD.STEP_GET](await rq(req.stepGet(i))); }
async function getDrumStep(i) { return parse[CMD.DRUM_STEP](await rq(req.drumStep(i))); }
/* a drum step as an old step (firmware ed_dstep_old): for what still reads dev.steps */
function drumAsStep(d) {
  const notes = [];
  for (let l = 0; l < 16 && notes.length < 4; l++) if ((d.on >> l) & 1) notes.push(DRUM_LANES[l][0]);
  return { index: d.index, n: notes.length, notes: [...notes, 0, 0, 0, 0].slice(0, 4), time: notes.length ? 0 : 2, flags: 0, vel: notes.length ? 100 : 0 };
}

/* the whole connect sequence */
async function load(d) {
  busy++;
  try {
    /* the first frame after opening the port can be lost: a few tries */
    d.info = parse[CMD.INFO](await d.link.request(req.info(), { timeout: 500, retries: 3 }));
    $("version").textContent = d.info.version;
    const total = d.info.pcount + d.info.gcount;
    for (let i = 0; i < d.info.pcount; i++) { sayK("reading", `${i + 1}/${total}`); d.pdesc[i] = await getDescOrNull(0, i); }
    for (let i = 0; i < d.info.gcount; i++) { sayK("reading", `${d.info.pcount + i + 1}/${total}`); d.gdesc[i] = await getDescOrNull(1, i); }
    const kd = d.pdesc[d.info.pe0];
    if (kd && kd.label === "KIT" && kd.names.length) d.kitNames = kd.names;   /* (the drum track was selected) */
    d.titles = [];
    for (let e = 0; e < d.info.nengines; e++) {
      const r = parse[CMD.NAMES](await d.link.request(req.names(e)));
      d.names[e] = r.names;
      d.titles[e] = r.titles;
    }
    for (let k = 0; k < 4; k++) {                    /* PROJECT op 2: is the slot used */
      try { d.slotUsed[k] = parse[CMD.PROJECT](await d.link.request(req.project(2, k))).used; }
      catch (e) { if (e.message === "closed") throw e; }
    }
    try { d.smp = parse[CMD.SMP_INFO](await d.link.request(req.smpInfo())); }
    catch (e) { if (e.message === "closed") throw e; d.smp = null; }   /* older firmware, or no flash */
    d.keys = paramKeys(d.pdesc, d.info.pe0, d.info.pcount);
    d.fm6 = null;                                     /* v9: the FM6 patch slots (FM6_LIST), else null */
    if (d.info.proto >= 9) {
      try { d.fm6 = parse[CMD.FM6_LIST](await d.link.request(req.fm6List())); }
      catch (e) { if (e.message === "closed") throw e; }
    }
    fm6Names(d);
    await libAdopt(d);
    if (d.info.ntrk) d.sel = parse[CMD.TRACK](await d.link.request(req.track())).sel;   /* v3: the selected track */
    d.dump = await getDump();
    buildUI();
    renderPanels();
    await loadSteps();
    if (d.info.ntrk) await readMixer();
    /* protocol v2: live pushes and the user bank; older firmware: DUMP polling, no bank */
    const rqd = (r, o) => d.link.request(r, o);
    d.watch = await startWatch(rqd);
    d.v4 = d.watch === 3;                           /* TRACK_PARAM / TRACK_CHANGED */
    if (d.watch) {
      sayK("readingBank");
      try { d.bank = await bank.list((r, o) => d.link.request(r, { ...o, quiet: true })); }
      catch (e) { if (e.message === "closed") throw e; d.bank = null; }
    }
    renderLive();
    renderLib();
    renderBank();
    renderSysinfo();
    sayK("ready");
  } finally { busy--; }
}
async function getDescOrNull(s, i) { try { return await getDesc(s, i); } catch (e) { if (e.message === "closed") throw e; return null; } }

/* rebuilds the controls only when the engine or its parameters changed (a slider being dragged survives) */
async function rereadEngineDesc() {
  const pe0 = dev.info.pe0;
  const before = JSON.stringify(dev.pdesc.slice(pe0));
  for (let i = 0; i < 8 && pe0 + i < dev.info.pcount; i++) dev.pdesc[pe0 + i] = await getDescOrNull(0, pe0 + i);
  const kd = dev.pdesc[pe0];
  if (kd && kd.label === "KIT" && kd.names.length) dev.kitNames = kd.names;   /* the drum track's kits, for the mixer */
  fm6Names();
  if (dev.built !== dev.dump.engine || JSON.stringify(dev.pdesc.slice(pe0)) !== before) buildGroups();
}

async function loadSteps() {
  const n = dev.info.nstep, drum = drumGrid();
  if (!dev.dsteps) dev.dsteps = [];
  for (let i = 0; i < n; i++) {
    if (i % 8 === 0) sayK("steploading", `${i}/${n}`);
    if (drum) { dev.dsteps[i] = await getDrumStep(i); dev.steps[i] = drumAsStep(dev.dsteps[i]); }
    else dev.steps[i] = await getStep(i);
  }
  dev.dstepsOk = drum;
  await loadLocks();
  renderSteps();
}
/* v7: the selected track's nudges and locks (none on older firmware); v8: its fill conditions too */
const hasLocks = () => !!dev && !!dev.info && dev.info.proto >= 7;
const hasFill = () => !!dev && !!dev.info && dev.info.proto >= 8;
async function loadLocks() {
  const d = dev;
  if (!hasLocks()) { d.micro = null; d.locks = null; d.fill = null; return; }
  const m = parse[CMD.MICRO_GET](await rq(req.microGet(d.sel), { key: "micro" }));
  const l = parse[CMD.LOCK_GET](await rq(req.lockGet(d.sel), { key: "locks" }));
  const f = hasFill() ? parse[CMD.FILL_GET](await rq(req.fillGet(d.sel), { key: "fill" })) : null;
  if (d !== dev) return;
  d.micro = m.micro;
  d.locks = l.locks;
  d.fill = f ? f.fill : null;
}

/* --------------------------------------------------------------- UI --- */
function buildUI() {
  const sel = $("engine");
  sel.replaceChildren(...dev.info.engines.map((n, i) => el("option", { value: i, text: n })));
  dev.mix = null;
  buildGroups();
  updateBrowser();
  renderSlots();
  renderSamples();
  renderSysinfo();
  $("bkgroup").hidden = !(dev.info.proto >= 6);       /* v6 firmware: backup / restore */
}

/* the track selector (v3): T1..T3 synth parts, T4 the drum track; the editor shows the selected one */
/* the device's track colours (ui_studio.c TE_COL): the selected one is the editor's accent (--trk) */
const TCOL = ["var(--t1)", "var(--t2)", "var(--t3)", "var(--t4)"];
function renderTrackbar() {
  const box = $("trackbtns");
  const ntrk = hasTracks() ? dev.info.ntrk : 0;
  if (box.children.length !== ntrk || box.dataset.lang !== lang) {
    box.dataset.lang = lang;
    box.replaceChildren(...Array.from({ length: ntrk }, (_, i) => el("button", { type: "button", "data-i": i, style: `--c:${TCOL[i % 4]}`,
      onclick: () => selectTrack(i) }, el("span", { class: "no", text: String(i + 1) }), el("span", { class: "nm" }))));
  }
  for (const b of box.children) {
    const i = +b.dataset.i, x = dev.mix && dev.mix.tracks[i];
    b.setAttribute("aria-pressed", i === (dev.sel || 0) ? "true" : "false");
    const nm = !x ? [i === ntrk - 1 ? "DRUMS" : "", ""] : x.engine >= dev.info.nengines ? [(dev.kitNames || [])[x.e0] || "", "drums"]
      : [(dev.names[x.engine] || [])[x.preset] || "", String(dev.info.engines[x.engine] || "").toLowerCase()];
    b.lastChild.replaceChildren(nm[0] + " ", el("span", { class: "dim", text: nm[1] }));
    b.title = `${t("track")} ${i + 1}`;
  }
  document.documentElement.style.setProperty("--trk", TCOL[(dev.sel || 0) % 4]);
}
function selectTrack(i) {
  if (!dev || !hasTracks() || i === dev.sel) return;
  op(async () => {
    dev.sel = parse[CMD.TRACK](await rq(req.track(i))).sel;
    await afterSoundChange();
  });
}

/* settings > system: what the device reported */
function renderSysinfo() {
  const box = $("sysinfo");
  if (!dev || !dev.info) { box.replaceChildren(); return; }
  const i = dev.info;
  const rows = [
    ["firmware", i.version], ["sync", t(dev.watch ? "live" : "polling")], ["enginesL", i.engines.join(", ")],
    ["tracksN", i.ntrk ? String(i.ntrk) : "1"], ["stepsN", String(i.nstep)],
    ["smpSlots", dev.smp ? `${dev.smp.nslots} × ${dev.smp.slotKiB} KiB` : t("none")],
    ["userBank", dev.bank ? String(dev.bank.total) : t("none")],
  ];
  box.replaceChildren(...rows.map(([k, v]) => el("tr", {}, el("th", { text: t(k) }), el("td", { text: v }))));
}

function updateBrowser() {
  const e = dev.dump.engine;
  const sel = $("engine");
  const drum = e >= dev.info.nengines;              /* the drum track: no engine, no presets */
  renderTrackbar();
  sel.disabled = drum;
  $("preset").disabled = drum;
  $("init").disabled = drum;
  $("factlib").disabled = drum;
  $("drumnote").hidden = !drum;
  $("browser").hidden = drum;
  $("groups").hidden = drum;
  $("ctlhelp").hidden = drum;
  if (document.activeElement !== sel) sel.value = drum ? "" : String(e);
  const ps = $("preset");
  const names = dev.names[e] || [];
  if (ps.dataset.engine !== String(e)) {
    ps.replaceChildren(...names.map((n, i) => el("option", { value: i, text: n })));
    ps.dataset.engine = String(e);
  }
  if (document.activeElement !== ps) ps.value = String(dev.dump.preset);
  fm6Show();
}

function visible(d) { return d && d.max > d.min && d.label !== "-"; }

function buildGroups() {
  ctl.clear();
  dev.built = dev.dump.engine;
  /* Sound: the selected track's parameters; Sequencer: its pattern settings; Settings: globals and drums */
  const groups = { groups: [], seqgroups: [], setgroups: [] };
  const { info } = dev;
  const known = EXPECT.pcount.indexOf(info.pcount);
  if (known >= 0 && EXPECT.gcount.includes(info.gcount) && info.pe0 === EXPECT.pe0[known]) {
    for (const g of LAYOUT(info.pe0)) {
      /* a card per button of the device (ENV, LFO, EDIT ...), its pages as rows of four knobs, one colour per knob */
      const div = el("div", { class: "group" }, el("h2", { ic: HEAD_IC[g.t] },
        g.engine ? `EDIT ${info.engines[dev.dump.engine] || ""}` : g.t));
      let pages = 0;
      for (const [title, s, ids, onlyEng] of g.pages) {
        if (onlyEng != null && dev.dump.engine !== onlyEng) continue;
        const rows = ids.map((id) => paramRow(s, id)).filter(Boolean);
        if (!rows.length) continue;
        const tt = g.engine && (dev.titles[dev.dump.engine] || [])[g.pages.findIndex((x) => x[0] === title)];
        if (g.pages.length > 1) div.append(el("h3", { ic: PAGE_IC[tt || title], text: tt || title }));
        div.append(el("div", { class: "knobs" }, ...rows));
        pages++;
      }
      if (pages > 1) div.firstChild.append(el("span", { class: "sub", text: `${pages} ${lang === "ja" ? "ページ" : "pages"}` }));
      if (pages) groups[g.tab || "groups"].push(div);
    }
  } else {
    /* unknown firmware layout: everything in id order, four knobs a row */
    const box = (ic, title, ...pre) => el("div", { class: "group" }, el("h2", { ic: HEAD_IC[ic], text: title }), ...pre);
    const a = box("INSTRUMENT", "INSTRUMENT", el("p", { class: "dim", text: t("layout") }));
    const b = box("EDIT", "EDIT"), c = box("GLOBAL", "GLOBAL");
    const ka = el("div", { class: "knobs" }), kb = el("div", { class: "knobs" }), kc = el("div", { class: "knobs" });
    for (let i = 0; i < info.pcount; i++) { const r = paramRow(0, i); if (r) (i >= info.pe0 ? kb : ka).append(r); }
    for (let i = 0; i < info.gcount; i++) { const r = paramRow(1, i); if (r) kc.append(r); }
    a.append(ka); b.append(kb); c.append(kc);
    groups.groups.push(a, b);
    groups.setgroups.push(c);
  }
  for (const [id, divs] of Object.entries(groups)) $(id).replaceChildren(...divs);
}

function paramRow(s, id) {
  const d = s ? dev.gdesc[id] : dev.pdesc[id];
  if (!visible(d) || (s === 1 && G_SKIP.has(d.label))) return null;
  const k = key(s, id);
  let input;
  if (d.fmt === F.ENUM || d.fmt === F.NOTE || d.fmt === F.ONOFF) {
    const wave = RICH_SELECT && d.fmt === F.ENUM && /^WAVE2?$/.test(d.label);
    input = el("select", { class: wave ? "wave" : null });
    /* the closed select shows a copy of the chosen option (icon span included), not its bare text */
    if (wave) input.append(el("button", {}, el("selectedcontent")));
    for (let v = d.min; v <= d.max; v++) {
      const [txt] = fmtValue(d, v);
      const name = d.fmt === F.ENUM && d.names[v - d.min] == null ? String(v) : txt;
      input.append(el("option", { value: v, ic: wave && WAVE_IC[name] }, name));
    }
    input.addEventListener("change", () => userSet(s, id, +input.value, true));
  } else {
    input = el("input", { type: "range", min: d.min, max: d.max, step: 1 });
    input.addEventListener("pointerdown", () => { dragging = k; });
    input.addEventListener("input", () => userSet(s, id, +input.value, false));
    input.addEventListener("change", () => userSet(s, id, +input.value, true));
    input.addEventListener("dblclick", () => { input.value = d.def; userSet(s, id, d.def, true); });
    /* fine adjust: wheel over the focused slider, Shift+arrows in steps of 10 (plain arrows are native) */
    const nudge = (dv) => {
      const nv = Math.max(d.min, Math.min(d.max, +input.value + dv));
      if (nv !== +input.value) { input.value = String(nv); userSet(s, id, nv, true); }
    };
    let acc = 0;
    input.addEventListener("wheel", (e) => {
      if (document.activeElement !== input) return;
      e.preventDefault();
      acc += (e.deltaMode === 1 ? 33 : 1) * (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? -e.deltaY : e.deltaX);
      const n = Math.trunc(acc / 50);
      if (n) { acc -= n * 50; nudge(n * (e.shiftKey ? 10 : 1)); }

/* MIDI files: the selected track's pattern out as a .mid, a .mid in (a preview first) */
function midiExport() {

  if (!notes.length) { sayK("midiEmpty"); return; }

const midiDrum = () => isDrum() && drumGrid() && !!dev.dstepsOk;

    el("p", { class: "dim", text: t(midiDrum() ? "midiHowDrum" : "midiHow") }),
    el("p", { class: "bar" }, el("label", {}, setlen, " " + t("midiSetLen").replace("{n}", plan.len)),
      el("button", { type: "button", class: "pri", onclick: midiImport }, t("midiImport")), cancel));

}
async function midiImport() {
  if (!MI || !dev) return;

  const plan = midiPlan(), setlen = $("midisetlen").checked;
  busy++;

        const r = parse[CMD.DRUM_STEP](await rq(req.drumStep(i, plan.dsteps[i])));

/* ---- SLOOP 2.5: the DRUM SYNTH page (firmware v10, editor_dsyn.c): SYN1..SYN4, your synthesised kits ----
   Every change goes to the FM-1's RAM at once (the drum voices play from there); STORE keeps the four kits in flash
   (with the settings, the song stopped). A sound's values as the firmware's dsnd_t (DSYN.decode / encode). */
const DS = { dev: null, list: null, k: 0, kit: null, lane: 0, src: null, err: "", timer: 0, pend: new Set() };
const dsOk = () => !!dev && !!dev.info && dev.info.proto >= 10;
const dsKitName = (k = DS.k) => `SYN${k + 1}`;
const dsMs = (ms) => (ms >= 1000 ? `${(ms / 1000).toFixed(ms >= 10000 ? 0 : 1)}` : `${Math.round(ms)}`);
const dsHz = (hz) => (hz >= 1000 ? `${(hz / 1000).toFixed(hz >= 10000 ? 0 : 1)}k` : `${Math.round(hz)}`);
const NOTE12 = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const dsNote = (n) => `${NOTE12[n % 12]}${Math.floor(n / 12) - 1}`;
/* the page's values: [key, label, min, max, format -> [value, unit]] by group */
const DS_GROUPS = [
  ["dsTone", [
    ["wave", "WAVE", 0, 5, (v) => [DSYN.WAVES[v]], DSYN.WAVES],
    ["pitch", "PITCH", 0, 127, (v, o) => [dsNote(v), `${dsHz(DSYN.hz(v, o.fine))} Hz`]],
    ["fine", "FINE", 0, 15, (v) => [`+${v}`, "/16"]],
    ["bend", "BEND", 0, 96, (v) => [v, "st"]],
    ["btime", "B.TIME", 0, 127, (v) => [dsMs(DSYN.decayMs(v)), DSYN.decayMs(v) >= 1000 ? "s" : "ms"]],
    ["hold", "HOLD", 0, 255, (v) => [v * 2, "ms"]],
    ["decay", "DECAY", 0, 127, (v) => [dsMs(DSYN.decayMs(v)), DSYN.decayMs(v) >= 1000 ? "s" : "ms"]],
    ["tlev", "LEVEL", 0, 127, (v) => [v]],
    ["t2", "2ND", 0, 255, (v) => (v ? [`×${(v / 32).toFixed(2)}`] : ["OFF"])],
    ["t2lev", "2ND LVL", 0, 127, (v) => [v]],
    ["click", "CLICK", 0, 127, (v) => [v]]]],
  ["dsNoise", [
    ["noise", "NOISE", 0, 4, (v) => [DSYN.NOISES[v]], DSYN.NOISES],
    ["clap", "CLAP", 0, 1, (v) => [v ? "ON" : "OFF"], ["OFF", "ON"]],
    ["nlev", "LEVEL", 0, 127, (v) => [v]],
    ["nhold", "HOLD", 0, 255, (v) => [v * 2, "ms"]],
    ["ndec", "DECAY", 0, 127, (v) => [dsMs(DSYN.decayMs(v)), DSYN.decayMs(v) >= 1000 ? "s" : "ms"]],
    ["hpf", "HPF", 0, 127, (v) => (v ? [dsHz(DSYN.cutHz(v)), "Hz"] : ["OFF"])],
    ["chip", "CHIP", 0, 127, (v) => (v ? [dsHz(DSYN.hz(v) * 8), "Hz"] : ["-"])]]],
  ["dsFilter", [
    ["fmode", "FILTER", 0, 3, (v) => [DSYN.FMODES[v]], DSYN.FMODES],
    ["fall", "ON", 0, 1, (v) => [v ? "ALL" : "NOISE"], ["NOISE", "ALL"]],
    ["fcut", "CUTOFF", 0, 127, (v) => [dsHz(DSYN.cutHz(v)), "Hz"]],
    ["res", "RES", 0, 31, (v) => [Math.round((v * 100) / 31), "%"]],
    ["fenv", "ENV", -128, 127, (v) => [`${v > 0 ? "+" : ""}${(v / DSYN.STEPS_PER_OCT).toFixed(1)}`, "oct"]]]],
  ["dsOut", [
    ["drive", "DRIVE", 0, 127, (v) => [v]],
    ["level", "LEVEL", 0, 255, (v) => [`${v >= 128 ? "+" : ""}${DSYN.db(v).toFixed(1)}`, "dB"]]]],
];
const dsCtl = new Map();                 /* key -> {input, out, def, fmt, sel} */
function dsSound() { return DSYN.decode(DS.kit.sounds[DS.lane]); }
function dsKnob([key, label, min, max, fmt, names]) {
  const o = dsSound();
  let input, out = el("span", { class: "v", title: label });
  if (names) {
    input = el("select", { title: label, onchange: () => dsSet(key, +input.value, true) },
      ...names.map((n, i) => el("option", { value: i + min, text: n })));
  } else {
    input = el("input", { type: "range", min, max, step: 1, title: label });
    input.addEventListener("input", () => dsSet(key, +input.value, false));
    input.addEventListener("change", () => dsSet(key, +input.value, true));
    input.addEventListener("dblclick", () => dsSet(key, dsDefault(key), true));
    let y0 = 0, v0 = 0, on = false;                   /* drag the value up / down like a knob (Shift: fine) */
    out.addEventListener("pointerdown", (e) => { if (e.button) return; on = true; y0 = e.clientY; v0 = +input.value; out.setPointerCapture(e.pointerId); e.preventDefault(); });
    out.addEventListener("pointermove", (e) => {
      if (!on) return;
      const per = Math.max((max - min) / (e.shiftKey ? 800 : 200), e.shiftKey ? 0.05 : 0.12);
      const v = Math.max(min, Math.min(max, Math.round(v0 + (y0 - e.clientY) * per)));
      if (v !== +input.value) dsSet(key, v, false);
    });
    const end = () => { if (on) { on = false; dsSet(key, +input.value, true); } };
    out.addEventListener("pointerup", end);
    out.addEventListener("pointercancel", end);
    out.addEventListener("dblclick", () => dsSet(key, dsDefault(key), true));
  }
  const row = el("div", { class: "knob" + (names ? " enum" : "") }, el("span", { class: "kl", text: label }), out, input);
  dsCtl.set(key, { input, out, fmt, names, min, max });
  dsShowValue(key, o[key], o);
  return row;
}
function dsShowValue(key, v, o) {
  const c = dsCtl.get(key);
  if (!c) return;
  c.input.value = String(v);
  const [txt, unit] = c.fmt(v, o);
  c.out.replaceChildren(String(txt), ...(unit ? [el("small", { text: unit })] : []));
  c.out.classList.toggle("long", String(txt).length + (unit ? Math.ceil(unit.length / 2) : 0) > 6);
  if (!c.names) {
    const pc = (x) => ((x - c.min) / (c.max - c.min)) * 100, p = pc(v), z = c.min < 0 ? pc(0) : 0;
    c.input.style.setProperty("--a", Math.min(p, z).toFixed(1) + "%");
    c.input.style.setProperty("--p", Math.max(p, z).toFixed(1) + "%");
  }
}
/* the value of the sound the kit started from (a double-click puts it back) */
function dsDefault(key) {

}
function dsSet(key, v, done) {

  DS.kit.sounds[DS.lane] = DSYN.encode(o);
  const n = DSYN.decode(DS.kit.sounds[DS.lane]);
  for (const k of dsCtl.keys()) dsShowValue(k, n[k], n);
  DS.pend.add(DS.lane);

  clearTimeout(DS.timer);

}
async function dsFlush(play) {
  const k = DS.k;

    DS.pend.delete(l);
    const r = parse[CMD.DSYN_PUT](await rq(req.dsynSound(k, l, DS.kit.sounds[l])));
    if (r.rc) { sayK("dsBad"); return; }
  }
  if (play) await dsPlay();
}
async function dsPlay(lane = DS.lane) {

}
function dsDirty(on) {

}
async function dsLoad(k = DS.k) {

  if (r.rc) throw new Error(`DSYN_GET rc ${r.rc}`);
  DS.k = k;
  DS.kit = { name: r.name, crush: r.crush, src: r.src, sounds: r.sounds };
  const f = parse[CMD.DSYN_GET](await rq(req.dsynGet(r.src)));   /* the kit it started from: double-click resets to it */
  DS.src = f.rc ? null : { sounds: f.sounds };

}
function renderDs() {
  const box = $("dsbody");
  $("dsold").hidden = dsOk();
  box.hidden = !dsOk() || !DS.kit;
  if (box.hidden) return;
  for (const b of $("dsk").children) b.setAttribute("aria-pressed", +b.dataset.v === DS.k ? "true" : "false");
  $("dsname").value = DS.kit.name;
  const from = $("dsfrom"), keep = from.value;
  from.replaceChildren(...DS.list.names.map((n, i) => el("option", { value: i, text: n })));
  from.value = keep !== "" ? keep : String(DS.kit.src);
  $("dsbits").value = String(DS.kit.crush & 15);
  $("dssh").value = String((DS.kit.crush >> 4) + 1);
  $("dsbitsv").textContent = (DS.kit.crush & 15) ? `-${DS.kit.crush & 15} bits` : t("dsOff");
  $("dsshv").textContent = (DS.kit.crush >> 4) ? `1/${(DS.kit.crush >> 4) + 1}` : t("dsOff");
  for (const id of ["dsbits", "dssh"]) {
    const i = $(id), p = ((+i.value - +i.min) / (+i.max - +i.min)) * 100;
    i.style.setProperty("--a", "0%"); i.style.setProperty("--p", p.toFixed(1) + "%");

    "aria-pressed": l === DS.lane ? "true" : "false", onclick: () => { DS.lane = l; renderDsSound(); dsLaneMarks(); op(() => dsPlay(l)); } }, n)));

}
function dsLaneMarks() { for (const b of $("dslanes").children) b.setAttribute("aria-pressed", +b.dataset.l === DS.lane ? "true" : "false"); }

}

/* ---- SLOOP 2.5: the Song page: the order of the sections A..D (the device's SONG screen, from the browser) ---- */
const SG = { rows: null, loop: false, bytes: null, err: "", dirty: false };
async function readSong() {
  if (!dev || !(dev.info.proto >= 6)) { Object.assign(SG, { rows: null, err: "songOld" }); renderSong(); return; }
  const L = parse[CMD.BK_LIST](await rq(req.bkList(), { timeout: 5000, retries: 0 }));
  const it = L.rc ? null : L.items.find((x) => x.id === 1);
  if (!it) throw new Error("the settings are not readable (rc " + L.rc + ")");
  const data = new Uint8Array(it.len);
  for (let off = 0; off < it.len; off += 256) {
    const n = Math.min(256, it.len - off);
    const g = parse[CMD.BK_GET](await rq(req.bkGet(1, off, n), { timeout: 1500, retries: 2 }));
    if (g.rc || g.data.length !== n) throw new Error(`settings: GET rc ${g.rc}`);
    data.set(g.data, off);
  }
  if (!ARR.ok(data)) { Object.assign(SG, { rows: null, err: "songOld" }); renderSong(); return; }
  const song = ARR.decode(data);
  Object.assign(SG, { bytes: data, rows: ARR.group(song.entries), loop: song.loop, err: "", dirty: false });
  renderSong();
}
async function sendSong() {
  if (!dev || !SG.rows) return;
  const song = { loop: SG.loop, entries: ARR.expand(SG.rows) };
  if (!ARR.valid(song)) { sayK("songBad"); return; }
  const d = ARR.encode(SG.bytes, song);
  let r = parse[CMD.BK_PUT](await rq(req.bkBegin(1, d.length, crc32(d)), { timeout: 1500, retries: 1 }));
  if (r.rc) throw new Error(`song: begin rc ${r.rc}`);
  for (let off = 0; off < d.length; off += 256) {
    r = parse[CMD.BK_PUT](await rq(req.bkData(1, off, d.subarray(off, off + 256)), { timeout: 1500, retries: 1 }));
    if (r.rc) throw new Error(`song: data rc ${r.rc}`);
  }
  r = parse[CMD.BK_PUT](await rq(req.bkCommit(1), { timeout: 5000, retries: 0 }));
  if (r.rc === 3) { sayK("songRefused"); return; }          /* (project.c settings_restore: the song is playing) */
  if (r.rc) throw new Error(`song: commit rc ${r.rc}`);
  await readSong();

/* KIT's value for USRn on the drum track (its names come with the drum track's DESC: -1 while not known) */

/* the kit to its slot, or shared out over USR3 and USR4 (kitSplit); a slot of the pair that gets no pad is erased, so

async function kitSend() {

async function smpInfo() { dev.smp = parse[CMD.SMP_INFO](await rq(req.smpInfo())); }

async function smpUpload(k, prog, ask = true, d = smpDraft[k]) {   /* (d: the DRUM KIT page's own, not the Samples draft) */
  let built, done = false;
  try { built = buildSlot(d.name, d.files.map((f) => ({ s: f.s, root: f.root, lo: f.lo, hi: f.hi }))); }
  catch (e) { sayK("smpFail", e.message); return false; }
  if (ask && !confirm(t("confirmUpload").replace("{n}", k + 1))) return false;
  const { hdr, data } = built;
  busy++;
  smpBusy = true;
  renderSamples();
  renderKits();
  if (!prog || !prog.isConnected)                   /* (the Samples page was drawn again just now: its new bar) */
    prog = $("smpslots").querySelector(`[data-k="${k}"] progress[max="1"]`) || { value: 0, hidden: true };
  prog.hidden = false;
  try {
    const t0 = performance.now();
    let r = parse[CMD.SMP_BEGIN](await rq(req.smpBegin(k), { timeout: 1000, retries: 0 }));
    if (r.rc) throw new Error("begin rc " + r.rc);
    for (let off = 0; off < data.length; off += 256) {
      const a = SMP.DATA_OFF + off;
      const w = parse[CMD.SMP_WRITE](await rq(req.smpWrite(k, a, data.subarray(off, off + 256)), { timeout: 1000, retries: 1 }));
      if (w.rc) throw new Error(`write at 0x${a.toString(16)} rc ${w.rc}`);
      prog.value = (off + 256) / data.length;
      sayK("smpUploading", `${k + 1}  ${kib(Math.min(data.length, off + 256))} / ${kib(data.length)} KiB`);
    }
    r = parse[CMD.SMP_END](await rq(req.smpEnd(k, hdr), { timeout: 2000, retries: 0 }));
    if (r.rc) throw new Error(`end rc ${r.rc} (${SMP_RC[r.rc] || "?"})`);
    sayK("smpDone", `${k + 1}  ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    done = true;
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (dev) await smpInfo(); } catch (e) { /* shown by the next action */ }
    smpBusy = false;
    busy--;
    renderSamples();
    renderKits();
  }
  return done;
}

async function smpErase(k) {
  if (!dev || !confirm(t("confirmErase").replace("{n}", k + 1))) return;
  busy++;
  smpBusy = true;
  renderSamples();
  try {
    const r = parse[CMD.SMP_ERASE](await rq(req.smpErase(k), { timeout: 2500, retries: 0 }));
    if (r.rc) throw new Error("erase rc " + r.rc);
    sayK("smpErased", String(k + 1));
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (dev) await smpInfo(); } catch (e) { /* ignore */ }
    smpBusy = false;
    busy--;
    renderSamples();
    renderKits();
  }
}

/* ---------------------------------------------------------------- CHOP --- */
/* Load a recording, mark the chops (live: TAP / space while it plays, each tap moved to the hit it
   meant; or by hits, a tempo grid, equal parts; double-click adds, drag moves, Delete removes),
   audition them (click, keys 1-9 0), keep or leave out each one and set its length (a recording longer
   than a slot: keep the chops you want, shorten them, or Fit to slot), then one chop per key into
   USR1..4 or as WAV files. CH.opt[i] = {off, len} goes with marker i. */
const CH = { x: null, nov: null, name: "", marks: [], opt: [], sel: -1, v0: 0, v1: 1, ctx: null, src: null, t0: 0, raf: 0,
  drag: -1, dragEnd: false, key0: 60, mode: 0, maxLen: 0, ui: null };
const chR = () => SMP.RATE;
const chSecs = (n) => (n / SMP.RATE).toFixed(2) + " s";

function chopChops() { return CH.x ? chopList(CH.marks, CH.x.length, Math.round(CH.maxLen * SMP.RATE), CH.opt) : []; }
function chopUsed() {                                /* the chops the slot gets, their samples, and each chop's key */
  const c = chopChops(), use = chopPick(c, CH.mode, Math.max(0, CH.sel)), key = new Map();
  if (CH.mode === 0) use.forEach((q, j) => key.set(q.i, Math.min(127, CH.key0 + j)));
  return { all: c, use, n: use.reduce((a, q) => a + (q.end - q.start), 0), key };
}
/* the label of chop i: its key, "—" when left out, nothing past the 16 kept ones or over the whole keyboard */
function chopKeyName(u, i) {
  if (CH.mode === 1) return "";
  const c = u.all[i];
  return c && c.off ? " —" : u.key.has(i) ? " " + noteName(u.key.get(i)) : "";
}
function chopOpt(i) { return CH.opt[i] || (CH.opt[i] = { off: false, len: 0 }); }
function chopKeep(i, keep) {                         /* keep / leave out chop i (keep undefined: toggle) */
  if (!CH.x || i < 0 || i >= CH.marks.length) return;
  const o = chopOpt(i);
  o.off = keep === undefined ? !o.off : !keep;
  chopRender();
}
function chopKeepAll(keep) { if (CH.x) { CH.opt = CH.marks.map((_, i) => ({ ...chopOpt(i), off: !keep })); chopRender(); } }
function chopSetLen(i, len) {                        /* the length of chop i in samples (0: up to the next marker) */
  if (!CH.x || i < 0 || i >= CH.marks.length) return;
  chopOpt(i).len = Math.max(0, Math.round(len));
  chopRender();
}
function chopFitAll() {                              /* shorten the longest kept chops so they all fit the slot */
  const { use } = chopUsed(), L = chopFit(use, SMP.MAX_DATA * 2 - use.length);   /* (an odd chop takes half a byte more) */
  if (!isFinite(L)) return;
  for (const c of use) if (c.end - c.start > L) chopOpt(c.i).len = L;
  sayK("chopFitted", chSecs(L));
  chopRender();
}

async function chopDecode(buf) {                    /* any file the browser decodes -> mono Float64 at SMP.RATE */
  try { const w = parseWav(buf); return resample(w.x, w.sr, SMP.RATE); } catch (e) { /* not a plain WAV */ }
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ab = await new Ctx(1, 1, SMP.RATE).decodeAudioData(buf.slice(0));
  const x = new Float64Array(ab.length);
  for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / ab.numberOfChannels; }

}

async function chopLoad(f) {
  chopStop();
  try {
    const x = await chopDecode(await f.arrayBuffer());
    if (!x.length) throw new Error("no audio");
    CH.x = x;
    CH.nov = chopNovelty(x);
    CH.name = f.name.replace(/\.[^.]*$/, "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "CHOP";
    CH.marks = [];
    CH.opt = [];
    CH.sel = -1;
    CH.v0 = 0;
    CH.v1 = x.length;
    sayK("chopLoaded", `${f.name} (${chSecs(x.length)})`);
  } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  chopRender();
}

/* new markers; opt (aligned with m) their options, else each keeps the options of the marker it was */
function chopSetMarks(m, opt = null) {
  const was = new Map(CH.marks.map((v, i) => [v, CH.opt[i]])), seen = new Set(), pairs = [];
  m.forEach((v, i) => {
    const p = Math.max(0, Math.min(CH.x.length - 1, Math.round(v)));
    if (seen.has(p)) return;
    seen.add(p);
    const o = opt ? opt[i] : was.get(p);
    pairs.push([p, o ? { ...o } : { off: false, len: 0 }]);
  });
  pairs.sort((a, b) => a[0] - b[0]);
  CH.marks = pairs.map((q) => q[0]);
  CH.opt = pairs.map((q) => q[1]);

  chopRender();
}
function chopAdd(pos) {                              /* a new marker; one within 30 ms is moved there instead */
  const near = CH.marks.findIndex((m) => Math.abs(m - pos) < 0.03 * chR());
  const m = CH.marks.slice(), opt = CH.marks.map((_, i) => CH.opt[i]);
  if (near >= 0) m[near] = pos; else { m.push(pos); opt.push(null); }
  chopSetMarks(m, opt);
  CH.sel = CH.marks.indexOf(Math.round(pos));
  chopDraw();
}

/* ---- audio */
function chopCtx() {
  if (!CH.ctx) CH.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (CH.ctx.state === "suspended") CH.ctx.resume();
  return CH.ctx;
}
function chopBuffer(a, b) {
  const ctx = chopCtx(), n = Math.max(1, b - a), buf = ctx.createBuffer(1, n, SMP.RATE), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = CH.x[a + i];
  return buf;
}
function chopStop() {
  if (CH.src) { try { CH.src.stop(); } catch (e) { /* ended */ } CH.src = null; }
  cancelAnimationFrame(CH.raf);
  if (CH.ui) { CH.ui.play.textContent = t("chopPlay"); chopDraw(); }
}
/* play a..b; whole = the transport (a playhead, TAP marks), else an audition */
function chopPlay(a, b, whole) {
  if (!CH.x) return;
  chopStop();
  const ctx = chopCtx(), src = ctx.createBufferSource();
  const g = ctx.createGain();
  src.buffer = chopBuffer(a, b);
  src.connect(g).connect(ctx.destination);
  if (!whole) {                                     /* the fades the slot will have */
    const n = b - a, fo = Math.min(CHOP.FADE_OUT, n >> 2) / SMP.RATE, now = ctx.currentTime + 0.005, end = now + n / SMP.RATE;
    g.gain.setValueAtTime(1, now);
    g.gain.setValueAtTime(1, Math.max(now, end - fo));
    g.gain.linearRampToValueAtTime(0, end);
  }
  CH.t0 = ctx.currentTime + 0.005 - a / SMP.RATE;
  src.start(ctx.currentTime + 0.005);
  src.onended = () => { if (CH.src === src) { CH.src = null; if (whole) chopStop(); } };
  CH.src = src;
  CH.src.whole = whole;
  if (whole) {
    CH.ui.play.textContent = t("chopStop");
    const tick = () => { chopDraw(); if (CH.src === src) CH.raf = requestAnimationFrame(tick); };
    CH.raf = requestAnimationFrame(tick);
  }

/* where the listener is now, in samples (what comes out of the speakers, not what is computed) */
function chopHeard(ev) {
  const ctx = CH.ctx;
  let ct = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  if (ev && ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.performanceTime > 0) ct = ts.contextTime + (ev.timeStamp - ts.performanceTime) / 1000;
  }
  return (ct - CH.t0) * SMP.RATE;
