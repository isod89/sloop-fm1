/* one panel at a time; the last one is remembered (localStorage) and in the URL hash (#sound ...) */
const TABS = ["sound", "sequencer", "tracks", "library", "samples", "projects", "settings"];
const TAB_KEY = "felucca-editor-tab";
const TRACK_TABS = new Set(["sound", "sequencer", "tracks"]);
let tab = (() => {
  const h = location.hash.slice(1);
  if (TABS.includes(h)) return h;
  try { const v = localStorage.getItem(TAB_KEY); if (TABS.includes(v)) return v; } catch (e) { /* no storage */ }
  return "sound";
})();
const hasTracks = () => !!dev && !!dev.info && !!dev.info.ntrk;
function showTab(name) {
  if (!TABS.includes(name)) name = "sound";
  const prev = tab;
  tab = name;
  try { localStorage.setItem(TAB_KEY, name); } catch (e) { /* no storage */ }
  if (location.hash !== "#" + name) history.replaceState(null, "", location.pathname + location.search + "#" + name);
  renderPanels();
  if (name === "tracks" && prev !== "tracks" && hasTracks() && dev.dump) op(readMixer);
}
function renderPanels() {
  /* the Tracks tab only with a four-track firmware */
  const tracksOk = !dev || hasTracks() || !dev.info;
  const want = tab === "tracks" && dev && dev.info && !hasTracks() ? "sound" : tab;
  for (const b of $("tabs").querySelectorAll("button[data-tab]")) {
    const on = b.dataset.tab === want;
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
    if (b.dataset.tab === "tracks") b.hidden = !tracksOk;
  }
  const ready = !!dev && !!dev.dump;
  let hint = "";
  for (const p of document.querySelectorAll(".panel")) {
    const mine = p.dataset.tab === want;
    let show = mine && (!("dev" in p.dataset) || ready);
    if (mine && "dev" in p.dataset && !dev) hint = "needDevice";   /* (while connecting the status line says it) */
    if (show && want === "samples" && !dev.smp) { show = false; hint = "smpNone"; }
    p.hidden = !show;
  }
  $("hint").hidden = !hint;
  if (hint) $("hint").textContent = t(hint);
  $("trackbar").hidden = !(ready && hasTracks() && TRACK_TABS.has(want));
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
$("tabs").addEventListener("keydown", (e) => {          /* arrow keys move between the tabs */
  const dir = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!dir) return;
  const bs = [...$("tabs").querySelectorAll("button[data-tab]:not([hidden])")];
  const i = bs.findIndex((b) => b.getAttribute("aria-selected") === "true");
  const n = bs[(i + dir + bs.length) % bs.length];
  e.preventDefault();
  showTab(n.dataset.tab);
  n.focus();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) showTab(h); });

const QS = new URLSearchParams(location.search);
const MOCK = QS.get("mock") === "1";
$("mock").hidden = !MOCK;
let mock = null;

/* -------------------------------------------------------------- state --- */
let access = null;     /* MIDIAccess */
let dev = null;        /* {link, input, output, info, pdesc[], gdesc[], names[][], dump, steps[], slotUsed[],
                          keys[] (paramKeys), watch (pushes on), bank ({total, slots[]} or null: no user bank)} */
let busy = 0;          /* multi-request operations in progress: no polling */
let dragging = null;   /* key of the slider being dragged */
let wantConnected = false;
const ctl = new Map(); /* key "s:id" -> {input, out, desc, scope, id, row} */
const sets = new Map(); /* key -> {last: time of the user's last change, sent: the value last requested} */
let needReload = false; /* a RELOAD push came: re-read DESC, DUMP and steps when free */
let lastDump = 0;      /* Date.now() of the last DUMP */
/* the device also pushes RELOAD after loads the editor asked for (SET of G_ENGSEL, PRESET, PROJECT load,
   UP_LOAD); the editor re-reads after those anyway, so it skips that many RELOADs for a moment */
const selfReload = { n: 0, until: 0 };
function selfLoad() {
  if (!dev || !dev.watch) return;
  const now = Date.now();
  selfReload.n = now < selfReload.until ? selfReload.n + 1 : 1;
  selfReload.until = now + 1500;
}
const stepEdit = new Map(); /* index -> time of the last edit */

/* parameter ids (firmware/src/core.h); used only when P_COUNT / G_COUNT match */
const EXPECT = { pcount: 58, gcount: 32, pe0: 50 };
const P = { LEVEL: 0, SLEN: 29, CHORD: 49 };
const LAYOUT = (pe0) => [
  { t: "ENV", pages: [["ENV", 0, [1, 2, 3, 4]], ["ENV DEST", 0, [5, 6, 7, 8]]] },
  { t: "LFO", pages: [["LFO", 0, [9, 10, 11, 12]], ["LFO DEST", 0, [13, 14, 15, 16]]] },
  { t: "EDIT", engine: true, pages: [["EDIT 1", 0, [pe0, pe0 + 1, pe0 + 2, pe0 + 3]], ["EDIT 2", 0, [pe0 + 4, pe0 + 5, pe0 + 6, pe0 + 7]]] },
  { t: "VOICE", pages: [["LEVEL", 0, [0]], ["VOICE", 0, [37, 38, 41, 42]], ["VOICE 2", 0, [43, 44, 39, 40]]] },
  { t: "FX", pages: [["FX", 0, [33, 34, 35, 36]], ["SLICER", 0, [45, 46, 47, 48]], ["DLY", 1, [4, 5, 6, 7]], ["REV/CHO", 1, [8, 9, 10, 11]]] },
  { t: "SCL", pages: [["SCL", 0, [25, 26, 27, 49]], ["SCL 2", 0, [28]]] },
  { t: "ARP", pages: [["ARP", 0, [17, 18, 19, 20]], ["ARP 2", 0, [21, 22, 23, 24]]] },
  { t: "SEQ PATTERN", tab: "seqgroups", pages: [["PATTERN", 0, [29, 30, 31, 32]]] },
  { t: "GLOBAL", tab: "setgroups", pages: [["GLOBAL", 1, [0, 1, 2, 3]]] },
  { t: "MASTER", tab: "setgroups", pages: [["MASTER", 1, [27, 28, 29, 30]]] },
  { t: "DRUMS", tab: "setgroups", pages: [["DRUMS", 1, [24, 25, 26]]] },
];
/* globals that are actions or placeholders on the device: buttons instead, or hidden */
const G_SKIP = new Set(["SLOT", "NAME", "LOAD", "SAVE", "ENG", "SET", "CLRSQ", "INIT", "MIDI", "SYNC", "ROUT", "CPU", "NEW"]);
const key = (s, id) => s + ":" + id;
const gEng = () => { const i = dev.gdesc.findIndex((d) => d && d.label === "ENG"); return i >= 0 ? i : 20; };
const pSlen = () => { const i = dev.pdesc.findIndex((d) => d && d.fmt === F.STEPS); return i >= 0 ? i : P.SLEN; };
/* mixer ids by DESC label (core.h: P_PAN 39, P_MUTE 40, G_DRLVL 25) */
const pById = (label, def) => { const i = dev.pdesc.findIndex((d, k) => d && k < dev.info.pe0 && d.label === label); return i >= 0 ? i : def; };
const pPan = () => pById("PAN", 39), pMute = () => pById("MUTE", 40);
const gDrLvl = () => { const i = dev.gdesc.findIndex((d, k) => d && k > gEng() && (d.label === "LVL" || d.label === "LEVEL")); return i >= 0 ? i : 25; };
const isDrum = () => !!dev && !!dev.dump && dev.dump.engine >= dev.info.nengines;
/* v5 (SLOOP 2.0): the drum track is edited as its 16 lanes (DRUM_STEP); older firmware: as GM notes */
const drumGrid = () => isDrum() && !!dev.info.proto && dev.info.proto >= 5;

/* -------------------------------------------------------------- MIDI --- */
async function connect() {
  wantConnected = true;
  if (!MOCK && !navigator.requestMIDIAccess) { sayK("nomidi"); return; }
  $("connect").disabled = true;
  sayK("connecting");
  try {
    if (!access) {
      if (MOCK) { mock = makeMockDevice({ legacy: QS.get("legacy") === "1" }); access = mock.access; }
      else {
        try { access = await navigator.requestMIDIAccess({ sysex: true }); }
        catch (e) { sayK("denied"); return; }
      }
      access.onstatechange = onState;
    }
    const isF = (p) => /felucca/i.test(p.name || "") && p.state !== "disconnected";
    const input = [...access.inputs.values()].find(isF);
    const output = [...access.outputs.values()].find(isF);
    if (!input || !output) { sayK("nodevice"); return; }
    const link = new Link((d) => output.send(d), {
      timeout: 300,
      onUnknown: (f) => console.debug("ignored reply", f),
      onTimeout: () => sayK("noreply"),
      onPush: (f) => onPush(f),
      onGap: () => { rewatch = true; },
    });
    input.onmidimessage = (e) => link.receive(e.data);
    if (input.open) await input.open().catch(() => {});
    dev = { link, input, output, info: null, pdesc: [], gdesc: [], names: [], dump: null, steps: [], slotUsed: [null, null, null, null],
      keys: null, watch: false, bank: null };
    setLabel($("connect"), t("disconnect"));
    await load(dev);
  } catch (e) {
    console.error(e);
    if (dev) {                                       /* not unplugged meanwhile (that says "lost") */
      const timeout = /^timeout/.test(e.message);
      disconnect();
      sayK(timeout ? "noreply" : "error", timeout ? "" : e.message);
    }
  } finally {
    $("connect").disabled = false;
  }
}

function disconnect(reasonKey = "disconnected") {
  if (dev) {
    dev.link.close();
    dev.input.onmidimessage = null;
  }
  dev = null;
  busy = 0;
  needReload = false;
  renderPanels();
  renderMixer();
  renderSysinfo();
  renderLive();
  renderLib();
  renderBank();
  $("version").textContent = "";
  setLabel($("connect"), t("connect"));
  sayK(reasonKey);
}

function onState(e) {
  const p = e.port;
  if (!p || !/felucca/i.test(p.name || "")) return;
  if (dev && p.state === "disconnected" && (p.id === dev.input.id || p.id === dev.output.id)) {
    disconnect("lost");
  } else if (!dev && wantConnected && p.state === "connected" && p.type === "output") {
    clearTimeout(onState.tm);                       /* the device came back: reconnect */
    onState.tm = setTimeout(() => { if (!dev && wantConnected) connect(); }, 800);
  }
}

const rq = (r, opt) => dev.link.request(r, opt);
async function getDesc(scope, id) { return parse[CMD.DESC](await rq(req.desc(scope, id))); }
async function getDump() { lastDump = Date.now(); return parse[CMD.DUMP](await rq(req.dump()), dev.info); }
async function getStep(i) { return parse[CMD.STEP_GET](await rq(req.stepGet(i))); }
async function getDrumStep(i) { return parse[CMD.DRUM_STEP](await rq(req.drumStep(i))); }
/* a drum step as an old step (firmware ed_dstep_old): for what still reads dev.steps */
function drumAsStep(d) {
  const notes = [];
  for (let l = 0; l < 16 && notes.length < 4; l++) if ((d.on >> l) & 1) notes.push(DRUM_LANES[l][0]);
  return { index: d.index, n: notes.length, notes: [...notes, 0, 0, 0, 0].slice(0, 4), time: notes.length ? 0 : 2, flags: 0, vel: notes.length ? 100 : 0 };
}

/* the whole connect sequence */
async function load(d) {
  busy++;
  try {
    /* the first frame after opening the port can be lost: a few tries */
    d.info = parse[CMD.INFO](await d.link.request(req.info(), { timeout: 500, retries: 3 }));
    $("version").textContent = d.info.version;
    const total = d.info.pcount + d.info.gcount;
    for (let i = 0; i < d.info.pcount; i++) { sayK("reading", `${i + 1}/${total}`); d.pdesc[i] = await getDescOrNull(0, i); }
    for (let i = 0; i < d.info.gcount; i++) { sayK("reading", `${d.info.pcount + i + 1}/${total}`); d.gdesc[i] = await getDescOrNull(1, i); }
    const kd = d.pdesc[d.info.pe0];
    if (kd && kd.label === "KIT" && kd.names.length) d.kitNames = kd.names;   /* (the drum track was selected) */
    d.titles = [];
    for (let e = 0; e < d.info.nengines; e++) {
      const r = parse[CMD.NAMES](await d.link.request(req.names(e)));
      d.names[e] = r.names;
      d.titles[e] = r.titles;
    }
    for (let k = 0; k < 4; k++) {                    /* PROJECT op 2: is the slot used */
      try { d.slotUsed[k] = parse[CMD.PROJECT](await d.link.request(req.project(2, k))).used; }
      catch (e) { if (e.message === "closed") throw e; }
    }
    try { d.smp = parse[CMD.SMP_INFO](await d.link.request(req.smpInfo())); }
    catch (e) { if (e.message === "closed") throw e; d.smp = null; }   /* older firmware, or no flash */
    d.keys = paramKeys(d.pdesc, d.info.pe0, d.info.pcount);
    await libAdopt(d);
    if (d.info.ntrk) d.sel = parse[CMD.TRACK](await d.link.request(req.track())).sel;   /* v3: the selected track */
    d.dump = await getDump();
    buildUI();
    renderPanels();
    await loadSteps();
    if (d.info.ntrk) await readMixer();
    /* protocol v2: live pushes and the user bank; older firmware: DUMP polling, no bank */
    const rqd = (r, o) => d.link.request(r, o);
    d.watch = await startWatch(rqd);
    d.v4 = d.watch === 3;                           /* TRACK_PARAM / TRACK_CHANGED */
    if (d.watch) {
      sayK("readingBank");
      try { d.bank = await bank.list((r, o) => d.link.request(r, { ...o, quiet: true })); }
      catch (e) { if (e.message === "closed") throw e; d.bank = null; }
    }
    renderLive();
    renderLib();
    renderBank();
    renderSysinfo();
    sayK("ready");
  } finally { busy--; }
}
async function getDescOrNull(s, i) { try { return await getDesc(s, i); } catch (e) { if (e.message === "closed") throw e; return null; } }

/* rebuilds the controls only when the engine or its parameters changed (a slider being dragged survives) */
async function rereadEngineDesc() {
  const pe0 = dev.info.pe0;
  const before = JSON.stringify(dev.pdesc.slice(pe0));
  for (let i = 0; i < 8 && pe0 + i < dev.info.pcount; i++) dev.pdesc[pe0 + i] = await getDescOrNull(0, pe0 + i);
  const kd = dev.pdesc[pe0];
  if (kd && kd.label === "KIT" && kd.names.length) dev.kitNames = kd.names;   /* the drum track's kits, for the mixer */
  if (dev.built !== dev.dump.engine || JSON.stringify(dev.pdesc.slice(pe0)) !== before) buildGroups();
}

async function loadSteps() {
  const n = dev.info.nstep, drum = drumGrid();
  if (!dev.dsteps) dev.dsteps = [];
  for (let i = 0; i < n; i++) {
    if (i % 8 === 0) sayK("steploading", `${i}/${n}`);
    if (drum) { dev.dsteps[i] = await getDrumStep(i); dev.steps[i] = drumAsStep(dev.dsteps[i]); }
    else dev.steps[i] = await getStep(i);
  }
  dev.dstepsOk = drum;
  renderSteps();
}

/* --------------------------------------------------------------- UI --- */
function buildUI() {
  const sel = $("engine");
  sel.replaceChildren(...dev.info.engines.map((n, i) => el("option", { value: i, text: n })));
  dev.mix = null;
  buildGroups();
  updateBrowser();
  renderSlots();
  renderSamples();
  renderSysinfo();
  $("bkgroup").hidden = !(dev.info.proto >= 6);       /* v6 firmware: backup / restore */
}

/* the track selector (v3): T1..T3 synth parts, T4 the drum track; the editor shows the selected one */
function renderTrackbar() {
  const box = $("trackbtns");
  const ntrk = hasTracks() ? dev.info.ntrk : 0;
  if (box.children.length !== ntrk || box.dataset.lang !== lang) {
    box.dataset.lang = lang;
    box.replaceChildren(...Array.from({ length: ntrk }, (_, i) => el("button", { type: "button", "data-i": i,
      onclick: () => selectTrack(i) }, `${i + 1}${i === dev.info.drum ? " " + t("drum") : ""}`)));
  }
  for (const b of box.children) b.setAttribute("aria-pressed", +b.dataset.i === (dev.sel || 0) ? "true" : "false");
}
function selectTrack(i) {
  if (!dev || !hasTracks() || i === dev.sel) return;
  op(async () => {
    dev.sel = parse[CMD.TRACK](await rq(req.track(i))).sel;
    await afterSoundChange();
  });
}

/* settings > system: what the device reported */
function renderSysinfo() {
  const box = $("sysinfo");
  if (!dev || !dev.info) { box.replaceChildren(); return; }
  const i = dev.info;
  const rows = [
    ["firmware", i.version], ["sync", t(dev.watch ? "live" : "polling")], ["enginesL", i.engines.join(", ")],
    ["tracksN", i.ntrk ? String(i.ntrk) : "1"], ["stepsN", String(i.nstep)],
    ["smpSlots", dev.smp ? `${dev.smp.nslots} × ${dev.smp.slotKiB} KiB` : t("none")],
    ["userBank", dev.bank ? String(dev.bank.total) : t("none")],
  ];
  box.replaceChildren(...rows.map(([k, v]) => el("tr", {}, el("th", { text: t(k) }), el("td", { text: v }))));
}

function updateBrowser() {
  const e = dev.dump.engine;
  const sel = $("engine");
  const drum = e >= dev.info.nengines;              /* the drum track: no engine, no presets */
  renderTrackbar();
  sel.disabled = drum;
  $("preset").disabled = drum;
  $("init").disabled = drum;
  $("factlib").disabled = drum;
  $("drumnote").hidden = !drum;
  $("browser").hidden = drum;
  $("groups").hidden = drum;
  $("ctlhelp").hidden = drum;
  if (document.activeElement !== sel) sel.value = drum ? "" : String(e);
  const ps = $("preset");
  const names = dev.names[e] || [];
  if (ps.dataset.engine !== String(e)) {
    ps.replaceChildren(...names.map((n, i) => el("option", { value: i, text: n })));
    ps.dataset.engine = String(e);
  }
  if (document.activeElement !== ps) ps.value = String(dev.dump.preset);
}

function visible(d) { return d && d.max > d.min && d.label !== "-"; }

function buildGroups() {
  ctl.clear();
  dev.built = dev.dump.engine;
  /* Sound: the selected track's parameters; Sequencer: its pattern settings; Settings: globals and drums */
  const groups = { groups: [], seqgroups: [], setgroups: [] };
  const { info } = dev;
  if (info.pcount === EXPECT.pcount && info.gcount === EXPECT.gcount && info.pe0 === EXPECT.pe0) {
    for (const g of LAYOUT(info.pe0)) {
      const div = el("div", { class: "group" }, el("h2", { ic: HEAD_IC[g.t], text: g.engine ? `EDIT ${info.engines[dev.dump.engine] || ""}` : g.t }));
      for (const [title, s, ids] of g.pages) {
        const rows = ids.map((id) => paramRow(s, id)).filter(Boolean);
        if (!rows.length) continue;
        const tt = g.engine && (dev.titles[dev.dump.engine] || [])[g.pages.findIndex((x) => x[0] === title)];
        if (g.pages.length > 1) div.append(el("h3", { ic: PAGE_IC[tt || title], text: tt || title }));
        div.append(...rows);
      }
      groups[g.tab || "groups"].push(div);
    }
  } else {
    /* unknown firmware layout: everything in id order */
    const a = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.INSTRUMENT, text: "INSTRUMENT" }), el("p", { class: "dim", text: t("layout") }));
    const b = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.EDIT, text: "EDIT" }));
    const c = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.GLOBAL, text: "GLOBAL" }));
    for (let i = 0; i < info.pcount; i++) { const r = paramRow(0, i); if (r) (i >= info.pe0 ? b : a).append(r); }
    for (let i = 0; i < info.gcount; i++) { const r = paramRow(1, i); if (r) c.append(r); }
    groups.groups.push(a, b);
    groups.setgroups.push(c);
  }
  for (const [id, divs] of Object.entries(groups)) $(id).replaceChildren(...divs);
}

function paramRow(s, id) {
  const d = s ? dev.gdesc[id] : dev.pdesc[id];
  if (!visible(d) || (s === 1 && G_SKIP.has(d.label))) return null;
  const k = key(s, id);
  let input;
  if (d.fmt === F.ENUM || d.fmt === F.NOTE || d.fmt === F.ONOFF) {
    const wave = RICH_SELECT && d.fmt === F.ENUM && /^WAVE2?$/.test(d.label);
    input = el("select", { class: wave ? "wave" : null });
    /* the closed select shows a copy of the chosen option (icon span included), not its bare text */
    if (wave) input.append(el("button", {}, el("selectedcontent")));
    for (let v = d.min; v <= d.max; v++) {
      const [txt] = fmtValue(d, v);
      const name = d.fmt === F.ENUM && d.names[v - d.min] == null ? String(v) : txt;
      input.append(el("option", { value: v, ic: wave && WAVE_IC[name] }, name));
    }
    input.addEventListener("change", () => userSet(s, id, +input.value, true));
  } else {
    input = el("input", { type: "range", min: d.min, max: d.max, step: 1 });
    input.addEventListener("pointerdown", () => { dragging = k; });
    input.addEventListener("input", () => userSet(s, id, +input.value, false));
    input.addEventListener("change", () => userSet(s, id, +input.value, true));
    input.addEventListener("dblclick", () => { input.value = d.def; userSet(s, id, d.def, true); });
    /* fine adjust: wheel over the focused slider, Shift+arrows in steps of 10 (plain arrows are native) */
    const nudge = (dv) => {
      const nv = Math.max(d.min, Math.min(d.max, +input.value + dv));
      if (nv !== +input.value) { input.value = String(nv); userSet(s, id, nv, true); }
    };
    let acc = 0;
    input.addEventListener("wheel", (e) => {
      if (document.activeElement !== input) return;
      e.preventDefault();
      acc += (e.deltaMode === 1 ? 33 : 1) * (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? -e.deltaY : e.deltaX);
      const n = Math.trunc(acc / 50);
      if (n) { acc -= n * 50; nudge(n * (e.shiftKey ? 10 : 1)); }
    }, { passive: false });
    input.addEventListener("keydown", (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (!dir || !e.shiftKey) return;
      e.preventDefault();
      nudge(dir * 10);
    });
  }
  input.title = d.label;
  const out = el("span", { class: "v" });
  const row = el("div", { class: "row" }, el("span", { text: d.label }), input, out);
  ctl.set(k, { input, out, desc: d, scope: s, id, row });
  showValue(k, s ? dev.dump.g[id] : dev.dump.p[id], true);
  return row;
}

function showValue(k, v, force) {
  const c = ctl.get(k);
  if (!c || v == null) return;
  const [txt, unit] = fmtValue(c.desc, v);
  c.out.textContent = unit ? `${txt} ${unit}` : txt;
  if (force || !touched(k)) c.input.value = String(v);
}
/* the user is working on this control: polling and pushes must not move it */
function touched(k) {
  const c = ctl.get(k), st = sets.get(k);
  if (dragging === k) return true;
  if (c && c.input.tagName === "SELECT" && document.activeElement === c.input) return true;
  if (st && performance.now() - st.last < 600) return true;
  return !!dev && (dev.link.hasQueued(k) || (!!dev.link.cur && dev.link.cur.key === k));
}

window.addEventListener("pointerup", () => { if (dragging) { const k = dragging; dragging = null; const c = ctl.get(k); if (c) userSet(c.scope, c.id, +c.input.value, true); } });
window.addEventListener("pointercancel", () => { dragging = null; });

/* SET as fast as the device answers: one SET per control in flight and at most one queued, which
   always carries the latest value (Link coalesces by key), so a drag never builds a backlog */
function userSet(s, id, v, final) {
  if (!dev) return;
  const k = key(s, id);
  (s ? dev.dump.g : dev.dump.p)[id] = v;
  showValue(k, v, false);
  mixFromDump();
  let st = sets.get(k);
  if (!st) sets.set(k, (st = { last: 0, sent: null }));
  st.last = performance.now();
  if (v === st.sent) return;                        /* the last request already carries it */
  sendSet(s, id, k);
}
async function sendSet(s, id, k) {
  if (!dev) return;
  const st = sets.get(k);
  const v = (s ? dev.dump.g : dev.dump.p)[id];
  st.sent = v;
  try {
    const r = parse[CMD.SET](await rq(req.set(s, id, v), { key: k }));
    if (dev && dragging !== k && st.sent === v && !dev.link.hasQueued(k)) {   /* the device's value after clamping */
      (s ? dev.dump.g : dev.dump.p)[id] = r.value;
      showValue(k, r.value, false);
      mixFromDump();
    }
  } catch (e) { if (e.message !== "closed") console.warn(e); }
}

const TIMES = ["NOTE", "TIE", "REST"];

      el("th", { text: t("acc") }), el("th", { text: t("slide") }), el("th", { text: t("vel") })));

function stepRow(i) {

function fillStep(tr, s) {

/* the step grid: one cell per step up to LEN; a cell jumps to its row in the table */

  }

    b.className = [on && "on", tie && "tie", on && s.flags & 1 && "acc", i % 4 === 0 && "beat"].filter(Boolean).join(" ");

function focusStep(i) {

async function writeStep(i, tr) {

  let time = +c.time.value;

/* ---------------------------------------------------------- samples --- */
const smpDraft = [0, 1, 2].map(() => ({ name: "", files: [] }));
let smpBusy = false;
const SMP_RC = { 1: "size", 2: "header", 3: "data CRC", 4: "flash", 5: "zones" };
const kib = (n) => (n / 1024).toFixed(1);

/* auto key split, as in buildSlot (for the preview) */
function splitKeys(files) {
  const z = files.map((f, i) => ({ i, root: f.root })).sort((a, b) => a.root - b.root);
  const out = [];
  z.forEach((x, j) => {
    out[x.i] = [j === 0 ? 0 : Math.floor((z[j - 1].root + x.root) / 2) + 1, j === z.length - 1 ? 127 : Math.floor((x.root + z[j + 1].root) / 2)];
  });
  files.forEach((f, i) => { if (f.lo != null) out[i] = [f.lo, f.hi]; });   /* (chops: their own keys) */
  return out;
}

const draftBytes = (d) => d.files.reduce((a, f) => a + ((f.s.length + 1) >> 1), 0);

async function decodeFile(f) {
  const buf = await f.arrayBuffer();
  let x;
  try {
    const w = parseWav(buf);
    x = resample(w.x, w.sr, SMP.RATE);
  } catch (e) {                                     /* not a plain WAV: let the browser decode it */
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ab = await new Ctx(1, 1, SMP.RATE).decodeAudioData(buf.slice(0));
    x = new Float64Array(ab.length);
    for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / ab.numberOfChannels; }
  }
  if (!x.length) throw new Error("no audio");
  return { fname: f.name, s: normalize(x), root: rootFromName(f.name.replace(/\.[^.]*$/, "")) };
}

async function addFiles(k, list) {
  const d = smpDraft[k];
  for (const f of list) {
    try {
      const z = await decodeFile(f);
      if (d.files.length >= SMP.MAX_ZONES) break;
      d.files.push(z);
      if (!d.name) d.name = f.name.replace(/\.[^.]*$/, "").toUpperCase().replace(/[^\x20-\x7E]/g, "").slice(0, 8);
    } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  }
  renderSamples();
}

function renderSamples() {

    const file = el("input", { type: "file", accept: ".wav,audio/wav,audio/x-wav,audio/*", multiple: true, hidden: true });
    file.addEventListener("change", () => { addFiles(k, [...file.files]); file.value = ""; });
    const name = el("input", { type: "text", class: "name", maxlength: 8, value: d.name, spellcheck: "false", placeholder: "NAME" });
    name.addEventListener("input", () => {

    });

    const prog = el("progress", { max: 1, value: 0, hidden: true });
    const blk = el("div", { class: "smp", "data-k": k },
      el("div", { class: "head" }, el("b", { text: `USR${k + 1}` }), el("span", { text: status }), bar,
        el("button", { ic: "symbol_trash", disabled: smpBusy || !u.zones, onclick: () => smpErase(k) }, t("erase"))),
      el("div", { class: "head" }, el("span", { text: t("smpName") }), name,
        el("button", { ic: "symbol_folder_open", disabled: smpBusy, onclick: () => file.click() }, t("chooseFiles")), file,
        el("button", { ic: "symbol_upload", disabled: smpBusy || !d.files.length || tooBig || !d.name, onclick: () => smpUpload(k, prog) }, t("upload")),
        d.files.length ? el("button", { text: t("clearList"), disabled: smpBusy, onclick: () => { d.files = []; renderSamples(); } }) : "",
        size, prog));
    if (d.files.length) {

        el("th", { text: t("keys") }), el("th", { text: t("length") }), el("th")));
      d.files.forEach((f, i) => {

        root.addEventListener("change", () => {

        });
        tb.append(el("tr", {}, el("td", { text: f.fname }), el("td", {}, root),
          el("td", { text: `${noteName(keys[i][0])}–${noteName(keys[i][1])}` }),
          el("td", { text: `${(f.s.length / SMP.RATE).toFixed(2)} s` }),

    return blk;
  }));
}

async function smpUpload(k, prog, ask = true) {
  const d = smpDraft[k];
  let built, done = false;
  try { built = buildSlot(d.name, d.files.map((f) => ({ s: f.s, root: f.root, lo: f.lo, hi: f.hi }))); }
  catch (e) { sayK("smpFail", e.message); return false; }
  if (ask && !confirm(t("confirmUpload").replace("{n}", k + 1))) return false;
  const { hdr, data } = built;
  busy++;
  smpBusy = true;
  renderSamples();
  prog = $("smpslots").querySelector(`[data-k="${k}"] progress[max="1"]`);
  prog.hidden = false;

    const t0 = performance.now();
    let r = parse[CMD.SMP_BEGIN](await rq(req.smpBegin(k), { timeout: 1000, retries: 0 }));
    if (r.rc) throw new Error("begin rc " + r.rc);
    for (let off = 0; off < data.length; off += 256) {
      const a = SMP.DATA_OFF + off;
      const w = parse[CMD.SMP_WRITE](await rq(req.smpWrite(k, a, data.subarray(off, off + 256)), { timeout: 1000, retries: 1 }));
      if (w.rc) throw new Error(`write at 0x${a.toString(16)} rc ${w.rc}`);
      prog.value = (off + 256) / data.length;
      sayK("smpUploading", `${k + 1}  ${kib(Math.min(data.length, off + 256))} / ${kib(data.length)} KiB`);
    }
    r = parse[CMD.SMP_END](await rq(req.smpEnd(k, hdr), { timeout: 2000, retries: 0 }));
    if (r.rc) throw new Error(`end rc ${r.rc} (${SMP_RC[r.rc] || "?"})`);
    sayK("smpDone", `${k + 1}  ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    done = true;
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (dev) await smpInfo(); } catch (e) { /* shown by the next action */ }
    smpBusy = false;
    busy--;
    renderSamples();
  }
  return done;
}

async function smpErase(k) {
  if (!dev || !confirm(t("confirmErase").replace("{n}", k + 1))) return;
  busy++;
  smpBusy = true;
  renderSamples();
  try {
    const r = parse[CMD.SMP_ERASE](await rq(req.smpErase(k), { timeout: 2500, retries: 0 }));
    if (r.rc) throw new Error("erase rc " + r.rc);
    sayK("smpErased", String(k + 1));
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (dev) await smpInfo(); } catch (e) { /* ignore */ }
    smpBusy = false;
    busy--;
    renderSamples();
  }
}

/* ---------------------------------------------------------------- CHOP --- */
/* Load a recording, mark the chops (live: TAP / space while it plays, each tap moved to the hit it
   meant; or by hits, a tempo grid, equal parts; double-click adds, drag moves, Delete removes),
   audition them (click, keys 1-9 0), keep or leave out each one and set its length (a recording longer
   than a slot: keep the chops you want, shorten them, or Fit to slot), then one chop per key into
   USR1..3 or as WAV files. CH.opt[i] = {off, len} goes with marker i. */
const CH = { x: null, nov: null, name: "", marks: [], opt: [], sel: -1, v0: 0, v1: 1, ctx: null, src: null, t0: 0, raf: 0,
  drag: -1, dragEnd: false, key0: 60, mode: 0, maxLen: 0, ui: null };
const chR = () => SMP.RATE;
const chSecs = (n) => (n / SMP.RATE).toFixed(2) + " s";

function chopChops() { return CH.x ? chopList(CH.marks, CH.x.length, Math.round(CH.maxLen * SMP.RATE), CH.opt) : []; }
function chopUsed() {                                /* the chops the slot gets, their samples, and each chop's key */
  const c = chopChops(), use = chopPick(c, CH.mode, Math.max(0, CH.sel)), key = new Map();
  if (CH.mode === 0) use.forEach((q, j) => key.set(q.i, Math.min(127, CH.key0 + j)));
  return { all: c, use, n: use.reduce((a, q) => a + (q.end - q.start), 0), key };
}
/* the label of chop i: its key, "—" when left out, nothing past the 16 kept ones or over the whole keyboard */
function chopKeyName(u, i) {
  if (CH.mode === 1) return "";
  const c = u.all[i];
  return c && c.off ? " —" : u.key.has(i) ? " " + noteName(u.key.get(i)) : "";
}
function chopOpt(i) { return CH.opt[i] || (CH.opt[i] = { off: false, len: 0 }); }
function chopKeep(i, keep) {                         /* keep / leave out chop i (keep undefined: toggle) */
  if (!CH.x || i < 0 || i >= CH.marks.length) return;
  const o = chopOpt(i);
  o.off = keep === undefined ? !o.off : !keep;
  chopRender();
}
function chopKeepAll(keep) { if (CH.x) { CH.opt = CH.marks.map((_, i) => ({ ...chopOpt(i), off: !keep })); chopRender(); } }
function chopSetLen(i, len) {                        /* the length of chop i in samples (0: up to the next marker) */
  if (!CH.x || i < 0 || i >= CH.marks.length) return;
  chopOpt(i).len = Math.max(0, Math.round(len));
  chopRender();
}
function chopFitAll() {                              /* shorten the longest kept chops so they all fit the slot */
  const { use } = chopUsed(), L = chopFit(use, SMP.MAX_DATA * 2 - use.length);   /* (an odd chop takes half a byte more) */
  if (!isFinite(L)) return;
  for (const c of use) if (c.end - c.start > L) chopOpt(c.i).len = L;
  sayK("chopFitted", chSecs(L));
  chopRender();
}

async function chopDecode(buf) {                    /* any file the browser decodes -> mono Float64 at SMP.RATE */
  try { const w = parseWav(buf); return resample(w.x, w.sr, SMP.RATE); } catch (e) { /* not a plain WAV */ }
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ab = await new Ctx(1, 1, SMP.RATE).decodeAudioData(buf.slice(0));
  const x = new Float64Array(ab.length);
  for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / ab.numberOfChannels; }
  return x;
}

async function chopLoad(f) {
  chopStop();
  try {
    const x = await chopDecode(await f.arrayBuffer());
    if (!x.length) throw new Error("no audio");
    CH.x = x;
    CH.nov = chopNovelty(x);
    CH.name = f.name.replace(/\.[^.]*$/, "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "CHOP";
    CH.marks = [];
    CH.opt = [];
    CH.sel = -1;
    CH.v0 = 0;
    CH.v1 = x.length;
    sayK("chopLoaded", `${f.name} (${chSecs(x.length)})`);
  } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  chopRender();
}

/* new markers; opt (aligned with m) their options, else each keeps the options of the marker it was */
function chopSetMarks(m, opt = null) {
  const was = new Map(CH.marks.map((v, i) => [v, CH.opt[i]])), seen = new Set(), pairs = [];
  m.forEach((v, i) => {
    const p = Math.max(0, Math.min(CH.x.length - 1, Math.round(v)));
    if (seen.has(p)) return;
    seen.add(p);
    const o = opt ? opt[i] : was.get(p);
    pairs.push([p, o ? { ...o } : { off: false, len: 0 }]);
  });
  pairs.sort((a, b) => a[0] - b[0]);
  CH.marks = pairs.map((q) => q[0]);
  CH.opt = pairs.map((q) => q[1]);
  if (CH.sel >= CH.marks.length) CH.sel = CH.marks.length - 1;
  chopRender();
}
function chopAdd(pos) {                              /* a new marker; one within 30 ms is moved there instead */
  const near = CH.marks.findIndex((m) => Math.abs(m - pos) < 0.03 * chR());
  const m = CH.marks.slice(), opt = CH.marks.map((_, i) => CH.opt[i]);
  if (near >= 0) m[near] = pos; else { m.push(pos); opt.push(null); }
  chopSetMarks(m, opt);
  CH.sel = CH.marks.indexOf(Math.round(pos));
  chopDraw();
}

/* ---- audio */
function chopCtx() {
  if (!CH.ctx) CH.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (CH.ctx.state === "suspended") CH.ctx.resume();
  return CH.ctx;
}
function chopBuffer(a, b) {
  const ctx = chopCtx(), n = Math.max(1, b - a), buf = ctx.createBuffer(1, n, SMP.RATE), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = CH.x[a + i];
  return buf;
}
function chopStop() {
  if (CH.src) { try { CH.src.stop(); } catch (e) { /* ended */ } CH.src = null; }
  cancelAnimationFrame(CH.raf);
  if (CH.ui) { CH.ui.play.textContent = t("chopPlay"); chopDraw(); }
}
/* play a..b; whole = the transport (a playhead, TAP marks), else an audition */
function chopPlay(a, b, whole) {
  if (!CH.x) return;
  chopStop();
  const ctx = chopCtx(), src = ctx.createBufferSource();
  const g = ctx.createGain();
  src.buffer = chopBuffer(a, b);
  src.connect(g).connect(ctx.destination);
  if (!whole) {                                     /* the fades the slot will have */
    const n = b - a, fo = Math.min(CHOP.FADE_OUT, n >> 2) / SMP.RATE, now = ctx.currentTime + 0.005, end = now + n / SMP.RATE;
    g.gain.setValueAtTime(1, now);
    g.gain.setValueAtTime(1, Math.max(now, end - fo));
    g.gain.linearRampToValueAtTime(0, end);
  }
  CH.t0 = ctx.currentTime + 0.005 - a / SMP.RATE;
  src.start(ctx.currentTime + 0.005);
  src.onended = () => { if (CH.src === src) { CH.src = null; if (whole) chopStop(); } };
  CH.src = src;
  CH.src.whole = whole;
  if (whole) {
    CH.ui.play.textContent = t("chopStop");
    const tick = () => { chopDraw(); if (CH.src === src) CH.raf = requestAnimationFrame(tick); };
    CH.raf = requestAnimationFrame(tick);
  }
}
/* where the listener is now, in samples (what comes out of the speakers, not what is computed) */
function chopHeard(ev) {
  const ctx = CH.ctx;
  let ct = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  if (ev && ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.performanceTime > 0) ct = ts.contextTime + (ev.timeStamp - ts.performanceTime) / 1000;
  }
  return (ct - CH.t0) * SMP.RATE;
}
function chopTap(ev) {                               /* TAP while it plays: a marker on the hit you meant */
  if (!CH.src || !CH.src.whole) return;
  const p = chopHeard(ev);
  if (p < 0 || p >= CH.x.length) return;
  chopAdd(CH.ui.snap.checked ? chopSnap(CH.x, CH.nov, p) : Math.round(p));
}
function chopAudition(i) {
  const c = chopChops()[i];
  if (!c) return;
  CH.sel = i;
  chopPlay(c.start, c.end, false);
  chopRender();
}

/* ---- drawing (the page's own two colours) */
function chopDraw() {
  const u = CH.ui;
  if (!u) return;
  const cv = u.cv, dpr = window.devicePixelRatio || 1, W = Math.max(200, cv.clientWidth), Hh = 150;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); }
  const g = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const FG = cs.getPropertyValue("--fg").trim(), DIM = cs.getPropertyValue("--dim").trim(), LINE = cs.getPropertyValue("--line").trim();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, Hh);
  if (!CH.x) { g.fillStyle = DIM; g.font = "12px sans-serif"; g.fillText(t("chopDrop"), 8, Hh / 2); return; }
  const x = CH.x, v0 = CH.v0, span = CH.v1 - CH.v0, X = (p) => (p - v0) / span * W, mid = Hh / 2 + 6;
  const U = chopUsed(), { all: chops, use } = U;
  const hatch = (a, b) => {                          /* what the slot does not get */
    g.save(); g.beginPath(); g.rect(a, 12, b - a, Hh - 12); g.clip(); g.strokeStyle = LINE;
    for (let q = Math.floor(a / 8) * 8 - 8; q < b; q += 8) { g.beginPath(); g.moveTo(q, Hh); g.lineTo(q + 8, 12); g.stroke(); }
    g.restore();
  };
  if (chops.length && chops[0].start > 0) hatch(X(0), X(chops[0].start));
  chops.forEach((c, i) => {                          /* the chops: the selected one filled, left-out parts hatched */
    const a = X(c.start), b = X(c.end), f = X(c.full);
    if (f < 0 || a > W) return;
    if (i === CH.sel) { g.fillStyle = LINE; g.fillRect(a, 12, b - a, Hh - 12); }
    if (!use.includes(c)) hatch(a, f); else if (c.end < c.full) hatch(b, f);
  });
  g.fillStyle = FG;
  for (let px = 0; px < W; px++) {                   /* the wave: min / max per pixel */
    const a = Math.floor(v0 + px / W * span), b = Math.min(x.length, Math.max(a + 1, Math.floor(v0 + (px + 1) / W * span)));
    let lo = 0, hi = 0;
    for (let i = a; i < b; i += Math.max(1, (b - a) >> 6)) { if (x[i] < lo) lo = x[i]; if (x[i] > hi) hi = x[i]; }
    g.fillRect(px, mid - hi * (Hh / 2 - 8), 1, Math.max(1, (hi - lo) * (Hh / 2 - 8)));
  }
  g.font = "10px sans-serif";
  CH.marks.forEach((m, i) => {                       /* the markers, numbered; the chop's key above */
    const px = X(m);
    if (px < -1 || px > W + 1) return;
    g.fillStyle = FG;
    g.fillRect(Math.round(px), 0, i === CH.sel ? 2 : 1, Hh);
    g.fillText(String(i + 1) + chopKeyName(U, i), px + 3, 10);
  });
  const sc = chops[CH.sel];
  if (sc) {                                          /* the selected chop's end: a handle at the bottom, drag it */
    const px = Math.round(X(sc.end));
    g.fillStyle = FG;
    g.fillRect(px - 1, Hh - 30, 2, 30);
    g.beginPath(); g.moveTo(px, Hh - 30); g.lineTo(px - 7, Hh - 38); g.lineTo(px - 7, Hh - 22); g.closePath(); g.fill();
  }
  if (CH.src && CH.src.whole && CH.ctx) {            /* the playhead, as heard */
    const p = X(chopHeard());
    g.fillStyle = DIM;
    g.fillRect(Math.round(p), 12, 1, Hh - 12);
  }
}

/* ---- the block */
function chopUI() {

  const u = CH.ui = {};
  const file = el("input", { type: "file", accept: "audio/*,.wav,.mp3,.aif,.aiff,.flac,.ogg,.m4a", hidden: true });

  u.mode = el("select", {}, el("option", { value: 0, text: t("chopModeKeys") }), el("option", { value: 1, text: t("chopModeOne") }));
  u.max = el("select", {}, ...[["—", 0], ["0.25 s", 0.25], ["0.5 s", 0.5], ["1 s", 1], ["2 s", 2]].map(([n, v]) => el("option", { value: v, text: n })));

  u.lenTxt = el("span", { class: "dim" });

  u.full = el("button", { onclick: () => chopSetLen(CH.sel, 0) }, t("chopFull"));
  u.selRow = el("div", { class: "head selrow" }, u.selName, el("label", {}, u.keep, " " + t("chopKeep")),

  u.fit = el("button", { onclick: chopFitAll }, t("chopFit"));
  u.send = [0, 1, 2].map((k) => el("button", { ic: "symbol_upload", onclick: () => chopSend(k) }, `USR${k + 1}`));
  const region = () => {                             /* first..last marker when there are two, else all */
    const m = CH.marks;
    return m.length >= 2 ? [m[0], m[m.length - 1]] : [m[0] || 0, CH.x.length];
  };
  u.key.addEventListener("change", () => { CH.key0 = +u.key.value; chopRender(); });
  u.mode.addEventListener("change", () => { CH.mode = +u.mode.value; chopRender(); });
  u.max.addEventListener("change", () => { CH.maxLen = +u.max.value; chopRender(); });
  box.append(
    el("div", { class: "head" }, el("b", { text: "CHOP" }),
      el("button", { ic: "symbol_folder_open", onclick: () => file.click() }, t("chopOpen")), file, u.info),
    u.cv,
    el("div", { class: "head" }, u.play, u.tap, el("label", {}, u.snap, " " + t("chopSnap")),
      el("button", { onclick: () => { if (CH.x) chopSetMarks([]); } }, t("chopClear")),
      el("span", { class: "dim", text: t("chopHint") })),
    el("div", { class: "head" },
      el("button", { onclick: () => { if (CH.x) chopSetMarks(chopHits(CH.x, CH.nov, +u.sens.value)); } }, t("chopHits")), u.sens,
      el("span", { class: "sep" }),
      el("button", { onclick: () => { if (CH.x) { const [a, b] = region(); chopSetMarks(chopGrid(a, b, Math.max(40, +u.bpm.value || 90), +u.div.value)); } } }, t("chopGrid")),
      u.bpm, el("span", { text: "BPM" }), u.div,
      el("span", { class: "sep" }),
      el("button", { onclick: () => { if (CH.x) { const [a, b] = region(); chopSetMarks(chopEqual(a, b, +u.n.value)); } } }, t("chopEqual")), u.n),
    el("div", { class: "head" }, el("span", { text: t("chopKey") }), u.key, u.mode,
      el("span", { text: t("chopMax") }), u.max, u.meter, u.room),
    el("div", { class: "head" }, el("button", { onclick: () => chopKeepAll(true) }, t("chopAll")),
      el("button", { onclick: () => chopKeepAll(false) }, t("chopNone")), u.fit,
      el("span", { class: "dim", text: t("chopKeepHint") })),
    u.list, u.selRow,
    el("div", { class: "head" }, el("span", { text: t("chopTo") }), ...u.send,
      el("button", { ic: "symbol_download", onclick: chopZip }, t("chopZip"))));
  /* the wave: click = select + listen, double-click = a marker, drag a marker, wheel = zoom */

    const m = CH.marks, k = CH.drag, lo = k ? m[k - 1] + 1 : 0, hi = k + 1 < m.length ? m[k + 1] - 1 : CH.x.length - 1;
    m[k] = Math.round(Math.max(lo, Math.min(hi, posAt(e))));

  });
  u.cv.addEventListener("pointerup", () => {
    if (CH.dragEnd) { CH.dragEnd = false; chopRender(); }

  });
  u.cv.addEventListener("dblclick", (e) => { if (CH.x) chopAdd(u.snap.checked ? chopSnap(CH.x, CH.nov, posAt(e), 0.02) : Math.round(posAt(e))); });
  u.cv.addEventListener("wheel", (e) => {
    if (!CH.x) return;
    e.preventDefault();
    const n = CH.x.length, span = CH.v1 - CH.v0;
    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      const d = (e.deltaX || e.deltaY) / 400 * span, v0 = Math.max(0, Math.min(n - span, CH.v0 + d));

    if (!CH.x) return;
    const k = e.key;
    if (k === " ") { e.preventDefault(); if (CH.src && CH.src.whole) chopTap(e); else chopPlay(Math.round(CH.v0), CH.x.length, true); }
    else if (k === "Enter" || k === "Escape") { e.preventDefault(); if (CH.src) chopStop(); else chopPlay(Math.round(CH.v0), CH.x.length, true); }
    else if (/^[0-9]$/.test(k)) { e.preventDefault(); chopAudition(k === "0" ? 9 : +k - 1); }
    else if ((k === "Delete" || k === "Backspace") && CH.sel >= 0) {
      e.preventDefault();
      chopSetMarks(CH.marks.filter((_, i) => i !== CH.sel), CH.marks.map((_, i) => CH.opt[i]).filter((_, i) => i !== CH.sel));
    }
    else if ((k === "k" || k === "K") && CH.sel >= 0) { e.preventDefault(); chopKeep(CH.sel); }
    else if ((k === "ArrowLeft" || k === "ArrowRight") && CH.sel >= 0) {   /* nudge the selected marker: 2 ms, shift 20 ms */
      e.preventDefault();
      const m = CH.marks.slice();
      m[CH.sel] += (k === "ArrowLeft" ? -1 : 1) * Math.round((e.shiftKey ? 0.02 : 0.002) * SMP.RATE);
      const keep = CH.sel;
      chopSetMarks(m, CH.marks.map((_, i) => CH.opt[i]));
      CH.sel = keep;
      chopRender();
    }
  });
  box.addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("over"); });
  box.addEventListener("dragleave", () => box.classList.remove("over"));
  box.addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("over"); if (e.dataTransfer.files[0]) chopLoad(e.dataTransfer.files[0]); });
  window.addEventListener("resize", () => chopDraw());
  chopRender();
}

function chopRender() {
  const u = CH.ui;
  if (!u) return;
  const U = chopUsed(), { all, use, n } = U, room = SMP.MAX_DATA * 2, over = use.reduce((a, q) => a + ((q.end - q.start + 1) >> 1), 0) > SMP.MAX_DATA;
  const kept = all.filter((c) => !c.off).length;
  u.info.textContent = CH.x ? `${CH.name} · ${chSecs(CH.x.length)} · ${all.length} ${t("chopChops")}` +
    (kept < all.length ? ` (${kept} ${t("chopKept")})` : "") : t("chopHelp");
  u.meter.value = Math.min(room, n);
  u.room.textContent = `${chSecs(n)} / ${chSecs(room)}` + (over ? " " + t("chopTooLong") + " " + t("chopOverHint") : "") +
    (CH.mode === 0 && kept > CHOP.MAX ? " " + t("chopTooMany") : "");
  u.room.className = over ? "bad" : "dim";
  u.fit.disabled = !over;
  u.send.forEach((b, k) => { b.disabled = !use.length || over || smpBusy || !dev || !dev.smp; b.hidden = !!(dev && dev.smp) && k >= dev.smp.nslots; });
  u.list.replaceChildren(...all.map((c, i) => {      /* a chip per chop: the box keeps it, the rest listens */
    const box = el("input", { type: "checkbox", title: t("chopKeep"), onclick: (e) => { e.stopPropagation(); chopKeep(i, box.checked); } });
    box.checked = !c.off;
    return el("span", {
      class: "chip" + (i === CH.sel ? " on" : "") + (use.includes(c) ? "" : " off"),
      title: `${chSecs(c.start)} · ${chSecs(c.end - c.start)}` + (c.end < c.full ? ` / ${chSecs(c.full - c.start)}` : ""),
      onclick: () => chopAudition(i),
    }, box, `${i + 1}` + chopKeyName(U, i));
  }));
  const c = all[CH.sel];                             /* the selected chop's row */
  u.selRow.hidden = !c;
  if (c) {
    const full = c.full - c.start;
    u.selName.textContent = `${t("chopSel")} ${CH.sel + 1}${chopKeyName(U, CH.sel)}`;
    u.keep.checked = !c.off;
    u.len.max = String(Math.max(10, Math.floor(full / SMP.RATE * 1000)));
    u.len.value = String(Math.round((c.end - c.start) / SMP.RATE * 1000));
    u.lenTxt.textContent = `${chSecs(c.end - c.start)} / ${chSecs(full)}`;
    u.full.disabled = c.end >= c.full;
  }
  chopDraw();
}

/* the chops into slot k's list (it shows below), then the usual upload */
async function chopSend(k) {
  if (!CH.x || smpBusy) return;
  const { use } = chopUsed();
  if (!use.length) return;
  const zones = chopZones(CH.x, chopChops(), CH.key0, CH.mode, Math.max(0, CH.sel));   /* (the kept ones) */
  smpDraft[k].name = CH.name;
  smpDraft[k].files = zones;
  renderSamples();
  if (await smpUpload(k)) sayK("chopSent", `USR${k + 1}: ${zones.length} ${t("chopChops")}, ${noteName(zones[0].lo === 0 ? zones[0].root : zones[0].lo)}…`);
}

function chopZip() {
  if (!CH.x) return;
  const zones = chopZones(CH.x, chopChops(), CH.key0, CH.mode, Math.max(0, CH.sel));
  if (!zones.length) return;
  const blob = new Blob([zipStore(zones.map((z) => ({ name: `${CH.name}/${z.fname}`, data: wavFile(z.s) })))], { type: "application/zip" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `${CH.name}-chops.zip` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------------------------------------------------------- mixer (v3) --- */
/* dev.mix = TRACK reply + pan per track ({sel, ntrk, tracks: [{engine, preset, level, mute, armed, pan}]}).
   Read on connect, after every RELOAD / sound change, with the slow safety DUMP and when the tab opens.
   The selected track's level / pan / mute are also Sound parameters: both views follow each other. */
let mixDrag = null;                 /* "lv:i" / "pan:i" while a strip control is dragged */
const mixEdit = new Map();          /* "lv:i" / "pan:i" -> time of the user's last change */
const mixCtl = [];                  /* per track: the strip's elements */
let panning = false;                /* v3 firmware: another track is selected for a moment (pan of a track that is not selected) */
const mixTouched = (kind, i) => mixDrag === `${kind}:${i}` || performance.now() - (mixEdit.get(`${kind}:${i}`) || 0) < 600
  || (!!dev && kind === "lv" && dev.link.hasQueued("mix:" + i))
  || (kind === "pan" && (panWant.has(i) || (!!dev && dev.link.hasQueued("pan:" + i))));
const drumTrack = (i) => !!dev && !!dev.mix && i === dev.info.drum;
function trackName(x) {
  if (x.engine >= dev.info.nengines) return ["DRUMS", (dev.kitNames || [])[x.e0]].filter(Boolean).join(" ");
  return [dev.info.engines[x.engine], (dev.names[x.engine] || [])[x.preset]].filter(Boolean).join(" ");
}

async function readMixer() {
  const d = dev;
  if (!d || !hasTracks()) return;
  const m = await mixer.read(rq, d.info, { pan: pPan() });
  if (d !== dev) return;
  if (d.mix) m.tracks.forEach((x, i) => {           /* what the user is moving stays */
    const o = d.mix.tracks[i];
    if (!o) return;
    if (mixTouched("lv", i)) { x.level = o.level; x.mute = o.mute; }
    if (mixTouched("pan", i)) x.pan = o.pan;
  });
  d.mix = m;
  if (m.sel !== d.sel && !panning) { d.sel = m.sel; needReload = true; }   /* selected on the device, push missed */
  renderMixer();
}

/* the Sound view's values of the selected track (and the drum level, a global) -> the strips */
function mixFromDump() {
  if (!dev || !dev.mix || !dev.dump || panning) return;
  const m = dev.mix, ds = dev.info.drum, x = m.tracks[dev.sel];
  if (!mixTouched("lv", ds)) m.tracks[ds].level = dev.dump.g[gDrLvl()];
  if (x) {
    if (!mixTouched("lv", dev.sel)) {
      if (dev.sel !== ds) x.level = dev.dump.p[P.LEVEL];
      x.mute = dev.dump.p[pMute()] ? 1 : 0;
    }
    if (!mixTouched("pan", dev.sel)) x.pan = dev.dump.p[pPan()];
  }
  if (mixCtl.length === m.ntrk) m.tracks.forEach((_, i) => updateStrip(i));
}
/* a strip's values -> the Sound view (selected track; the drum level always) */
function mixToSound(i) {
  const x = dev.mix.tracks[i];
  const put = (s, id, v) => { if (v == null) return; (s ? dev.dump.g : dev.dump.p)[id] = v; showValue(key(s, id), v, false); };
  if (drumTrack(i)) put(1, gDrLvl(), x.level);
  if (i !== dev.sel) return;
  if (!drumTrack(i)) put(0, P.LEVEL, x.level);
  put(0, pMute(), x.mute ? 1 : 0);
  put(0, pPan(), x.pan);
}

function renderMixer() {
  const box = $("mixer");
  if (!dev || !dev.mix) { box.replaceChildren(); mixCtl.length = 0; return; }
  const m = dev.mix;
  if (mixCtl.length !== m.ntrk || box.dataset.lang !== lang) {
    box.dataset.lang = lang;
    mixCtl.length = 0;
    box.replaceChildren(...m.tracks.map((_, i) => buildStrip(i)));
  }
  m.tracks.forEach((_, i) => updateStrip(i));
}
function buildStrip(i) {
  const drum = drumTrack(i);
  const lvDesc = (drum ? dev.gdesc[gDrLvl()] : dev.pdesc[P.LEVEL]) || { fmt: F.INT, min: 0, max: 127, def: 100 };
  const pDesc = dev.pdesc[pPan()] || { fmt: F.BIPCT, min: -64, max: 63, def: 0 };
  const fader = el("input", { type: "range", class: "fader", min: 0, max: 127, step: 1, "aria-label": `${t("level")} ${i + 1}` });
  fader.addEventListener("pointerdown", () => { mixDrag = "lv:" + i; });
  fader.addEventListener("input", () => setLevel(i, +fader.value));
  fader.addEventListener("change", () => setLevel(i, +fader.value));
  fader.addEventListener("dblclick", () => setLevel(i, Math.max(0, Math.min(127, lvDesc.def))));
  const pan = el("input", { type: "range", class: "pan", min: pDesc.min, max: pDesc.max, step: 1, "aria-label": `${t("pan")} ${i + 1}` });
  pan.addEventListener("pointerdown", () => { mixDrag = "pan:" + i; });
  pan.addEventListener("input", () => setPan(i, +pan.value, false));
  pan.addEventListener("change", () => setPan(i, +pan.value, true));
  pan.addEventListener("dblclick", () => setPan(i, pDesc.def, true));
  const c = {
    lvDesc, pDesc, fader, pan,
    num: el("button", { type: "button", class: "tog num", title: t("selectTrack"), onclick: () => selectTrack(i) }, String(i + 1)),
    snd: el("div", { class: "snd" }),
    rec: el("span", { class: "rec", ic: "control_rec_f", title: t("rec") }, t("rec")),
    solo: el("span", { class: "solo", text: t("solo") }),
    lvOut: el("span", { class: "v lv" }),
    mute: el("button", { type: "button", class: "tog", ic: "control_speaker_mute", onclick: () => setMute(i, !dev.mix.tracks[i].mute) }, t("mute")),
    panOut: el("span", { class: "v" }),
    selb: el("button", { type: "button", class: "selb", onclick: () => selectTrack(i) }),
  };
  c.strip = el("div", { class: "strip", role: "group", "aria-label": `${t("track")} ${i + 1}` },
    c.num, c.snd, c.rec, c.solo, fader, c.lvOut, c.mute, el("span", { class: "v dim", ic: "symbol_pan" }, t("pan")), pan, c.panOut, c.selb);
  mixCtl[i] = c;
  return c.strip;
}
function updateStrip(i) {
  const c = mixCtl[i], x = dev && dev.mix && dev.mix.tracks[i];
  if (!c || !x) return;
  const sel = i === dev.sel;
  c.strip.classList.toggle("sel", sel);
  c.num.setAttribute("aria-pressed", sel ? "true" : "false");
  const nm = trackName(x);
  c.snd.textContent = nm;
  c.snd.title = nm;
  if (!mixTouched("lv", i)) c.fader.value = String(x.level);
  const [lt, lu] = fmtValue(c.lvDesc, x.level);
  c.lvOut.textContent = lu ? `${lt} ${lu}` : lt;
  c.mute.setAttribute("aria-pressed", x.mute ? "true" : "false");
  c.strip.classList.toggle("muted", !!x.mute || !x.level);
  c.pan.disabled = x.pan == null;
  if (x.pan != null) {
    if (!mixTouched("pan", i)) c.pan.value = String(x.pan);
    const [pt, pu] = fmtValue(c.pDesc, x.pan);
    c.panOut.textContent = pu ? `${pt} ${pu}` : pt;
  }
  c.rec.classList.toggle("on", !!x.armed);
  c.solo.classList.toggle("on", !!((dev.mix.solo >> i) & 1));   /* v5: soloed on the device (GLO + key) */
  c.selb.disabled = sel;
  c.selb.textContent = t(sel ? "selectedTrack" : "selectTrack");
}
window.addEventListener("pointerup", () => { mixDrag = null; });
window.addEventListener("pointercancel", () => { mixDrag = null; });

/* level and mute: TRACK_MIX, one in flight per track and one queued with the latest values (as SET) */
function setLevel(i, v) {
  if (!dev || !dev.mix) return;
  dev.mix.tracks[i].level = v;
  mixEdit.set("lv:" + i, performance.now());
  updateStrip(i);
  mixToSound(i);
  sendMix(i);
}
function setMute(i, on) {
  if (!dev || !dev.mix) return;
  dev.mix.tracks[i].mute = on ? 1 : 0;
  mixEdit.set("lv:" + i, performance.now());
  updateStrip(i);
  mixToSound(i);
  sendMix(i);
}
async function sendMix(i) {
  const d = dev, x = d.mix.tracks[i];
  try {
    const r = await mixer.setMix(rq, i, x.level, x.mute, { key: "mix:" + i });
    if (d !== dev || !d.mix || mixDrag === "lv:" + i || d.link.hasQueued("mix:" + i)) return;
    const y = d.mix.tracks[i];                      /* the device's values after clamping */
    y.level = r.level; y.mute = r.mute;
    updateStrip(i);
    mixToSound(i);
  } catch (e) { report(e); }
}
/* pan: the selected track as any Sound parameter; another track with TRACK_PARAM (v4: while dragging, one in
   flight and one queued with the latest value), or with v3 firmware on release (it is selected for a moment) */
const panWant = new Map();
function setPan(i, v, final) {
  if (!dev || !dev.mix) return;
  dev.mix.tracks[i].pan = v;
  mixEdit.set("pan:" + i, performance.now());
  updateStrip(i);
  if (i === dev.sel) { userSet(0, pPan(), v, final); return; }
  if (dev.v4) panTrack(i, v);
  else if (final) panOther(i, v);
}
async function panTrack(i, v) {
  const d = dev;
  try {
    const r = await mixer.setPan(rq, i, d.sel, pPan(), v, true);
    if (d !== dev || !d.mix || mixDrag === "pan:" + i || d.link.hasQueued("pan:" + i)) return;
    d.mix.tracks[i].pan = r;                        /* the device's value after clamping */
    updateStrip(i);
    if (i === d.sel) mixToSound(i);
  } catch (e) { report(e); }
}
async function panOther(i, v) {
  panWant.set(i, v);
  if (panOther.run) return;
  panOther.run = true;
  const d = dev;
  try {
    while (busy && d === dev) await sleep(20);      /* not in the middle of another multi-request operation */
    busy++;
    panning = true;
    try {
      while (panWant.size && d === dev) {
        const [tr, val] = panWant.entries().next().value;
        panWant.delete(tr);
        const r = await mixer.setPan(rq, tr, d.sel, pPan(), val);
        if (d.mix && !panWant.has(tr)) { d.mix.tracks[tr].pan = r; updateStrip(tr); }
      }
    } finally { panning = false; busy--; }
  } catch (e) { report(e); } finally { panOther.run = false; panWant.clear(); }
}

/* ------------------------------------------------- live sync / polling --- */
/* With WATCH (protocol v2) the device pushes CHANGED / RELOAD / STEP_CHANGED; the editor PINGs about
   once a second so the watch stays on (it ends 3 s after the last request), and DUMPs every 5 s as a
   safety net. Older firmware: DUMP every 400 ms and two steps per round. */
function onPush(f) {
  const d = dev;
  if (!d || !d.dump || !d.info) return;
  try {
    if (f.cmd === CMD.CHANGED) {
      const c = parse[CMD.CHANGED](f.a);
      if (panning && !c.scope) return;              /* about the track selected for a moment, not ours */
      const arr = c.scope ? d.dump.g : d.dump.p;
      if (c.id >= arr.length) return;
      const k = key(c.scope, c.id);
      if (touched(k)) return;                       /* the user's value wins; their SET follows */
      const old = arr[c.id];
      arr[c.id] = c.value;
      showValue(k, c.value, false);
      blink(k);
      mixFromDump();
      if (!c.scope && c.id === pSlen() && old !== c.value) { $("steptables").dataset.len = ""; renderSteps(); }
      if (!c.scope && c.id === d.info.pe0 && drumGrid() && d.dstepsOk) renderDrumBar();   /* the kit, changed on the device */
    } else if (f.cmd === CMD.RELOAD) {
      d.sel = parse[CMD.RELOAD](f.a).track;          /* v3: another track may be selected on the device */
      if (selfReload.n > 0 && Date.now() < selfReload.until) { selfReload.n--; return; }
      needReload = true;
      maybeReload();
    } else if (f.cmd === CMD.STEP_CHANGED) {
      const { index } = parse[CMD.STEP_CHANGED](f.a);
      if (index < d.info.nstep) refreshStep(index);
    } else if (f.cmd === CMD.TRACK_CHANGED) {       /* v4: level / pan / mute of a track that is not selected */
      const c = parse[CMD.TRACK_CHANGED](f.a), x = d.mix && d.mix.tracks[c.track];
      if (!x || c.track === d.sel) return;
      if (c.id === pPan()) { if (!mixTouched("pan", c.track)) x.pan = c.value; }
      else if (c.id === pMute()) { if (!mixTouched("lv", c.track)) x.mute = c.value ? 1 : 0; }
      else if (c.id === P.LEVEL && !drumTrack(c.track)) { if (!mixTouched("lv", c.track)) x.level = c.value; }
      else return;
      updateStrip(c.track);
    }
  } catch (e) { console.warn("bad push", f, e); }
}
function blink(k) {
  const c = ctl.get(k);
  if (!c || !c.row) return;
  c.row.classList.add("pushed");
  clearTimeout(c.blink);
  c.blink = setTimeout(() => c.row.classList.remove("pushed"), 400);
}
async function refreshStep(i) {
  const d = dev;
  try {
    if (drumGrid() && d.dstepsOk) {
      const r = parse[CMD.DRUM_STEP](await rq(req.drumStep(i), { key: "dstep:" + i }));
      if (d !== dev || r.index !== i || !drumGrid()) return;
      d.dsteps[i] = r;
      d.steps[i] = drumAsStep(r);
      renderDrums();
      return;
    }
    const s = parse[CMD.STEP_GET](await rq(req.stepGet(i), { key: "step:" + i }));
    if (d !== dev || s.index !== i) return;
    d.steps[i] = s;
    updateStepRows();
  } catch (err) { report(err); }
}
function maybeReload() {
  if (!dev || busy || !needReload || !dev.dump) return;
  op(() => afterSoundChange("reloaded"));
}
/* one multi-request operation; polling waits for it */
async function op(fn) {
  if (!dev) return;
  busy++;
  try { await fn(); } catch (err) { report(err); } finally { busy--; }
}
function renderLive() {
  $("live").textContent = !dev || !dev.dump ? "" : t(dev.watch ? "live" : "polling");
}

/* keep-alive: PING when nothing else went out for ~1 s; after a longer gap (hidden tab, a long flash
   write: Link.onGap) the watch may have ended: WATCH again and re-read what may have been missed */
let rewatch = false;
async function keepAlive() {
  const d = dev;
  if (!d || !d.watch || !d.dump || document.hidden) return;
  const gap = Date.now() - d.link.lastSent;
  if (rewatch || gap > 2500) {
    if (keepAlive.run) return;
    keepAlive.run = true;
    try {
      const on = await startWatch((r, o) => d.link.request(r, o));
      rewatch = false;                              /* (this WATCH itself may have flagged the gap) */
      if (on) { d.v4 = on === 3; needReload = true; maybeReload(); }
      else if (d === dev) { d.watch = false; renderLive(); }
    } catch (e) { /* closed */ } finally { keepAlive.run = false; }
  } else if (gap > 850 && d.link.idle) {
    d.link.request(req.ping(), { key: "ping", quiet: true, retries: 0 }).catch(() => {});
  }
}
setInterval(keepAlive, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && dev && dev.watch) { rewatch = true; keepAlive(); } });

let stepRR = 0;
setInterval(async () => {
  if (!dev || busy || dragging || document.hidden || !dev.dump || !dev.link.idle) return;
  if (needReload) { maybeReload(); return; }
  if (dev.watch && Date.now() - lastDump < 5000) return;
  busy++;
  const d = dev;
  try {
    const dump = await getDump();
    if (d !== dev) return;
    const soundChanged = dump.engine !== d.dump.engine || dump.preset !== d.dump.preset;
    const engineChanged = dump.engine !== d.dump.engine;
    const oldLen = d.dump.p[pSlen()];
    for (const [k, c] of ctl) {
      const v = c.scope ? dump.g[c.id] : dump.p[c.id];
      if (touched(k)) { (c.scope ? dump.g : dump.p)[c.id] = c.scope ? d.dump.g[c.id] : d.dump.p[c.id]; continue; }
      showValue(k, v, false);
    }
    d.dump = dump;
    if (engineChanged) await rereadEngineDesc();
    if (hasTracks()) await readMixer();             /* the strips (other tracks push nothing) */
    if (soundChanged) { updateBrowser(); await loadSteps(); sayK("ready"); return; }
    if (dump.p[pSlen()] !== oldLen) { $("steptables").dataset.len = ""; renderSteps(); }
    if (d.watch) return;                            /* steps come as STEP_CHANGED */
    /* steps are not in DUMP: follow them two at a time */
    const len = Math.max(1, Math.min(d.info.nstep, dump.p[pSlen()] || 16));
    for (let n = 0; n < 2; n++) {
      stepRR = (stepRR + 1) % len;
      if (performance.now() - (stepEdit.get(stepRR) || 0) < 1500) continue;
      if (drumGrid() && d.dstepsOk) {
        const r = await getDrumStep(stepRR), o = d.dsteps[stepRR];
        d.dsteps[stepRR] = r;
        d.steps[stepRR] = drumAsStep(r);
        if (JSON.stringify(o) !== JSON.stringify(r)) renderDrums();
        continue;
      }
      const s = await getStep(stepRR);
      const o = d.steps[stepRR];
      d.steps[stepRR] = s;
      if (JSON.stringify(o) !== JSON.stringify(s)) updateStepRows();
    }
  } catch (err) { report(err); } finally { busy--; }
}, 400);

/* ------------------------------------------------------------ files --- */
$("savefile").addEventListener("click", () => {
  if (!dev) return;
  const engine = dev.dump.engine, preset = dev.dump.preset;
  const data = { format: "felucca-patch", version: 1, firmware: dev.info.version,

/* ----------------------------------------------------------- library --- */
/* Patches live in IndexedDB "felucca-editor": store "patches" (by id), store "meta" ("layout": the
   parameter keys / engine names the stored values are in). Without IndexedDB (some private windows)
   the library is kept in memory only. */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      const r = indexedDB.open("felucca-editor", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("patches", { keyPath: "id" }); r.result.createObjectStore("meta"); };
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (name, mode, fn) => {
    const db = await open();
    if (!db) return undefined;
    return new Promise((res, rej) => {
      const x = db.transaction(name, mode);
      let out;
      const r = fn(x.objectStore(name));
      if (r) r.onsuccess = () => { out = r.result; };
      x.oncomplete = () => res(out);
      x.onerror = x.onabort = () => rej(x.error || new Error("IndexedDB"));
    });
  };
  return {
    ok: async () => !!(await open()),
    all: () => tx("patches", "readonly", (os) => os.getAll()),
    putMany: (ps) => tx("patches", "readwrite", (os) => { ps.forEach((p) => os.put(p)); }),
    del: (id) => tx("patches", "readwrite", (os) => os.delete(id)),
    getMeta: (k) => tx("meta", "readonly", (os) => os.get(k)),
    setMeta: (k, v) => tx("meta", "readwrite", (os) => os.put(v, k)),
  };
})();

let lib = [];                  /* patches (cleanPatch + id) */
let libMeta = { keys: null, engines: null, pe0: null };
let libPersistent = false;
let libSel = null, bankSel = null;

const newId = () => (self.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const slotName = (i) => "U" + String(i + 1).padStart(2, "0");
const libCtx = () => (dev && dev.keys ? { keys: dev.keys, engines: dev.info.engines, firmware: dev.info.version, pe0: dev.info.pe0 }
  : { keys: libMeta.keys, engines: libMeta.engines, firmware: "", pe0: libMeta.pe0 });

async function libInit() {
  try {
    libPersistent = await store.ok();
    if (libPersistent) {
      lib = ((await store.all()) || []).filter((p) => p && p.id);
      libMeta = (await store.getMeta("layout")) || libMeta;
    }
  } catch (e) { console.warn(e); libPersistent = false; }
  renderLib();
}
async function libWrite(ps) {
  try { await store.putMany(ps); } catch (e) { console.warn(e); sayK("error", "IndexedDB: " + e.message); }
}
async function libAdd(patches) {
  const add = patches.map((p) => ({ ...cleanPatch(p), id: newId() }));
  lib.push(...add);
  if (add.length) libSel = add[add.length - 1].id;
  await libWrite(add);
  renderLib();
  return add;
}
async function libUpdate(p) {
  p.modified = nowIso();
  await libWrite([p]);
  renderLib();
}
/* the device's parameter layout becomes the library's; patches stored with another layout are mapped by key */
async function libAdopt(d) {
  const keys = d.keys, engines = d.info.engines, changed = [];
  if ((libMeta.keys && !sameKeys(libMeta.keys, keys)) || (libMeta.engines && !sameKeys(libMeta.engines, engines))) {
    for (const p of lib) {
      const name = p.engineName || (libMeta.engines || [])[p.engine];
      const e = name ? engines.indexOf(name) : p.engine;
      p.p = remapParams(p.p, libMeta.keys, keys);
      if (e >= 0) { p.engine = e; p.engineName = engines[e]; }
      changed.push(p);
    }
  }
  libMeta = { keys, engines, pe0: d.info.pe0 };
  if (changed.length) await libWrite(changed);
  try { await store.setMeta("layout", libMeta); } catch (e) { console.warn(e); }
  renderLib();
}
const engineOk = (p) => !!dev && p.engine < dev.info.nengines && (!p.engineName || dev.info.engines[p.engine] === p.engineName);
/* a full parameter set for UP_PUT: unknown values get the DESC default where it is known, else 0 */
function fullParams(p) {
  const out = [];
  for (let i = 0; i < dev.info.pcount; i++) {
    let v = p.p[i];
    if (v == null) {
      const d = dev.pdesc[i];
      v = d && (i < dev.info.pe0 || p.engine === dev.dump.engine) ? d.def : 0;
    }
    out.push(v);
  }
  return out;
}

    const u = await bank.get(rqf, dev.info, slot);
    if (!u.used) { sayK("emptySlot", slotName(slot)); return; }
    await libAdd([{ name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, tags: ["device"] }]);
    sayK("copiedLib", u.name);
  });
}
$("bkget").addEventListener("click", () => bankGet(bankSel));
$("bkerase").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  if (!s.used || !confirm(t("confirmEraseSlot").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async () => {
    checkRc(await bank.erase(rqf, slot));
    await refreshSlot(slot);
    sayK("erasedSlot", slotName(slot));
  });
});
$("bkrefresh").addEventListener("click", () => libOp(async () => {
  sayK("readingBank");
  dev.bank = await bank.list(rqf);
  sayK("ready");
}));
$("bkexport").addEventListener("click", () => libOp(async () => {
  const out = [];
  for (const x of dev.bank.slots) {
    if (!x.used) continue;
    sayK("readingBank", ` ${slotName(x.slot)}`);
    const u = await bank.get(rqf, dev.info, x.slot);
    if (u.used) out.push({ name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, slot: x.slot });
  }
  download(`felucca-bank-${today()}.json`, libraryFile("bank", out, libCtx()));
  sayK("ready");
}));

$("connect").addEventListener("click", () => {
  if (dev) { wantConnected = false; disconnect(); } else connect();
});
applyLang();
showTab(tab);
libInit();
if (!MOCK && !navigator.requestMIDIAccess) sayK("nomidi");
})();
</script>
</body>
</html>
