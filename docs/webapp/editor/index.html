function chopTap(ev) {                               /* TAP while it plays: a marker on the hit you meant */
  if (!CH.src || !CH.src.whole) return;
  const p = chopHeard(ev);
  if (p < 0 || p >= CH.x.length) return;
  chopAdd(CH.ui.snap.checked ? chopSnap(CH.x, CH.nov, p) : Math.round(p));
}
function chopAudition(i) {
  const c = chopChops()[i];
  if (!c) return;
  CH.sel = i;
  chopPlay(c.start, c.end, false);
  chopRender();
}

/* ---- drawing (the page's own two colours) */
function chopDraw() {
  const u = CH.ui;
  if (!u) return;
  const cv = u.cv, dpr = window.devicePixelRatio || 1, W = Math.max(200, cv.clientWidth), Hh = 150;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); }
  const g = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const FG = cs.getPropertyValue("--fg").trim(), DIM = cs.getPropertyValue("--dim").trim(), LINE = cs.getPropertyValue("--line").trim();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, Hh);
  const PIX = '16px "SLOOP Terminus", monospace', TRK = cs.getPropertyValue("--t1").trim() || FG;
  if (!CH.x) { g.fillStyle = DIM; g.font = PIX; g.fillText(t("chopDrop"), 12, Hh / 2 + 4); return; }
  const x = CH.x, v0 = CH.v0, span = CH.v1 - CH.v0, X = (p) => (p - v0) / span * W, mid = Hh / 2 + 6;
  const U = chopUsed(), { all: chops, use } = U;
  const hatch = (a, b) => {                          /* what the slot does not get */
    g.save(); g.beginPath(); g.rect(a, 12, b - a, Hh - 12); g.clip(); g.strokeStyle = LINE;
    for (let q = Math.floor(a / 8) * 8 - 8; q < b; q += 8) { g.beginPath(); g.moveTo(q, Hh); g.lineTo(q + 8, 12); g.stroke(); }
    g.restore();
  };
  if (chops.length && chops[0].start > 0) hatch(X(0), X(chops[0].start));
  chops.forEach((c, i) => {                          /* the chops: the selected one filled, left-out parts hatched */
    const a = X(c.start), b = X(c.end), f = X(c.full);
    if (f < 0 || a > W) return;
    if (i === CH.sel) { g.fillStyle = LINE; g.fillRect(a, 12, b - a, Hh - 12); }
    if (!use.includes(c)) hatch(a, f); else if (c.end < c.full) hatch(b, f);
  });
  g.fillStyle = TRK;
  for (let px = 0; px < W; px++) {                   /* the wave: min / max per pixel */
    const a = Math.floor(v0 + px / W * span), b = Math.min(x.length, Math.max(a + 1, Math.floor(v0 + (px + 1) / W * span)));
    let lo = 0, hi = 0;
    for (let i = a; i < b; i += Math.max(1, (b - a) >> 6)) { if (x[i] < lo) lo = x[i]; if (x[i] > hi) hi = x[i]; }
    g.fillRect(px, mid - hi * (Hh / 2 - 8), 1, Math.max(1, (hi - lo) * (Hh / 2 - 8)));
  }
  g.font = PIX;
  CH.marks.forEach((m, i) => {                       /* the markers, numbered; the chop's key above */
    const px = X(m);
    if (px < -1 || px > W + 1) return;
    g.fillStyle = FG;
    g.fillRect(Math.round(px), 0, i === CH.sel ? 2 : 1, Hh);
    g.fillText(String(i + 1) + chopKeyName(U, i), px + 3, 12);
  });
  const sc = chops[CH.sel];
  if (sc) {                                          /* the selected chop's end: a handle at the bottom, drag it */
    const px = Math.round(X(sc.end));
    g.fillStyle = FG;
    g.fillRect(px - 1, Hh - 30, 2, 30);
    g.beginPath(); g.moveTo(px, Hh - 30); g.lineTo(px - 7, Hh - 38); g.lineTo(px - 7, Hh - 22); g.closePath(); g.fill();
  }
  if (CH.src && CH.src.whole && CH.ctx) {            /* the playhead, as heard */
    const p = X(chopHeard());
    g.fillStyle = DIM;
    g.fillRect(Math.round(p), 12, 1, Hh - 12);
  }
}

/* ---- the block */
function chopUI() {

  const u = CH.ui = {};
  const file = el("input", { type: "file", accept: "audio/*,.wav,.mp3,.aif,.aiff,.flac,.ogg,.m4a", hidden: true });
  file.addEventListener("change", () => { if (file.files[0]) chopLoad(file.files[0]); file.value = ""; });

  u.key.value = String(CH.key0);
  u.mode = el("select", {}, el("option", { value: 0, text: t("chopModeKeys") }), el("option", { value: 1, text: t("chopModeOne") }));
  u.max = el("select", {}, ...[["—", 0], ["0.25 s", 0.25], ["0.5 s", 0.5], ["1 s", 1], ["2 s", 2]].map(([n, v]) => el("option", { value: v, text: n })));

  u.len = el("input", { type: "range", class: "len", min: 10, max: 1000, step: 1, title: t("chopLen"),
    oninput: () => { const c = chopChops()[CH.sel]; if (c) { const ms = +u.len.value, full = c.full - c.start; chopSetLen(CH.sel, ms >= Math.floor(full / SMP.RATE * 1000) ? 0 : ms * SMP.RATE / 1000); } } });
  u.lenTxt = el("span", { class: "dim" });

  u.selRow = el("div", { class: "head selrow" }, u.selName, el("label", {}, u.keep, " " + t("chopKeep")),
    el("span", { text: t("chopLen") }), u.len, u.lenTxt, u.selPlay, u.full);
  u.fit = el("button", { onclick: chopFitAll }, t("chopFit"));
  u.send = [0, 1, 2, 3].map((k) => el("button", { ic: "symbol_upload", onclick: () => chopSend(k) }, `USR${k + 1}`));
  const region = () => {                             /* first..last marker when there are two, else all */
    const m = CH.marks;

/* ---------------------------------------------------------- mixer (v3) --- */
/* dev.mix = TRACK reply + pan per track ({sel, ntrk, tracks: [{engine, preset, level, mute, armed, pan}]}).

  || (!!dev && kind === "lv" && dev.link.hasQueued("mix:" + i))

async function readMixer() {
  const d = dev;
  if (!d || !hasTracks()) return;
  const m = await mixer.read(rq, d.info, { pan: pPan() });
  if (d !== dev) return;
  if (d.mix) m.tracks.forEach((x, i) => {           /* what the user is moving stays */
    const o = d.mix.tracks[i];
    if (!o) return;
    if (mixTouched("lv", i)) { x.level = o.level; x.mute = o.mute; }
    if (mixTouched("pan", i)) x.pan = o.pan;
  });

  if (m.sel !== d.sel && !panning) { d.sel = m.sel; needReload = true; }   /* selected on the device, push missed */
  renderMixer();

/* the Sound view's values of the selected track (and the drum level, a global) -> the strips */
function mixFromDump() {

  if (x) {

  if (drumTrack(i)) put(1, gDrLvl(), x.level);

    snd: el("div", { class: "snd" }),
    rec: el("span", { class: "rec", ic: "control_rec_f", title: t("rec") }, t("rec")),
    solo: el("span", { class: "solo", text: t("solo") }),
    lvOut: el("span", { class: "v lv" }),
    mute: el("button", { type: "button", class: "tog", ic: "control_speaker_mute", onclick: () => setMute(i, !dev.mix.tracks[i].mute) }, t("mute")),
    panOut: el("span", { class: "v" }),

    c.num, c.snd, c.rec, c.solo, fader, c.lvOut, c.mute, el("span", { class: "v dim", ic: "symbol_pan" }, t("pan")), pan, c.panOut, c.selb);

window.addEventListener("pointerup", () => { mixDrag = null; });
window.addEventListener("pointercancel", () => { mixDrag = null; });

/* level and mute: TRACK_MIX, one in flight per track and one queued with the latest values (as SET) */
function setLevel(i, v) {

/* ------------------------------------------------- live sync / polling --- */
/* With WATCH (protocol v2) the device pushes CHANGED / RELOAD / STEP_CHANGED; the editor PINGs about

    if (f.cmd === CMD.CHANGED) {
      const c = parse[CMD.CHANGED](f.a);
      if (panning && !c.scope) return;              /* about the track selected for a moment, not ours */
      const arr = c.scope ? d.dump.g : d.dump.p;
      if (c.id >= arr.length) return;
      const k = key(c.scope, c.id);
      if (touched(k)) return;                       /* the user's value wins; their SET follows */
      const old = arr[c.id];
      arr[c.id] = c.value;
      showValue(k, c.value, false);
      blink(k);
      mixFromDump();
      if (!c.scope && c.id === pSlen() && old !== c.value) { $("steptables").dataset.len = ""; renderSteps(); }
      if (!c.scope && c.id === d.info.pe0 && drumGrid() && d.dstepsOk) renderDrumBar();   /* the kit, changed on the device */
      if (!c.scope && c.id === d.info.pe0 + 7 && fm6On()) fm6Later();   /* PTCH turned on the device: another patch */
    } else if (f.cmd === CMD.RELOAD) {

      else if (c.id === pMute()) { if (!mixTouched("lv", c.track)) x.mute = c.value ? 1 : 0; }
      else if (c.id === P.LEVEL && !drumTrack(c.track)) { if (!mixTouched("lv", c.track)) x.level = c.value; }

/* keep-alive: PING when nothing else went out for ~1 s; after a longer gap (hidden tab, a long flash
   write: Link.onGap) the watch may have ended: WATCH again and re-read what may have been missed */
let rewatch = false;
async function keepAlive() {
  const d = dev;
  if (!d || !d.watch || !d.dump || document.hidden) return;
  const gap = Date.now() - d.link.lastSent;
  if (rewatch || gap > 2500) {
    if (keepAlive.run) return;
    keepAlive.run = true;
    try {
      const on = await startWatch((r, o) => d.link.request(r, o));
      rewatch = false;                              /* (this WATCH itself may have flagged the gap) */
      if (on) { d.v4 = on === 3; needReload = true; maybeReload(); }
      else if (d === dev) { d.watch = false; renderLive(); }
    } catch (e) { /* closed */ } finally { keepAlive.run = false; }
  } else if (gap > 850 && d.link.idle) {
    d.link.request(req.ping(), { key: "ping", quiet: true, retries: 0 }).catch(() => {});
  }
}
setInterval(keepAlive, 1000);

let stepRR = 0;
setInterval(async () => {
  if (!dev || busy || dragging || document.hidden || !dev.dump || !dev.link.idle) return;
  if (needReload) { maybeReload(); return; }
  if (dev.watch && Date.now() - lastDump < 5000) return;
  busy++;
  const d = dev;
  try {
    const dump = await getDump();
    if (d !== dev) return;
    const soundChanged = dump.engine !== d.dump.engine || dump.preset !== d.dump.preset;
    const engineChanged = dump.engine !== d.dump.engine;
    const oldLen = d.dump.p[pSlen()];
    for (const [k, c] of ctl) {
      const v = c.scope ? dump.g[c.id] : dump.p[c.id];
      if (touched(k)) { (c.scope ? dump.g : dump.p)[c.id] = c.scope ? d.dump.g[c.id] : d.dump.p[c.id]; continue; }
      showValue(k, v, false);
    }
    d.dump = dump;
    if (engineChanged) await rereadEngineDesc();
    if (hasTracks()) await readMixer();             /* the strips (other tracks push nothing) */
    if (soundChanged) { updateBrowser(); await loadSteps(); sayK("ready"); return; }
    if (dump.p[pSlen()] !== oldLen) { $("steptables").dataset.len = ""; renderSteps(); }
    if (d.watch) return;                            /* steps come as STEP_CHANGED */
    /* steps are not in DUMP: follow them two at a time */
    const len = Math.max(1, Math.min(d.info.nstep, dump.p[pSlen()] || 16));
    for (let n = 0; n < 2; n++) {
      stepRR = (stepRR + 1) % len;
      if (performance.now() - (stepEdit.get(stepRR) || 0) < 1500) continue;
      if (drumGrid() && d.dstepsOk) {
        const r = await getDrumStep(stepRR), o = d.dsteps[stepRR];
        d.dsteps[stepRR] = r;
        d.steps[stepRR] = drumAsStep(r);
        if (JSON.stringify(o) !== JSON.stringify(r)) renderDrums();
        continue;
      }
      const s = await getStep(stepRR);
      const o = d.steps[stepRR];
      d.steps[stepRR] = s;
      if (JSON.stringify(o) !== JSON.stringify(s)) updateStepRows();
    }
  } catch (err) { report(err); } finally { busy--; }
}, 400);

/* ----------------------------------------------------------- library --- */
/* Patches live in IndexedDB "felucca-editor": store "patches" (by id), store "meta" ("layout": the
   parameter keys / engine names the stored values are in). Without IndexedDB (some private windows)
   the library is kept in memory only. */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      const r = indexedDB.open("felucca-editor", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("patches", { keyPath: "id" }); r.result.createObjectStore("meta"); };
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (name, mode, fn) => {
    const db = await open();
    if (!db) return undefined;
    return new Promise((res, rej) => {
      const x = db.transaction(name, mode);
      let out;
      const r = fn(x.objectStore(name));
      if (r) r.onsuccess = () => { out = r.result; };
      x.oncomplete = () => res(out);
      x.onerror = x.onabort = () => rej(x.error || new Error("IndexedDB"));
    });
  };
  return {
    ok: async () => !!(await open()),
    all: () => tx("patches", "readonly", (os) => os.getAll()),
    putMany: (ps) => tx("patches", "readwrite", (os) => { ps.forEach((p) => os.put(p)); }),
    del: (id) => tx("patches", "readwrite", (os) => os.delete(id)),
    getMeta: (k) => tx("meta", "readonly", (os) => os.get(k)),
    setMeta: (k, v) => tx("meta", "readwrite", (os) => os.put(v, k)),
  };
})();

  : { keys: libMeta.keys, engines: libMeta.engines, firmware: "", pe0: libMeta.pe0 });

    }

async function libAdopt(d) {

    for (const p of lib) {

      const e = name ? engines.indexOf(name) : p.engine;
      p.p = remapParams(p.p, libMeta.keys, keys);

/* the ticked voices into B1..Bn in one write: the bank is read whole (backup object 8), those slots replaced, the rest

  op(async () => {
    let puts = [], upTxt = "";

      const list = await bank.list(rq);
      const slots = fm6CartSlots(list, n, fm6Up);
      if (!slots) {
        sayK(fm6Up === "free" ? "fm6UpNoRoom" : "fm6UpPast", fm6Up === "free" ? ` ${list.slots.filter((x) => !x.used).length}` : ` ${slotName(fm6Up)} + ${n}`);
        return;

      const over = slots.map((s) => list.slots[s]).filter((x) => x && x.used);

});
$("libexport").addEventListener("click", () => download(`felucca-library-${today()}.json`, libraryFile("library", lib, libCtx())));
$("libimport").addEventListener("click", () => { $("libfile").value = ""; $("libfile").click(); });
$("libfile").addEventListener("change", async () => {
  let n = 0, skipped = 0;
  for (const f of [...$("libfile").files]) {
    try {
      const obj = JSON.parse(await f.text());
      const ctx = libCtx();
      const r = readLibraryFile(obj, ctx);
      if (!ctx.keys && r.keys) {                     /* no layout yet: the file's becomes the library's */
        libMeta = { keys: r.keys, engines: Array.isArray(obj.engines) ? obj.engines : null, pe0: obj.pE0 ?? null };
        try { await store.setMeta("layout", libMeta); } catch (e) { console.warn(e); }
      }
      if (obj.kind === "bank") r.patches.forEach((p) => { if (!p.tags.includes("bank")) p.tags.push("bank"); });
      await libAdd(r.patches);
      n += r.patches.length;
      skipped += r.skipped;
    } catch (e) { sayK("badfile", `${f.name}: ${e.message}`); return; }
  }
  sayK("imported", n + (skipped ? t("skippedN").replace("{n}", skipped) : t("patchesN")));
});

/* device bank */
function bankLoad(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  if (isDrum()) { sayK("drumNoSound"); return; }
  const s = dev.bank.slots[slot];
  libOp(async () => {
    selfLoad();
    const rc = await bank.load(rqf, slot);
    if (rc) { sayK("emptySlot", slotName(slot)); return; }
    await afterSoundChange();
    sayK("loadedUser", `${slotName(slot)} ${s.name}`);
  });
}
$("bkload").addEventListener("click", () => bankLoad(bankSel));
$("bkstore").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  if (isDrum()) { sayK("drumNoSound"); return; }
  const s = dev.bank.slots[slot];
  const name = prompt(t("promptNameAuto"), s.used ? s.name : "");
  if (name == null) return;
  if (s.used && !confirm(t("confirmOverwrite").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async () => {
    checkRc(await bank.store(rqf, slot, name.trim()));
    await refreshSlot(slot);
    sayK("storedSlot", `${slotName(slot)} ${dev.bank.slots[slot].name}`);
  });
});
function bankGet(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  libOp(async () => {
    const u = await bank.get(rqf, dev.info, slot);
    if (!u.used) { sayK("emptySlot", slotName(slot)); return; }
    await libAdd([{ name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, tags: ["device"] }]);
    sayK("copiedLib", u.name);
  });
}
$("bkget").addEventListener("click", () => bankGet(bankSel));
$("bkerase").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  if (!s.used || !confirm(t("confirmEraseSlot").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async () => {
    checkRc(await bank.erase(rqf, slot));
    await refreshSlot(slot);
    sayK("erasedSlot", slotName(slot));
  });
});
$("bkrefresh").addEventListener("click", () => libOp(async () => {
  sayK("readingBank");
  dev.bank = await bank.list(rqf);
  sayK("ready");
}));
$("bkexport").addEventListener("click", () => libOp(async () => {
  const out = [];
  for (const x of dev.bank.slots) {
    if (!x.used) continue;
    sayK("readingBank", ` ${slotName(x.slot)}`);
    const u = await bank.get(rqf, dev.info, x.slot);
    if (u.used) out.push({ name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, slot: x.slot });
  }
  download(`felucca-bank-${today()}.json`, libraryFile("bank", out, libCtx()));
  sayK("ready");
}));

$("connect").addEventListener("click", () => {
  if (dev) { wantConnected = false; disconnect(); } else connect();
});
applyLang();
showTab(tab);
libInit();
if (!MOCK && !navigator.requestMIDIAccess) sayK("nomidi");
})();
</script>
