<!-- Felucca web editor. One file, no libraries. Protocol: EDITOR_PROTOCOL.md.
     Add ?mock=1 to the URL to use a built-in simulated device. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLOOP Editor</title>
<style>
  /* Fukiai: Hügelton Instruments' icon font (MIT, FUKIAI-LICENSE.txt). Icons are text in .ic spans;
     they stay hidden until the face has loaded (html.fk), so a missing font never shows boxes. */
  @font-face { font-family: "Fukiai"; src: url("fukiai.ttf") format("truetype"); font-display: block; unicode-range: U+EA00-EB09; }
  :root { --bg: #fff; --fg: #000; --dim: #777; --line: #ccc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  }
  :root[data-theme="dark"] { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         font-variant-numeric: tabular-nums; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--fg); }
  h3 { font-size: 11px; font-weight: 400; color: var(--dim); margin: 4px 0 0; }
  a { color: inherit; }
  .lang { float: right; font-size: 12px; color: var(--dim); text-decoration: underline; background: none; padding: 0; }
  button { font: inherit; background: var(--fg); color: var(--bg); border: 0; padding: 2px 10px; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  button.lang { color: var(--dim); background: none; }
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 1px 3px; border-radius: 0; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--fg); }
  input[type=checkbox] { accent-color: var(--fg); margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 8px; }
  .dim { color: var(--dim); }
  #status { min-height: 1.4em; }
  section { margin: 12px 0; }
  .groups { columns: 250px; column-gap: 20px; }
  .group { break-inside: avoid; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 46px 1fr 70px; gap: 6px; align-items: center; min-height: 22px; }
  .row .v { text-align: right; white-space: nowrap; }
  .row select { width: 100%; }
  .browser { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .browser select[size] { min-width: 150px; }
  .slots { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 8px; align-items: center; justify-content: start; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: var(--dim); text-align: left; padding: 0 6px 2px 0; }
  td { padding: 1px 6px 1px 0; }
  td.i { color: var(--dim); text-align: right; }
  #steps input[type=text] { width: 120px; }
  #steps input[type=number] { width: 48px; }
  #steps .bad { outline: 1px solid var(--fg); text-decoration: underline wavy; }
  #steps tr.off td { color: var(--dim); }
  .stepcols { columns: 470px; column-gap: 24px; }
  .stepcols table { break-inside: avoid; }
  @media (max-width: 600px) {
    .stepcols { columns: auto; overflow-x: auto; }
    #steps input[type=text] { width: 84px; }
    #steps input[type=number] { width: 42px; }
    #steps th, #steps td { padding-right: 3px; }
  }
  .smp { margin: 0 0 14px; padding: 6px 0 0; border-top: 1px solid var(--line); }
  .smp.over { outline: 1px solid var(--fg); outline-offset: 2px; }
  .smp .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .smp .head b { font-weight: 600; min-width: 40px; }
  .smp progress { width: 160px; height: 6px; accent-color: var(--fg); }
  .smp table { margin: 4px 0; }
  .smp input.name { width: 80px; text-transform: uppercase; }
  .smp input.root { width: 48px; }
  .smp .bad { text-decoration: underline wavy; }
  .chop canvas.wave { display: block; width: 100%; height: 150px; margin: 6px 0; border: 1px solid var(--line); cursor: default; touch-action: none; }
  .chop canvas.wave:focus { outline: 1px solid var(--fg); }
  .chop .head { margin: 3px 0; }
  .chop .sep { width: 8px; }
  .chop input.num { width: 56px; }
  .chop input[type=range] { width: 90px; accent-color: var(--fg); }
  .chop button.tap { min-width: 72px; }
  .chop .chops { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
  .chop .chip { background: none; color: var(--fg); border: 1px solid var(--line); padding: 1px 6px; }
  .chop .chip.on { background: var(--fg); color: var(--bg); }
  .chop .chip { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
  .chop .chip input { margin: 0; accent-color: var(--fg); }
  .chop .chip.off { color: var(--dim); text-decoration: line-through; }
  .chop .chip.on input { accent-color: var(--bg); }
  .chop input.len { width: 160px; }
  .chop .selrow[hidden] { display: none; }
  footer { margin-top: 24px; font-size: 11px; color: var(--dim); }
  .row.pushed .v { font-weight: 600; }
  /* librarian: local library and the device's user bank side by side, stacked on a phone */
  .libcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 8px 24px; margin-top: 6px; }
  .libcols > div { min-width: 0; }
  .libcols .bar input[type=search] { flex: 1 1 120px; min-width: 0; }
  .list { height: 260px; overflow: auto; border: 1px solid var(--line); resize: vertical; }
  .list table { width: 100%; table-layout: fixed; }
  .list th { position: sticky; top: 0; background: var(--bg); padding: 1px 6px; }
  .list td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list tr[data-id], .list tr[data-slot] { cursor: pointer; }
  .list tr.sel td { background: var(--fg); color: var(--bg); }
  .list tr.empty td { color: var(--dim); }
  .list tr.over td { outline: 1px dashed var(--fg); outline-offset: -1px; }
  .list.over { outline: 1px solid var(--fg); }
  .list .none { padding: 6px; color: var(--dim); }
  .list col.n { width: 40px; } .list col.e { width: 72px; } .list col.d { width: 78px; }
  .ic { font-family: "Fukiai"; font-style: normal; font-weight: 400; font-synthesis: none; line-height: 1; margin-right: .3em; }
  html:not(.fk) .ic { display: none; }
  /* wave choices: a page-drawn picker so the options can carry an icon (Chrome 135+); native menus get words only */
  @supports (appearance: base-select) {
    select.wave, select.wave::picker(select) { appearance: base-select; }
    select.wave { padding: 1px 3px; min-block-size: 0; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--fg); }
    select.wave > button { font: inherit; background: none; color: inherit; padding: 0; text-align: start; }
    select.wave::picker(select) { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0; }
    select.wave option { padding: 1px 6px; min-block-size: 0; }
    select.wave option:checked { font-weight: 600; }
    select.wave option:hover, select.wave option:focus-visible { background: var(--fg); color: var(--bg); }
    select.wave option::checkmark { display: none; }
  }
  /* tabs: a wrapping row of plain buttons, the open one inverted; header stays at the top on wide screens */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 0; }
  @media (max-width: 600px) { .top { position: static; } }
  .tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--fg); margin: 6px 0 0; }
  .tabs button { background: none; color: var(--dim); padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; white-space: nowrap; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
  .trackbar { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button, button.tog { background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 1px 10px; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"], button.tog[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .panel { margin: 12px 0; }
  .hint { margin: 16px 0; color: var(--dim); }
  /* sequencer: a step grid over the selected track (16 per row, 8 on a phone) */
  .grid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; margin: 6px 0 12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .grid button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 2px; min-width: 0; height: 52px;
                 display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; text-align: left; overflow: hidden; font-size: 10px; line-height: 1.15; }
  .grid button .n { color: var(--dim); }
  .grid button .x { overflow: hidden; overflow-wrap: anywhere; flex: 1; }
  .grid button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .grid button.on .n { color: inherit; opacity: .6; }
  .grid button.acc .x { font-weight: 700; }
  .grid button.tie { border-style: dashed; border-color: var(--fg); }
  .grid button.beat { border-left-color: var(--fg); }
  #steps tr.hl td { outline: 1px solid var(--fg); }
  /* v5: the drum track as 16 lanes x LEN steps; a hit's level by its shade, its ratchet as a number */
  .dgrid { display: grid; gap: 1px; margin: 6px 0 12px; overflow-x: auto; }
  .dgrid .ln { font-size: 10px; color: var(--dim); white-space: nowrap; padding-right: 6px; align-self: center; }
  .dgrid .hd { font-size: 9px; color: var(--dim); }
  .dgrid .gap { grid-column: 1 / -1; height: 8px; }
  .dgrid button { background: var(--bg); color: var(--bg); border: 1px solid var(--line); padding: 0; min-width: 16px; height: 18px;
                  font-size: 9px; line-height: 1; font-weight: 700; }
  .dgrid button.beat { border-left-color: var(--fg); }
  .dgrid button.on { background: var(--fg); border-color: var(--fg); opacity: .85; }
  .dgrid button.on.l1 { opacity: .3; }
  .dgrid button.on.l2 { opacity: .6; }
  .dgrid button.on.l3 { opacity: 1; box-shadow: 0 0 0 1px var(--fg); }
  .strip .solo { font-size: 11px; font-weight: 600; visibility: hidden; }
  .strip .solo.on { visibility: visible; }
  /* mixer: four channel strips as on the device's TRACKS page */
  .mixer { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 640px; margin: 6px 0; }
  .strip { border: 1px solid var(--line); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .strip.sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .strip .num { font-size: 18px; font-weight: 600; line-height: 1; }
  .strip .snd { font-size: 11px; line-height: 1.3; width: 100%; text-align: center; overflow-wrap: anywhere; min-height: 2.6em; }
  .strip .rec { font-size: 11px; color: var(--dim); }
  .strip .rec.on { color: var(--fg); font-weight: 600; }
  .strip .rec:not(.on) .ic { visibility: hidden; }
  .strip input.fader { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 150px; }
  .strip .v { font-size: 11px; white-space: nowrap; }
  .strip .pan { width: 100%; }
  .strip.muted .fader, .strip.muted .lv { opacity: .35; }
  .strip button { width: 100%; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip button.selb:disabled { opacity: 1; background: none; color: var(--dim); }
  #sysinfo th { padding-right: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <button class="lang" id="lang"></button>
  <h1>SLOOP Editor</h1>
  <p class="dim"><a href="../installer/" style="color:inherit" data-t="installer"></a></p>
  <!-- always visible: connection, version, sync mode, the tabs and (Sound / Sequencer / Tracks) the track selector -->
  <header class="top">
    <div class="bar">
      <button id="connect" data-t="connect" data-ic="port_usb_c"></button>
      <span id="version" class="dim"></span>
      <span id="live" class="dim"></span>
      <span id="mock" class="dim" hidden data-t="mock"></span>
    </div>
    <div id="status"></div>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="sound" data-t="sound" data-ic="symbol_audio"></button>
      <button role="tab" data-tab="sequencer" data-t="tabSeq" data-ic="symbol_grid"></button>
      <button role="tab" data-tab="tracks" data-t="tabTracks" data-ic="ui_slider_vertical"></button>
      <button role="tab" data-tab="library" data-t="library" data-ic="symbol_books"></button>
      <button role="tab" data-tab="samples" data-t="samples" data-ic="symbol_waves"></button>
      <button role="tab" data-tab="projects" data-t="projects" data-ic="symbol_folder"></button>
      <button role="tab" data-tab="settings" data-t="tabSettings" data-ic="symbol_cog"></button>
    </nav>
    <div class="trackbar" id="trackbar" hidden><span class="dim" data-t="track"></span><span class="seg" id="trackbtns" role="group"></span></div>
  </header>
  <p class="hint" id="hint" hidden></p>

  <section class="panel" id="p-sound" data-tab="sound" data-dev hidden>
    <div class="browser" id="browser">
      <label><span data-t="engine"></span><br><select id="engine"></select></label>
      <label><span data-t="presets"></span><br><select id="preset" size="8"></select></label>
      <div>
        <p class="bar"><button id="init" data-t="initSound"></button>
          <button id="factlib" data-t="factoryToLib" data-ic="symbol_folder"></button></p>
        <p class="bar"><button id="savefile" data-t="saveFile" data-ic="symbol_download"></button>
          <button id="loadfile" data-t="loadFile" data-ic="symbol_upload"></button>
          <input type="file" id="file" accept=".json,application/json" hidden></p>
      </div>
    </div>
    <p class="dim" id="drumnote" data-t="drumNote" hidden></p>
    <p class="dim" id="ctlhelp" data-t="ctlHelp"></p>
    <div class="groups" id="groups"></div>
  </section>

  <section class="panel" id="p-sequencer" data-tab="sequencer" data-dev hidden>
    <div class="groups" id="seqgroups"></div>
    <div id="steps">
      <h2 data-t="steps" data-ic="note_eight"></h2>
      <p class="bar"><button id="reloadsteps" data-t="reload" data-ic="control_arrow_loop"></button>
        <button id="clearseq" data-t="clearSeq" data-ic="symbol_trash"></button>
        <span class="dim" id="noteshelp"></span></p>
      <div class="bar" id="drumbar" hidden></div>
      <div class="dgrid" id="drumgrid" hidden></div>
      <div class="grid" id="stepgrid"></div>
      <div class="stepcols" id="steptables"></div>
    </div>
  </section>

  <section class="panel" id="p-tracks" data-tab="tracks" data-dev hidden>
    <h2 data-t="mixer" data-ic="ui_slider_vertical"></h2>
    <div class="mixer" id="mixer"></div>
    <p class="dim" data-t="mixHelp"></p>
  </section>

  <!-- works without a device too (the device bank shows while connected) -->
  <section class="panel" id="p-library" data-tab="library" hidden>
    <div class="libcols" id="libsec">
      <div id="libpane">
        <h2 data-t="library" data-ic="symbol_books"></h2>
        <div class="bar">
          <input type="search" id="libq" spellcheck="false">
          <select id="libeng"></select>
          <select id="libtag"></select>
          <select id="libsort"></select>
        </div>
        <div class="list" id="liblist"></div>
        <p class="bar" style="margin-top:6px">
          <button id="libaud" data-t="audition" data-ic="symbol_audio"></button>
          <button id="libput" data-t="toSlot" data-ic="symbol_upload"></button>
          <button id="libren" data-t="rename"></button>
          <button id="libtags" data-t="tags"></button>
          <button id="libdup" data-t="duplicate"></button>
          <button id="libdel" data-t="delete" data-ic="symbol_trash"></button>
          <button id="libexp1" data-t="exportPatch" data-ic="symbol_download"></button>
        </p>
        <p class="bar">
          <button id="libsave" data-t="saveToLib" data-ic="port_disk"></button>
          <button id="libimport" data-t="import" data-ic="symbol_upload"></button>
          <button id="libexport" data-t="exportLib" data-ic="symbol_download"></button>
          <input type="file" id="libfile" accept=".json,application/json" multiple hidden>
          <span class="dim" id="libcount"></span>
        </p>
      </div>
      <div>
        <h2 data-t="bank" data-ic="port_disk"></h2>
        <p class="dim" id="bankhint"></p>
        <div id="bankpane" hidden>
          <div class="bar"><b id="bankhead"></b></div>
          <div class="list" id="banklist"></div>
          <p class="bar" style="margin-top:6px">
            <button id="bkload" data-t="bankLoad" data-ic="symbol_folder_open"></button>
            <button id="bkstore" data-t="bankStore" data-ic="port_disk"></button>
            <button id="bkget" data-t="bankGet" data-ic="symbol_download"></button>
            <button id="bkerase" data-t="erase" data-ic="symbol_trash"></button>
          </p>
          <p class="bar">
            <button id="bkrefresh" data-t="reload" data-ic="control_arrow_loop"></button>
            <button id="bkexport" data-t="exportBank" data-ic="symbol_download"></button>
            <span class="dim" data-t="dndHelp"></span>
          </p>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-samples" data-tab="samples" data-dev hidden>
    <h2 data-t="samples" data-ic="symbol_waves"></h2>
    <p class="dim" data-t="smpHelp"></p>
    <div class="smp chop" id="chop"></div>
    <div id="smpslots"></div>
  </section>

  <section class="panel" id="p-projects" data-tab="projects" data-dev hidden>
    <h2 data-t="projects" data-ic="symbol_folder"></h2>
    <p class="dim" data-t="projHelp"></p>
    <div class="slots" id="slots"></div>
    <div class="group" id="bkgroup" style="margin-top:16px" hidden>
      <h2 data-t="bkTitle" data-ic="port_disk"></h2>
      <p class="dim" data-t="bkHelp"></p>
      <p><button id="bk-save" data-t="bkSave"></button> <button id="bk-load" data-t="bkLoad"></button>
        <input id="bk-file" type="file" accept=".json,application/json" hidden></p>
      <progress id="bk-prog" max="1" value="0" hidden></progress>
    </div>
  </section>

  <section class="panel" id="p-settings" data-tab="settings" data-dev hidden>
    <div class="groups" id="setgroups"></div>
    <div class="group" style="margin-top:12px">
      <h2 data-t="system" data-ic="symbol_cog"></h2>
      <table id="sysinfo"></table>
    </div>
  </section>

  <footer>SLOOP, based on Felucca by Leo Kuroshita (@kurogedelic), <a href="https://hugelton.com" target="_blank" rel="noopener">Hügelton Instruments</a>. GPL-3.0.<br>
    <span data-t="foot"></span> M-VAVE and FM-1 are trademarks of their respective owners.<br>
    <a href="FUKIAI-LICENSE.txt" data-t="iconsCredit"></a></footer>
</main>
<script>
"use strict";
/*PROTO-BEGIN*/
/* ---------------------------------------------------------------- protocol --- */
const HDR = [0x7D, 0x46, 0x4C];
const CMD = { INFO: 1, GET: 2, SET: 3, DUMP: 4, DESC: 5, STEP_GET: 6, STEP_SET: 7, PRESET: 8, PROJECT: 9, NAMES: 10,
  SMP_BEGIN: 11, SMP_WRITE: 12, SMP_END: 13, SMP_ERASE: 14, SMP_INFO: 15,
  UP_LIST: 16, UP_GET: 17, UP_PUT: 18, UP_STORE: 19, UP_LOAD: 20, UP_ERASE: 21,
  WATCH: 22, CHANGED: 23, RELOAD: 24, PING: 25, STEP_CHANGED: 26,
  TRACK: 27, TRACK_MIX: 28, TRACK_DUMP: 29, TRACK_STEP: 30,
  TRACK_PARAM: 31, TRACK_CHANGED: 32,
  DRUM_STEP: 33,
  BK_LIST: 34, BK_GET: 35, BK_PUT: 36 };              /* v6: backup / restore */
/* frames the device sends on its own (while WATCH is on); never replies */
const PUSH = new Set([CMD.CHANGED, CMD.RELOAD, CMD.STEP_CHANGED, CMD.TRACK_CHANGED]);
/* user preset bank: name 1..12 printable ASCII, a 16-step pattern of (note, flags 1 acc 2 slide 4 tie) */
const UP = { NAME_MAX: 12, PAT: 16, LIST_MAX: 16 };
const F = { INT: 0, PCT: 1, BIPCT: 2, TIME: 3, LFOHZ: 4, CUTOFF: 5, DB: 6, SEMI: 7, ENUM: 8, BPM: 9, NOTE: 10, ONOFF: 11, OCT: 12, STEPS: 13,
  SWING: 14, FILT: 15 };
/* v5 (SLOOP 2.0): the drum track's 16 sounds (firmware drums.c LANE_NOTE / LANE_NAME), one per white key
   F3..G5; a hit has a level (NORM, GHOST, SOFT, HARD: OCT- / OCT+ held on the device) and a ratchet x1..x4 */
const DRUM_LANES = [[36, "KICK"], [35, "KICK 2"], [38, "SNARE"], [39, "CLAP"], [42, "HAT"], [46, "OPEN HAT"], [44, "PEDAL"], [37, "RIM"],
  [40, "SNARE 2"], [43, "LOW TOM"], [48, "HI TOM"], [49, "CRASH"], [51, "RIDE"], [70, "SHAKER"], [63, "CONGA"], [56, "COWBELL"]];
const LV_NAMES = ["NORM", "GHOST", "SOFT", "HARD"];
const LV_ORDER = [1, 2, 0, 3];                       /* by loudness: GHOST SOFT NORM HARD (as the device's LEVEL knob) */
/* an empty drum step: no lane on */
const emptyDrum = () => ({ on: 0, lvl: new Array(16).fill(0), rat: new Array(16).fill(0) });

const v14enc = (v) => { const u = Math.max(-8192, Math.min(8191, Math.round(v))) + 8192; return [u & 0x7F, (u >> 7) & 0x7F]; };
const v14dec = (lo, hi) => (lo | (hi << 7)) - 8192;
function strEnc(s) { const a = []; for (const c of String(s)) a.push(c.charCodeAt(0) & 0x7F); a.push(0); return a; }

/* only ever builds F0 7D 46 4C ... F7 */
function frame(cmd, args = []) {
  for (const b of args) if (!(Number.isInteger(b) && b >= 0 && b <= 0x7F)) throw new Error("bad data byte " + b);
  return [0xF0, ...HDR, cmd & 0x7F, ...args, 0xF7];
}
/* -> {cmd, a} or null when it is not an editor frame */
function unframe(d) {
  if (!d || d.length < 6 || d[0] !== 0xF0 || d[d.length - 1] !== 0xF7) return null;
  if (d[1] !== HDR[0] || d[2] !== HDR[1] || d[3] !== HDR[2]) return null;
  return { cmd: d[4], a: Array.from(d.slice(5, d.length - 1)) };
}

class Reader {
  constructor(a) { this.a = a; this.i = 0; }
  b() { if (this.i >= this.a.length) throw new Error("short reply"); return this.a[this.i++]; }
  v() { const lo = this.b(); return v14dec(lo, this.b()); }
  s() { let s = ""; for (;;) { const c = this.b(); if (!c) return s; s += String.fromCharCode(c); } }
}

/* v5 steps end with level / ratchet (2 bits per note, 7-bit bytes: lvl, hi (bit 0 lvl, bit 1 rat), rat) */
function stepExt(r, a, o) {
  if (r.i + 3 <= a.length) {
    const lo = r.b(), hi = r.b(), rt = r.b();
    o.lvl = lo | ((hi & 1) << 7);
    o.rat = rt | (((hi >> 1) & 1) << 7);
  }
  return o;
}

const parse = {
  [CMD.INFO](a) {
    const r = new Reader(a);
    const o = { version: r.s(), nengines: r.b(), pcount: r.b(), gcount: r.b(), nstep: r.b(), pe0: r.b(), engines: [] };
    for (let i = 0; i < o.nengines; i++) o.engines.push(r.s());
    o.ntrk = r.i < a.length ? r.b() : 0;             /* v3: tracks (0 = older firmware, one instrument) */
    o.proto = r.i < a.length ? r.b() : 0;            /* v5: the protocol version (0 = older firmware) */
    o.drum = r.i < a.length ? r.b() : o.ntrk ? o.ntrk - 1 : 0;   /* v7: the drum track (before: the last one) */
    return o;
  },
  [CMD.GET](a) { const r = new Reader(a); return { scope: r.b(), id: r.b(), value: r.v() }; },
  [CMD.SET](a) { return parse[CMD.GET](a); },
  /* needs the counts from INFO */
  [CMD.DUMP](a, info) {
    const r = new Reader(a);
    const o = { engine: r.b(), preset: r.b(), p: [], g: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < info.gcount; i++) o.g.push(r.v());
    return o;
  },
  [CMD.DESC](a) {
    const r = new Reader(a);
    const o = { scope: r.b(), id: r.b(), fmt: r.b(), min: r.v(), max: r.v(), def: r.v(), label: r.s(), unit: r.s(), names: [] };
    if (o.fmt === F.ENUM) for (let i = 0; i <= o.max - o.min && i < 64 && r.i < a.length; i++) o.names.push(r.s());
    return o;
  },
  [CMD.STEP_GET](a) {
    const r = new Reader(a);
    const o = { index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() };
    return stepExt(r, a, o);
  },
  [CMD.STEP_SET](a) { return parse[CMD.STEP_GET](a); },
  [CMD.PRESET](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b() }; },
  [CMD.PROJECT](a) { const r = new Reader(a); return { op: r.b(), slot: r.b(), used: r.b(), busy: a.length > 3 && a[3] === 1 }; },
  [CMD.NAMES](a) {
    const r = new Reader(a);
    const o = { engine: r.b(), names: [] };
    const n = r.b();
    for (let i = 0; i < n; i++) o.names.push(r.s());
    o.titles = [];
    try { o.titles.push(r.s(), r.s()); } catch (e) { o.titles = []; }   /* older firmware: no page titles */
    return o;
  },
  [CMD.SMP_BEGIN](a) { const r = new Reader(a); return { slot: r.b(), rc: r.b() }; },
  [CMD.SMP_WRITE](a) { const r = new Reader(a); return { slot: r.b(), offset: r.b() | (r.b() << 7) | (r.b() << 14), rc: r.b() }; },
  [CMD.SMP_END](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_INFO](a) {
    const r = new Reader(a);
    const o = { nslots: r.b(), slotKiB: r.b(), slots: [] };
    for (let i = 0; i < o.nslots; i++) o.slots.push({ zones: r.b(), name: r.s(), kib: r.b() });
    return o;
  },
  [CMD.UP_LIST](a) {
    const r = new Reader(a);
    const o = { start: r.b(), count: r.b(), total: r.b(), slots: [] };
    for (let i = 0; i < o.count; i++) o.slots.push({ slot: o.start + i, used: r.b(), engine: r.b(), name: r.s() });
    return o;
  },
  /* needs P_COUNT from INFO */
  [CMD.UP_GET](a, info) {
    const r = new Reader(a);
    const o = { slot: r.b(), used: r.b(), engine: r.b(), name: r.s(), p: [], pattern: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < UP.PAT; i++) o.pattern.push([r.b(), r.b()]);
    return o;
  },
  [CMD.UP_PUT](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_STORE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_LOAD](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.WATCH](a) { return { on: new Reader(a).b() }; },
  [CMD.CHANGED](a) { return parse[CMD.GET](a); },
  [CMD.RELOAD](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  [CMD.PING](a) { return {}; },
  [CMD.STEP_CHANGED](a) { const r = new Reader(a); return { index: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  /* v3: tracks. engine === NENGINES: the drum track */
  [CMD.TRACK](a) {
    const r = new Reader(a);
    const o = { sel: r.b(), ntrk: r.b(), tracks: [] };
    for (let i = 0; i < o.ntrk; i++) o.tracks.push({ engine: r.b(), preset: r.b(), level: r.v(), mute: r.b(), armed: r.b() });
    o.solo = r.i < a.length ? r.b() : 0;             /* v5: the tracks soloed (bit per track) */
    if (r.i < a.length) o.solo |= r.b() << 7;        /* v7: track 8 */
    return o;
  },
  [CMD.TRACK_MIX](a) { const r = new Reader(a); return { track: r.b(), level: r.v(), mute: r.b() }; },
  [CMD.TRACK_DUMP](a, info) {
    const r = new Reader(a);
    const o = { track: r.b(), engine: r.b(), preset: r.b(), p: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    return o;
  },
  [CMD.TRACK_STEP](a) {
    const r = new Reader(a);
    return stepExt(r, a, { track: r.b(), index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() });
  },
  /* v6: backup. LIST: rc, then per object id, length, CRC-32 (5 x 7 bit each) */
  [CMD.BK_LIST](a) {
    const r = new Reader(a), rc = r.b(), n = r.b(), items = [];
    for (let i = 0; i < n; i++) items.push({ id: r.b(), len: u35dec(r), crc: u35dec(r) >>> 0 });
    return { rc, items };
  },
  [CMD.BK_GET](a) {
    const r = new Reader(a), id = r.b(), rc = r.b(), off = u35dec(r), count = r.b() | (r.b() << 7);
    return { id, rc, off, count, data: unpack7(a.slice(r.i)) };
  },
  [CMD.BK_PUT](a) { const r = new Reader(a); return { op: r.b(), id: r.b(), rc: r.b() }; },
  /* v5: the drum track's step: the lanes on (16 bits), their levels and ratchets (2 bits each) */
  [CMD.DRUM_STEP](a) {
    const r = new Reader(a);
    const o = { index: r.b(), on: r.b() | (r.b() << 7) | ((r.b() & 3) << 14), lvl: [], rat: [] };
    let lv = 0, rt = 0;
    for (let k = 0; k < 5; k++) lv += r.b() * 2 ** (7 * k);
    for (let k = 0; k < 5; k++) rt += r.b() * 2 ** (7 * k);
    for (let l = 0; l < 16; l++) {
      const on = (o.on >> l) & 1;
      o.lvl.push(on ? Math.floor(lv / 4 ** l) % 4 : 0);
      o.rat.push(on ? Math.floor(rt / 4 ** l) % 4 : 0);
    }
    return o;
  },
  /* v4: a parameter of any track (the selection stays), and its push for a track that is not selected */
  [CMD.TRACK_PARAM](a) { const r = new Reader(a); return { track: r.b(), id: r.b(), value: r.v() }; },
  [CMD.TRACK_CHANGED](a) { return parse[CMD.TRACK_PARAM](a); },
};

/* a name the device accepts: printable ASCII, 1..12 characters */
function upName(s) { return String(s ?? "").replace(/[^\x20-\x7E]/g, "").trim().slice(0, UP.NAME_MAX) || "PATCH"; }

const req = {
  info: () => [CMD.INFO, []],
  get: (scope, id) => [CMD.GET, [scope, id]],
  set: (scope, id, v) => [CMD.SET, [scope, id, ...v14enc(v)]],
  dump: () => [CMD.DUMP, []],
  desc: (scope, id) => [CMD.DESC, [scope, id]],
  stepGet: (i) => [CMD.STEP_GET, [i]],
  stepSet: (i, st) => {
    const n = Math.max(0, Math.min(4, st.n | 0));
    const notes = [0, 1, 2, 3].map((k) => (st.notes[k] | 0) & 0x7F);
    const ext = st.lvl == null && st.rat == null ? []   /* v5: level / ratchet kept (older firmware ignores them) */
      : [(st.lvl | 0) & 0x7F, (((st.lvl | 0) >> 7) & 1) | ((((st.rat | 0) >> 7) & 1) << 1), (st.rat | 0) & 0x7F];
    return [CMD.STEP_SET, [i, n, ...notes, Math.max(0, Math.min(2, st.time | 0)), st.flags & 3, (st.vel | 0) & 0x7F, ...ext]];
  },
  /* v5: get (d == null) or set the drum track's step i: {on: 16 bits, lvl[16], rat[16]} */
  drumStep: (i, d) => {
    if (!d) return [CMD.DRUM_STEP, [i & 0x7F]];
    let lv = 0, rt = 0;
    for (let l = 0; l < 16; l++) if ((d.on >> l) & 1) { lv += ((d.lvl[l] | 0) & 3) * 4 ** l; rt += ((d.rat[l] | 0) & 3) * 4 ** l; }
    const g7 = (x, n) => Array.from({ length: n }, (_, k) => Math.floor(x / 2 ** (7 * k)) & 0x7F);
    return [CMD.DRUM_STEP, [i & 0x7F, ...g7(d.on & 0xFFFF, 3), ...g7(lv, 5), ...g7(rt, 5)]];
  },
  preset: (e, p) => [CMD.PRESET, [e & 0x7F, p & 0x7F]],
  project: (op, slot) => { if (![0, 1, 2].includes(op)) throw new Error("bad PROJECT op"); return [CMD.PROJECT, [op, slot & 3]]; },   /* 0 load, 1 save, 2 query */
  names: (e) => [CMD.NAMES, [e & 0x7F]],
  smpBegin: (s) => [CMD.SMP_BEGIN, [s & 0x7F]],
  smpWrite: (s, off, bytes) => [CMD.SMP_WRITE, [s & 0x7F, off & 0x7F, (off >> 7) & 0x7F, (off >> 14) & 0x7F, ...pack7(bytes)]],
  smpEnd: (s, hdr) => [CMD.SMP_END, [s & 0x7F, ...pack7(hdr)]],
  smpErase: (s) => [CMD.SMP_ERASE, [s & 0x7F]],
  smpInfo: () => [CMD.SMP_INFO, []],
  upList: (start, count) => [CMD.UP_LIST, [start & 0x7F, Math.max(1, Math.min(UP.LIST_MAX, count | 0))]],
  upGet: (s) => [CMD.UP_GET, [s & 0x7F]],
  /* patch: {engine, name, p: P_COUNT values, pattern: 16 x [note, flags]} */
  upPut: (s, pt) => [CMD.UP_PUT, [s & 0x7F, pt.engine & 0x7F, ...strEnc(upName(pt.name)), ...pt.p.flatMap((v) => v14enc(v ?? 0)),
    ...Array.from({ length: UP.PAT }, (_, i) => { const x = (pt.pattern || [])[i] || [0, 0]; return [x[0] & 0x7F, x[1] & 7]; }).flat()]],
  upStore: (s, name) => [CMD.UP_STORE, [s & 0x7F, ...strEnc(name ? upName(name) : "")]],   /* "": the device names it ("ANALOG 07") */
  upLoad: (s) => [CMD.UP_LOAD, [s & 0x7F]],
  upErase: (s) => [CMD.UP_ERASE, [s & 0x7F]],
  /* on: 1 = pushes; 3 = also TRACK_CHANGED (v4 firmware answers 3, older firmware 1) */
  watch: (on) => [CMD.WATCH, [on === 3 ? 3 : on ? 1 : 0]],
  ping: () => [CMD.PING, []],
  /* v3: tracks 0..3 (3 = drums) */
  track: (sel) => [CMD.TRACK, sel == null ? [] : [sel & 0x7F]],
  trackMix: (tr, level, mute) => [CMD.TRACK_MIX, level == null ? [tr & 0x7F] : [tr & 0x7F, ...v14enc(level), mute ? 1 : 0]],
  trackDump: (tr) => [CMD.TRACK_DUMP, [tr & 0x7F]],
  trackStep: (tr, i, st) => [CMD.TRACK_STEP, st ? [tr & 0x7F, ...req.stepSet(i, st)[1]] : [tr & 0x7F, i & 0x7F]],
  /* v4: get (v == null) or set parameter id (P_*) of track tr, clamped as SET */
  trackParam: (tr, id, v) => [CMD.TRACK_PARAM, v == null ? [tr & 0x7F, id & 0x7F] : [tr & 0x7F, id & 0x7F, ...v14enc(v)]],
  /* v6: backup / restore */
  bkList: () => [CMD.BK_LIST, []],
  bkGet: (id, off, n) => [CMD.BK_GET, [id & 0x7F, ...u35enc(off), n & 0x7F, (n >> 7) & 0x7F]],
  bkBegin: (id, len, crc) => [CMD.BK_PUT, [0, id & 0x7F, ...u35enc(len), ...u35enc(crc)]],
  bkData: (id, off, bytes) => [CMD.BK_PUT, [1, id & 0x7F, ...u35enc(off), ...pack7(bytes)]],
  bkCommit: (id) => [CMD.BK_PUT, [2, id & 0x7F]],
  bkAbort: (id) => [CMD.BK_PUT, [3, id & 0x7F]],
};

/* which reply belongs to which request (the device echoes these) */
function replyMatches(cmd, args, a) {
  switch (cmd) {
    case CMD.GET: case CMD.SET: case CMD.DESC: return a[0] === args[0] && a[1] === args[1];
    case CMD.STEP_GET: case CMD.STEP_SET: case CMD.NAMES:
    case CMD.SMP_BEGIN: case CMD.SMP_END: case CMD.SMP_ERASE: return a[0] === args[0];
    case CMD.SMP_WRITE: return a[0] === args[0] && a[1] === args[1] && a[2] === args[2] && a[3] === args[3];
    case CMD.PROJECT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UP_LIST: case CMD.UP_GET: case CMD.UP_PUT: case CMD.UP_STORE: case CMD.UP_LOAD: case CMD.UP_ERASE:
    case CMD.TRACK_MIX: case CMD.TRACK_DUMP: case CMD.DRUM_STEP: return a[0] === args[0];
    case CMD.WATCH: return (a[0] & 1) === (args[0] & 1);   /* bit 1: v4 firmware only */
    case CMD.TRACK_STEP: case CMD.TRACK_PARAM: return a[0] === args[0] && a[1] === args[1];
    case CMD.BK_GET: return a[0] === args[0] && [0, 1, 2, 3, 4].every((k) => a[2 + k] === args[1 + k]);
    case CMD.BK_PUT: return a[0] === args[0] && a[1] === args[1];
    default: return true;
  }
}

/* strict request/response: one frame in flight, the rest queued. Push frames (CHANGED, RELOAD,
   STEP_CHANGED) can come at any time, also between a request and its reply: they go to onPush. */
class Link {
  constructor(send, opts = {}) {
    this.sendRaw = send;
    this.q = [];
    this.cur = null;
    this.closed = false;
    this.lastSent = 0;                              /* Date.now() of the last frame sent (WATCH keep-alive) */
    this.timeout = opts.timeout || 300;
    this.onUnknown = opts.onUnknown || (() => {});
    this.onTimeout = opts.onTimeout || (() => {});
    this.onPush = opts.onPush || (() => {});
    this.onGap = opts.onGap || (() => {});         /* (ms) nothing was sent for that long (WATCH may have ended) */
  }
  get idle() { return !this.cur && !this.q.length; }
  hasQueued(key) { return this.q.some((r) => r.key === key); }
  /* r = [cmd, args]; opt: {timeout, retries, key (coalesce queued requests: the latest args win), front,
     quiet (a timeout is expected: no onTimeout)} */
  request(r, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    const [cmd, args] = r;
    if (opt.key) {
      const old = this.q.find((x) => x.key === opt.key);
      if (old) { old.cmd = cmd; old.args = args; return old.promise; }
    }
    let res, rej;
    const promise = new Promise((a, b) => { res = a; rej = b; });
    const item = { cmd, args, key: opt.key, res, rej, promise, quiet: !!opt.quiet,
      timeout: opt.timeout || this.timeout, retries: opt.retries ?? 1 };
    if (opt.front) this.q.unshift(item); else this.q.push(item);
    this.pump();
    return promise;
  }
  pump() {
    if (this.cur || this.closed || !this.q.length) return;
    this.cur = this.q.shift();
    this.fire();
  }
  fire() {
    const c = this.cur;
    const now = Date.now();
    if (this.lastSent && now - this.lastSent > 2500) this.onGap(now - this.lastSent);
    this.lastSent = now;
    try { this.sendRaw(frame(c.cmd, c.args)); } catch (e) { this.finish(null, e); return; }
    c.timer = setTimeout(() => {
      if (this.cur !== c) return;
      if (c.retries-- > 0) { this.fire(); return; }
      if (!c.quiet) this.onTimeout(c.cmd);
      this.finish(null, new Error("timeout (cmd " + c.cmd + ")"));
    }, c.timeout);
  }
  finish(val, err) {
    const c = this.cur;
    if (!c) return;
    clearTimeout(c.timer);
    this.cur = null;
    if (err) c.rej(err); else c.res(val);
    this.pump();
  }
  /* raw incoming MIDI bytes */
  receive(data) {
    const f = unframe(data);
    if (!f) return;                                  /* not ours (notes, clock, other SysEx) */
    if (PUSH.has(f.cmd)) { this.onPush(f); return; }
    const c = this.cur;
    if (!c || f.cmd !== c.cmd || !replyMatches(c.cmd, c.args, f.a)) { this.onUnknown(f); return; }
    this.finish(f.a);
  }
  close() {
    this.closed = true;
    const all = (this.cur ? [this.cur] : []).concat(this.q);
    if (this.cur) clearTimeout(this.cur.timer);
    this.cur = null;
    this.q = [];
    for (const r of all) r.rej(new Error("closed"));
  }
}

/* ------------------------------------------------------------- formatting --- */
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = (n) => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);   /* 60 = C4 */
/* GM drum notes (35..81) by short names, for the drum track's steps */
const GM_DRUM = { 35: "KICK2", 36: "KICK", 37: "RIM", 38: "SNARE", 39: "CLAP", 40: "SNARE2", 41: "LTOM2", 42: "CHH", 43: "LTOM",
  44: "PHH", 45: "MTOM2", 46: "OHH", 47: "MTOM", 48: "HTOM2", 49: "CRASH", 50: "HTOM", 51: "RIDE", 52: "CHINA", 53: "BELL",
  54: "TAMB", 55: "SPLASH", 56: "COWBELL", 57: "CRASH2", 58: "VIBRA", 59: "RIDE2", 60: "HBONGO", 61: "LBONGO", 62: "MCONGA",
  63: "HCONGA", 64: "LCONGA", 65: "HTIMB", 66: "LTIMB", 67: "HAGOGO", 68: "LAGOGO", 69: "CABASA", 70: "MARACA", 71: "SWHIS",
  72: "LWHIS", 73: "SGUIRO", 74: "LGUIRO", 75: "CLAVES", 76: "HWOOD", 77: "LWOOD", 78: "MCUICA", 79: "OCUICA", 80: "MTRI", 81: "OTRI" };
const GM_DRUM_BY_NAME = Object.fromEntries(Object.entries(GM_DRUM).map(([n, s]) => [s, +n]));
const drumName = (n) => GM_DRUM[n] || String(n);
/* a note token: a number, a note name (C4, F#3, Bb2) or a GM drum name (KICK, CHH) */
function parseNote(tok) {
  const dn = GM_DRUM_BY_NAME[tok.toUpperCase()];
  if (dn != null) return dn;
  if (/^\d+$/.test(tok)) { const n = +tok; return n <= 127 ? n : null; }
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(tok);
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1].toUpperCase()];
  const n = base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return n >= 0 && n <= 127 ? n : null;
}
/* "C4 E4 G4" -> [60, 64, 67]; null on a bad token or more than 4 notes */
function parseNotes(s) {
  const t = s.trim().split(/[\s,]+/).filter(Boolean);
  if (t.length > 4) return null;
  const out = t.map(parseNote);
  return out.includes(null) ? null : out;
}

/* close to the device's param_format (params.c), tables from tools/gen_tables.py */
function fmtValue(d, v) {
  const sign = (x) => (x > 0 ? "+" + x : String(x));
  switch (d.fmt) {
    case F.PCT: return [String(d.max > 0 ? Math.trunc((v * 100 + Math.trunc(d.max / 2)) / d.max) : v), "%"];
    case F.SWING: return [String(50 + Math.trunc((Math.max(0, Math.min(100, v)) + 2) / 4)), "%"];   /* MPC: 50 % straight .. 75 % */
    case F.FILT: return !v ? ["OFF", ""] : v < 0 ? ["LP" + Math.trunc((-v * 100 + 32) / 64), "%"] : ["HP" + Math.trunc((v * 100 + 31) / 63), "%"];
    case F.BIPCT: return [sign(Math.trunc(v * 100 / 64)), "%"];
    case F.TIME: {
      const ms10 = Math.round(10 * Math.pow(10000, (v & 127) / 127));
      if (ms10 < 100) return [(ms10 / 10).toFixed(1), "ms"];
      if (ms10 < 10000) return [String(Math.round(ms10 / 10)), "ms"];

    case F.LFOHZ: { const h = 0.05 * Math.pow(800, (v & 127) / 127); return [h < 10 ? h.toFixed(2) : h.toFixed(1), "Hz"]; }
    case F.CUTOFF: { const h = 30 * Math.pow(16000 / 30, (v & 127) / 127); return h < 1000 ? [String(Math.round(h)), "Hz"] : [(h / 1000).toFixed(1), "kHz"]; }
    case F.DB: return v <= 0 ? ["OFF", ""] : [((v - 112) / 2).toFixed(1), "dB"];
    case F.SEMI: return [sign(v), "st"];
    case F.ENUM: return [d.names[v - d.min] ?? String(v), d.unit || ""];
    case F.BPM: return [String(v), "BPM"];
    case F.NOTE: return [NOTE_NAMES[((v % 12) + 12) % 12], ""];
    case F.ONOFF: return [v ? "ON" : "OFF", ""];
    case F.STEPS: return [String(v), "STEP"];

}

/* ---------------------------------------------------------- user samples --- */
/* A port of tools/sampleio.py (read_any_wav, resample, to_int16, ima_encode, user_slot),
   byte for byte: web/test_web.mjs compares them. */
const SMP = { SLOT_SIZE: 0x14000, DATA_OFF: 512, RATE: 22050, HDR_LEN: 32 + 16 * 28, MAX_ZONES: 16 };
SMP.MAX_DATA = SMP.SLOT_SIZE - SMP.DATA_OFF;

/* groups of up to 7 bytes, each preceded by their top bits */
function pack7(b) {
  const out = [];
  for (let i = 0; i < b.length; i += 7) {
    const g = Array.from(b.slice(i, i + 7));
    out.push(g.reduce((m, x, j) => m | (((x >> 7) & 1) << j), 0));
    for (const x of g) out.push(x & 0x7F);
  }
  return out;
}

  const out = [];
  for (let i = 0; i < a.length; i += 8) {
    const top = a[i];
    for (let j = 0; j < 7 && i + 1 + j < a.length; j++) out.push(a[i + 1 + j] | (((top >> j) & 1) << 7));
  }
  return Uint8Array.from(out);
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();

const IMA_STEP = [7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88,
  97, 107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658,
  724, 796, 876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660,
  4026, 4428, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818,
  18500, 20350, 22385, 24623, 27086, 29794, 32767];
const IMA_IDX = [-1, -1, -1, -1, 2, 4, 6, 8];
/* IMA ADPCM, 4 bit, low nibble first, from predictor 0 / index 0 -> {data, pred, idx} (state at loopStart) */
function imaEncode(s, loopStart = 0) {
  let pred = 0, idx = 0, atLoop = [0, 0];
  const nib = new Uint8Array(s.length + (s.length & 1));
  for (let n = 0; n < s.length; n++) {
    if (n === loopStart) atLoop = [pred, idx];
    const step = IMA_STEP[idx];
    let diff = s[n] - pred, code = 0;
    if (diff < 0) { code = 8; diff = -diff; }
    let vd = step >> 3;
    if (diff >= step) { code |= 4; diff -= step; vd += step; }
    if (diff >= step >> 1) { code |= 2; diff -= step >> 1; vd += step >> 1; }
    if (diff >= step >> 2) { code |= 1; vd += step >> 2; }
    pred = Math.max(-32768, Math.min(32767, code & 8 ? pred - vd : pred + vd));
    idx = Math.max(0, Math.min(88, idx + IMA_IDX[code & 7]));
    nib[n] = code;
  }
  const out = new Uint8Array(nib.length >> 1);
  for (let k = 0; k < nib.length; k += 2) out[k >> 1] = nib[k] | (nib[k + 1] << 4);
  return { data: out, pred: atLoop[0], idx: atLoop[1] };
}

/* WAV: PCM 8/16/24/32 or float, any channel count, mixed to mono -> {sr, x} (gen_samples.read_any_wav) */
function parseWav(buf) {
  const d = new Uint8Array(buf), v = new DataView(d.buffer, d.byteOffset, d.byteLength);
  const id = (i) => String.fromCharCode(d[i], d[i + 1], d[i + 2], d[i + 3]);
  if (d.length < 12 || id(0) !== "RIFF" || id(8) !== "WAVE") throw new Error("not a WAV file");
  let i = 12, fmt = null, data = null;
  while (i + 8 <= d.length) {
    const cid = id(i), n = v.getUint32(i + 4, true);
    if (cid === "fmt ") {
      let tag = v.getUint16(i + 8, true);
      const ch = v.getUint16(i + 10, true), sr = v.getUint32(i + 12, true), bits = v.getUint16(i + 22, true);
      if (tag === 0xFFFE) tag = v.getUint16(i + 32, true);
      fmt = { tag, ch, sr, bits };
    } else if (cid === "data") {
      data = [i + 8, Math.min(d.length, i + 8 + n)];
      break;
    }
    i += 8 + n + (n & 1);
  }
  if (!fmt || !data) throw new Error("WAV without fmt/data");
  const { tag, ch, sr, bits } = fmt, bps = bits >> 3, frame = bps * ch;
  if (!(tag === 1 || tag === 3) || !bps || !ch) throw new Error("unsupported WAV format");
  const nfr = Math.floor((data[1] - data[0]) / frame), x = new Float64Array(nfr);
  for (let f = 0; f < nfr; f++) {
    let acc = 0;
    for (let c = 0; c < ch; c++) {
      const o = data[0] + f * frame + c * bps;
      let s;
      if (tag === 3) s = bps === 4 ? v.getFloat32(o, true) : v.getFloat64(o, true);
      else if (bps === 2) s = v.getInt16(o, true) / 32768;
      else if (bps === 3) s = (((d[o] | (d[o + 1] << 8) | (d[o + 2] << 16)) << 8) >> 8) / 8388608;
      else if (bps === 4) s = v.getInt32(o, true) / 2147483648;
      else s = (d[o] - 128) / 128;
      acc += s;
    }
    x[f] = acc / ch;
  }
  return { sr, x };
}

/* gen_samples.resample: moving average over the ratio, then linear interpolation */
function resample(x, sr, to) {
  if (sr === to) return Array.from(x);
  if (sr > to) {
    const k = Math.max(1, pyRound(sr / to));
    if (k > 1) {
      const y = new Array(x.length);
      for (let i = 0; i < x.length; i++) { let s = 0; for (let j = i; j < Math.min(x.length, i + k); j++) s += x[j]; y[i] = s / k; }
      x = y;
    }

  let p = 0;
  while (p < x.length - 1) { const i = Math.floor(p), f = p - i; out.push(x[i] * (1 - f) + x[i + 1] * f); p += step; }
  return out;
}

/* mono float -> int16, peak normalised to 30000 */
function normalize(x) {
  let pk = 1e-9;
  for (const v of x) pk = Math.max(pk, Math.abs(v));
  return Int16Array.from(x, (v) => Math.max(-32768, Math.min(32767, Math.trunc(v / pk * 30000))));
}

/* root from a file name like "piano_C4" or "F#3" (C4 = 60), else 60 (sampleio.note_from_name) */
function rootFromName(name) {
  const m = /(?<![A-Za-z])([A-G])([#b]?)(-?\d)(?!\d)/.exec(name);
  if (!m) return 60;
  const n = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return Math.max(0, Math.min(127, n));
}

/* zones: [{s: Int16Array (22050 Hz), root, lo?, hi?}] -> {hdr (480 B), data, zones} (sampleio.user_slot) */
function buildSlot(name, zonesIn) {
  const zones = [], parts = [];
  let len = 0;
  for (const z of zonesIn) {
    const e = imaEncode(z.s, 0);
    zones.push({ off: len, n: z.s.length, ls: 0, le: z.s.length - 1, root: z.root, lo: z.lo ?? null, hi: z.hi ?? null, pred: e.pred, idx: e.idx });
    parts.push(e.data);
    len += e.data.length;
  }
  const data = new Uint8Array(len);
  let o = 0;
  for (const p of parts) { data.set(p, o); o += p.length; }
  if (len > SMP.MAX_DATA) throw new Error(`too long: ${len} B (max ${SMP.MAX_DATA} B)`);
  if (!zones.length || zones.length > SMP.MAX_ZONES) throw new Error("1..16 files per slot");
  zones.sort((a, b) => a.root - b.root);
  zones.forEach((z, j) => {
    if (z.lo == null) {
      z.lo = j === 0 ? 0 : Math.floor((zones[j - 1].root + z.root) / 2) + 1;
      z.hi = j === zones.length - 1 ? 127 : Math.floor((z.root + zones[j + 1].root) / 2);
    }

  const hdr = new Uint8Array(SMP.HDR_LEN), v = new DataView(hdr.buffer);
  v.setUint32(0, 0x504D5346, true);
  v.setUint16(4, 1, true);

  for (let i = 0; i < nm.length; i++) hdr[8 + i] = nm.charCodeAt(i);
  v.setUint32(16, len, true);
  v.setUint32(20, crc32(data), true);
  const rate = pyRound(SMP.RATE / 44100 * 65536);
  zones.forEach((z, j) => {
    const b = 32 + j * 28;
    [z.off, z.n, z.ls, z.le, rate].forEach((x, k) => v.setUint32(b + k * 4, x >>> 0, true));
    v.setInt16(b + 20, z.root * 16, true);
    v.setInt16(b + 22, z.pred, true);
    hdr[b + 24] = z.idx; hdr[b + 25] = z.lo; hdr[b + 26] = z.hi; hdr[b + 27] = 0;

}

/* ------------------------------------------------------------------- chop --- */
/* Chopping a recording into a slot (the CHOP block of the samples tab). All at SMP.RATE, positions
   in samples. These are pure: test_web.mjs runs them. */
const CHOP = { HOP: 128, MAX: 16, FADE_IN: 22, FADE_OUT: 132, PRE: 32 };   /* 5.8 ms frames; fades 1 / 6 ms; start 1.5 ms early */

/* onset novelty per frame: the rise of the log energy of the signal's first difference (the attack
   of a hit, not its body), over the louder of the two frames before */
function chopNovelty(x) {
  const H = CHOP.HOP, F = Math.ceil(x.length / H), L = new Float64Array(F), P = new Float64Array(F), nov = new Float64Array(F);
  let top = 1e-12, ptop = 1e-12;
  for (let f = 0; f < F; f++) {
    let e = 0, p = 0;
    for (let i = f * H, n = Math.min(x.length, i + H); i < n; i++) { const d = x[i] - (i ? x[i - 1] : 0); e += d * d; p += x[i] * x[i]; }
    L[f] = e;
    P[f] = p;
    if (e > top) top = e;
    if (p > ptop) ptop = p;
  }
  for (let f = 0; f < F; f++) { L[f] = Math.log10(L[f] / top + 1e-9); P[f] = Math.log10(P[f] / ptop + 1e-9); }   /* 0 = the loudest */
  for (let f = 0; f < F; f++) {
    const before = Math.max(f ? L[f - 1] : -9, f > 1 ? L[f - 2] : -9);
    nov[f] = L[f] > -3.5 ? Math.max(0, L[f] - before) : 0;              /* (under -35 dB: no hit) */
  }
  nov.level = P;                                                         /* (log10 power, 0 = the loudest frame) */
  return nov;
}

/* the first sample of the hit in frame f: where the signal first reaches 30 % of its peak over the
   frames f-1..f+2, then PRE samples earlier (the attack is kept whole) */
function chopAttack(x, f) {
  const H = CHOP.HOP, a = Math.max(0, (f - 1) * H), b = Math.min(x.length, (f + 3) * H);
  let pk = 0;
  for (let i = a; i < b; i++) pk = Math.max(pk, Math.abs(x[i]));
  for (let i = a; i < b; i++) if (Math.abs(x[i]) >= 0.3 * pk) return Math.max(0, i - CHOP.PRE);
  return a;
}

/* hits: sens 1 (only the hardest and loudest) .. 10 (every small one); at least 60 ms apart. A hit is a
   sharp rise (nov over thr) to a level (its loudest frame within 3) over the gate */
function chopHits(x, nov, sens) {
  const k = Math.max(1, Math.min(10, sens)), thr = 0.15 + (10 - k) * 0.08, gate = -(0.5 + k * 0.35);
  const gap = Math.round(0.06 * SMP.RATE / CHOP.HOP), L = nov.level;
  const out = [];
  let last = -1e9;
  for (let f = 0; f < nov.length - 1; f++) {        /* (a hit on the very first frame counts too) */
    if (nov[f] < thr || (f && nov[f] < nov[f - 1]) || nov[f] < nov[f + 1]) continue;
    if (L && Math.max(L[f], L[Math.min(L.length - 1, f + 1)], L[Math.min(L.length - 1, f + 2)]) < gate) continue;
    if (f - last < gap) {
      if (out.length && nov[f] > nov[last]) { out[out.length - 1] = chopAttack(x, f); last = f; }
      continue;
    }
    out.push(chopAttack(x, f));
    last = f;
  }
  return out;
}

/* a tap at pos (as heard) moved to the hit it meant: the strongest attack within +-win s, if any */
function chopSnap(x, nov, pos, win = 0.05) {
  const H = CHOP.HOP, w = Math.round(win * SMP.RATE / H), c = Math.round(pos / H);
  let best = -1, bv = 0.12;
  for (let f = Math.max(1, c - w); f <= Math.min(nov.length - 1, c + w); f++) if (nov[f] > bv) { bv = nov[f]; best = f; }
  return best < 0 ? Math.max(0, Math.min(x.length - 1, Math.round(pos))) : chopAttack(x, best);

/* markers every `beats` beats at bpm from start to end */
function chopGrid(start, end, bpm, beats) {
  const step = SMP.RATE * 60 / bpm * beats, out = [];
  for (let p = start; p < end - step * 0.25 && out.length < 64; p += step) out.push(Math.round(p));
  return out;
}

/* n equal parts of start..end */
function chopEqual(start, end, n) {
  return Array.from({ length: n }, (_, i) => Math.round(start + (end - start) * i / n));
}

/* the chops of sorted markers: each to the next marker (the last to the end), cut at maxLen samples
   when maxLen > 0 -> [{start, end, i, off, full}] (all of them; the slot takes CHOP.MAX).
   opt[i] (optional) = {off: left out of the slot, len: its own length in samples, over maxLen};
   a chop is never longer than up to the next marker (`full`) */

  return marks.map((m, i) => {
    const full = Math.max(m + 1, i + 1 < marks.length ? marks[i + 1] : total), o = (opt && opt[i]) || {};
    let e = full;

    return { start: m, end: Math.max(m + 1, e), i, off: !!o.off, full };

/* the chops the slot gets: mode 0 the kept ones, the first CHOP.MAX of them; mode 1 the chop `sel` */
function chopPick(chops, mode = 0, sel = 0) {
  if (mode === 1) return chops.length ? [chops[Math.max(0, Math.min(chops.length - 1, sel))]] : [];
  return chops.filter((c) => !c.off).slice(0, CHOP.MAX);

/* the longest common length L (samples) so the chops, each cut at L, fit in room; Infinity if they fit */
function chopFit(chops, room) {
  const len = chops.map((c) => c.end - c.start), sum = (L) => len.reduce((a, n) => a + Math.min(n, L), 0);
  if (sum(Infinity) <= room) return Infinity;
  let lo = 0, hi = Math.max(...len);
  while (lo < hi) { const L = (lo + hi + 1) >> 1; if (sum(L) <= room) lo = L; else hi = L - 1; }
  return lo;

   on key0. The file names keep the chop's own number. */

  const use = chopPick(chops, mode, sel);
  let pk = 1e-9;
  for (const c of use) for (let i = c.start; i < c.end; i++) pk = Math.max(pk, Math.abs(x[i]));

    const n = c.end - c.start, s = new Int16Array(n), fi = Math.min(CHOP.FADE_IN, n >> 2), fo = Math.min(CHOP.FADE_OUT, n >> 2);

      s[i] = Math.max(-32768, Math.min(32767, Math.trunc(x[c.start + i] / pk * 30000 * g)));

    return { s, root: key, lo: mode === 1 ? 0 : key, hi: mode === 1 ? 127 : key,
      fname: `CHOP${String((c.i != null ? c.i : mode === 1 ? sel : j) + 1).padStart(2, "0")}_${NOTE_NAMES[key % 12]}${Math.floor(key / 12) - 1}.wav` };
  });

/* a mono 16-bit WAV at SMP.RATE */
function wavFile(s) {
  const b = new Uint8Array(44 + s.length * 2), v = new DataView(b.buffer);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
  str(0, "RIFF"); v.setUint32(4, 36 + s.length * 2, true); str(8, "WAVEfmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, SMP.RATE, true); v.setUint32(28, SMP.RATE * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, s.length * 2, true);
  for (let i = 0; i < s.length; i++) v.setInt16(44 + i * 2, s[i], true);

    v.setUint32(18, f.data.length, true); v.setUint32(22, f.data.length, true); v.setUint16(26, nm.length, true); h.set(nm, 30);
    const c = new Uint8Array(46 + nm.length), w = new DataView(c.buffer);
    w.setUint32(0, 0x02014B50, true); w.setUint16(4, 20, true); w.setUint16(6, 20, true); w.setUint32(16, crc, true);
    w.setUint32(20, f.data.length, true); w.setUint32(24, f.data.length, true); w.setUint16(28, nm.length, true);

/* -------------------------------------------------------------- librarian --- */
/* A patch (library entry, user preset):
     {name, engine (index), engineName, p: [P_COUNT values by parameter id, null = unknown],
      pattern: 16 x [note 0..127 (0 rest), flags 1 accent | 2 slide | 4 tie] or null, tags: [], created, modified}

   Library / bank / single-patch file (JSON):
     {
       "format": "felucca-library", "version": 1,
       "kind": "library" | "bank" | "patch",
       "firmware": "FELUCCA 0.5 ...",          device version string when exported ("" if unknown)
       "pCount": 57, "pE0": 49,                 P_COUNT and the first engine parameter id
       "paramLabels": ["LVL", "ATK", ...],      one key per parameter id: the DESC label, "#2", "#3" appended to
                                                a repeated label (PIT, PIT#2), and "E0".."E7" for the engine
                                                parameters (their labels depend on the engine)
       "engines": ["ANALOG", ...],              engine names by index
       "exported": "2026-10-03T12:00:00.000Z",
       "patches": [{ "name", "engine", "engineName", "params": [pCount numbers or null],
                     "pattern": [[note, flags] x 16] or null, "tags": [...], "created", "modified",
                     "slot": n (bank files only, 0-based) }]
     }
   Reading maps every parameter by its key, so a firmware with other ids (or more parameters) still gets
   the right values; parameters the file does not have are null (left at the engine default). Engines are
   matched by name. The old single-sound file ("felucca-patch" version 1, "Save to file") is read too. */
const LIB = { FORMAT: "felucca-library", VERSION: 1 };

/* parameter keys by id from the instrument DESCs */
function paramKeys(pdesc, pe0, pcount) {
  const seen = {}, out = [];
  for (let i = 0; i < pcount; i++) {
    if (i >= pe0) { out.push("E" + (i - pe0)); continue; }
    const l = (pdesc[i] && pdesc[i].label) || "P" + i;
    seen[l] = (seen[l] || 0) + 1;
    out.push(seen[l] > 1 ? `${l}#${seen[l]}` : l);
  }
  return out;
}
const sameKeys = (a, b) => !!a && !!b && a.length === b.length && a.every((k, i) => k === b[i]);
/* values by fromKeys -> values by toKeys (null where the source has no such key) */
function remapParams(p, fromKeys, toKeys) {
  if (!fromKeys || !toKeys || sameKeys(fromKeys, toKeys)) return p.slice();
  const at = new Map(fromKeys.map((k, i) => [k, i]));
  return toKeys.map((k) => (at.has(k) ? p[at.get(k)] ?? null : null));
}

/* one pattern step as the firmware keeps it (up_pat_norm): a tie has no note, a rest no flags */
const patNorm = (n, f) => (f & 4 ? [0, 4] : [n & 0x7F, n ? f & 3 : 0]);
/* sequencer steps (STEP_GET objects) -> 16-step pattern, as the firmware's UP_STORE does (up_pat_from):
   the first note of a NOTE step, flag 4 for a TIE step */
function patternFromSteps(steps) {
  return Array.from({ length: UP.PAT }, (_, i) => {
    const s = steps[i];
    if (!s) return [0, 0];
    return patNorm(s.time === 0 && s.n ? s.notes[0] : 0, s.time === 1 ? 4 : s.flags);
  });
}
/* pattern -> 16 STEP_SET objects, as the firmware loads one (load_pat16; velocity 96) */
function stepsFromPattern(pat) {
  return Array.from({ length: UP.PAT }, (_, i) => {
    const [n, f] = (pat && pat[i]) || [0, 0];
    return { n: n ? 1 : 0, notes: [n & 0x7F, 0, 0, 0], time: f & 4 ? 1 : n ? 0 : 2, flags: n ? f & 3 : 0, vel: n ? 96 : 0 };
  });
}
const patternUsed = (pat) => !!pat && pat.some((x) => x && x[0]);

function cleanPatch(pt) {
  const now = new Date().toISOString();
  const pat = Array.isArray(pt.pattern) && pt.pattern.length
    ? Array.from({ length: UP.PAT }, (_, i) => { const x = pt.pattern[i]; return Array.isArray(x) ? patNorm(x[0] | 0, x[1] | 0) : [0, 0]; })
    : null;
  const o = {
    name: String(pt.name ?? "PATCH").slice(0, 32) || "PATCH",
    engine: pt.engine | 0, engineName: String(pt.engineName ?? ""),
    p: Array.from(pt.p || pt.params || [], (v) => (Number.isFinite(v) ? Math.round(v) : null)),
    pattern: patternUsed(pat) ? pat : null,
    tags: Array.isArray(pt.tags) ? [...new Set(pt.tags.map((x) => String(x).trim()).filter(Boolean))] : [],
    created: pt.created || now, modified: pt.modified || pt.created || now,
  };
  if (Number.isInteger(pt.slot)) o.slot = pt.slot;
  return o;
}

/* ctx: {keys, engines, firmware, pe0} of the library (the device's when connected) */
function libraryFile(kind, patches, ctx) {
  return {
    format: LIB.FORMAT, version: LIB.VERSION, kind, firmware: ctx.firmware || "",
    pCount: ctx.keys ? ctx.keys.length : 0, pE0: ctx.pe0 ?? null, paramLabels: ctx.keys || [], engines: ctx.engines || [],
    exported: new Date().toISOString(),
    patches: patches.map((x) => {
      const c = cleanPatch(x);
      const o = { name: c.name, engine: c.engine, engineName: c.engineName || (ctx.engines || [])[c.engine] || "",
        params: c.p, pattern: c.pattern, tags: c.tags, created: c.created, modified: c.modified };
      if (Number.isInteger(x.slot)) o.slot = x.slot;
      return o;
    }),
  };
}
/* -> {patches, skipped, keys (the file's, for a library that has none yet)}; throws on a file it cannot read */
function readLibraryFile(obj, ctx) {
  if (!obj || typeof obj !== "object") throw new Error("not JSON");
  const engIndex = (name, idx, fileEngines) => {
    const nm = name || (fileEngines || [])[idx];
    if (ctx.engines && ctx.engines.length) {
      if (nm) return ctx.engines.indexOf(nm);
      return idx < ctx.engines.length ? idx : -1;
    }
    return idx;
  };
  if (obj.format === "felucca-patch") {               /* "Save to file": the whole current sound */
    if (!Array.isArray(obj.p) || !Number.isInteger(obj.engine)) throw new Error("felucca-patch without engine / p");
    const e = engIndex(obj.engineName, obj.engine);
    if (e < 0) return { patches: [], skipped: 1, keys: null };
    return { patches: [cleanPatch({ name: obj.presetName || obj.engineName || "PATCH", engine: e, engineName: obj.engineName,
      p: obj.p.slice(0, ctx.keys ? ctx.keys.length : obj.p.length), pattern: Array.isArray(obj.steps) ? patternFromSteps(obj.steps) : null, tags: ["file"] })],
      skipped: 0, keys: null };
  }
  if (obj.format !== LIB.FORMAT) throw new Error("unknown format");
  if (!(obj.version >= 1)) throw new Error("version");
  if (!Array.isArray(obj.patches)) throw new Error("no patches");
  const fileKeys = Array.isArray(obj.paramLabels) && obj.paramLabels.length ? obj.paramLabels.map(String) : null;
  const out = [];
  let skipped = 0;
  for (const x of obj.patches) {
    if (!x || !Array.isArray(x.params)) { skipped++; continue; }
    const e = engIndex(x.engineName, x.engine | 0, obj.engines);
    if (e < 0) { skipped++; continue; }
    const p = remapParams(x.params, fileKeys, ctx.keys);
    out.push(cleanPatch({ ...x, engine: e, engineName: (ctx.engines || [])[e] || x.engineName || (obj.engines || [])[x.engine], p }));
  }
  return { patches: out, skipped, keys: fileKeys };
}

/* device side; rq(r, opt) -> reply args (Link.request), info from INFO */
const FLASH_OPT = { timeout: 2500, retries: 0 };
const bank = {
  async list(rq) {
    const first = parse[CMD.UP_LIST](await rq(req.upList(0, UP.LIST_MAX)));
    const slots = first.slots.slice();
    while (slots.length < first.total) {
      const r = parse[CMD.UP_LIST](await rq(req.upList(slots.length, Math.min(UP.LIST_MAX, first.total - slots.length))));
      if (!r.count) break;
      slots.push(...r.slots);
    }
    return { total: first.total, slots };
  },
  async get(rq, info, slot) { return parse[CMD.UP_GET](await rq(req.upGet(slot)), info); },
  /* -> rc (0 ok) */
  async put(rq, slot, pt) { return parse[CMD.UP_PUT](await rq(req.upPut(slot, pt), FLASH_OPT)).rc; },
  async store(rq, slot, name) { return parse[CMD.UP_STORE](await rq(req.upStore(slot, name), FLASH_OPT)).rc; },
  async load(rq, slot) { return parse[CMD.UP_LOAD](await rq(req.upLoad(slot), { timeout: 1000 })).rc; },
  async erase(rq, slot) { return parse[CMD.UP_ERASE](await rq(req.upErase(slot), FLASH_OPT)).rc; },
};

/* the current sound: DUMP + the first 16 steps */
/* ---- v6: the complete backup (projects, sections, user presets, samples, settings) ---- */
function u35enc(v) { v >>>= 0; return [0, 1, 2, 3, 4].map((k) => Math.floor(v / 2 ** (7 * k)) & 0x7F); }
function u35dec(r) { let v = 0; for (let k = 0; k < 5; k++) v += r.b() * 2 ** (7 * k); return v >>> 0; }
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
function b64enc(b) {
  let s = "";
  for (let i = 0; i < b.length; i += 3) {
    const n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0);
    s += B64[(n >> 18) & 63] + B64[(n >> 12) & 63] + (i + 1 < b.length ? B64[(n >> 6) & 63] : "=") + (i + 2 < b.length ? B64[n & 63] : "=");
  }
  return s;
}
function b64dec(s) {
  s = String(s).replace(/[^A-Za-z0-9+/]/g, "");
  const out = new Uint8Array((s.length * 3) >> 2);
  let o = 0, acc = 0, bits = 0;
  for (const c of s) {
    acc = ((acc << 6) | B64.indexOf(c)) & 0xFFFFFF;
    bits += 6;
    if (bits >= 8) { bits -= 8; out[o++] = (acc >> bits) & 255; }
  }
  return out.subarray(0, o);
}
/* object ids (firmware editor.c ED_BK_IDS): 0 the working project (tracks 1..4), 1 the settings, 2..5 projects
   A..D (tracks 1..4), 6..7 the user preset banks, 8 the working project's tracks 5..8, 9..12 those of A..D (v7),
   32.. the sample slots USR1.. (three before v7, two since). A project's tracks 5..8 are restored after its 1..4 */
const BK = { FORMAT: "sloop-backup", VERSION: 1, SAMPLES: [32, 33, 34], RESTORE: [6, 7, 2, 9, 3, 10, 4, 11, 5, 12, 0, 8, 1], TRK58: [8, 9, 10, 11, 12] };
class BackupError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
/* read everything; progress(done, total bytes) */
async function backupCapture(rq, info, progress = () => {}) {
  const L = parse[CMD.BK_LIST](await rq(req.bkList(), { timeout: 5000, retries: 0 }));
  if (L.rc) throw new BackupError("bkRc" + L.rc, `LIST rc ${L.rc}`);
  const total = L.items.reduce((s, it) => s + it.len, 0), objects = [];
  let done = 0;
  for (const it of L.items) {
    const data = new Uint8Array(it.len);
    for (let off = 0; off < it.len; off += 256) {
      const n = Math.min(256, it.len - off);
      const g = parse[CMD.BK_GET](await rq(req.bkGet(it.id, off, n), { timeout: 1500, retries: 2 }));
      if (g.rc) throw new BackupError(g.rc === 5 ? "bkStale" : "bkRead", `GET ${it.id}+${off} rc ${g.rc}`);
      if (g.data.length !== n) throw new BackupError("bkRead", `GET ${it.id}+${off}: ${g.data.length} bytes`);
      data.set(g.data, off);
      done += n;
      progress(done, total);
    }
    if (crc32(data) !== it.crc) throw new BackupError("bkStale", `object ${it.id}: CRC`);
    objects.push({ id: it.id, len: it.len, crc: it.crc, data: b64enc(data) });
  }
  return { format: BK.FORMAT, version: BK.VERSION, firmware: info.version, date: new Date().toISOString(), objects };
}
/* a backup file -> {id: Uint8Array}; every object checked against its length and CRC */
function backupObjects(file) {
  if (!file || file.format !== BK.FORMAT || !(file.version >= 1) || !Array.isArray(file.objects)) throw new BackupError("bkBad", "not a SLOOP backup");
  const m = new Map();
  for (const o of file.objects) {
    const d = b64dec(o.data || "");
    if (![...BK.RESTORE, ...BK.SAMPLES].includes(o.id) || d.length !== o.len || crc32(d) !== (o.crc >>> 0))
      throw new BackupError("bkBad", `object ${o.id}: damaged`);
    m.set(o.id, d);
  }
  if (!m.has(0) || !m.has(1)) throw new BackupError("bkBad", "incomplete backup");
  return m;
}
/* write it back: banks, projects, the working project, the settings, then the samples */
async function backupRestore(rq, file, progress = () => {}) {
  const m = backupObjects(file);
  const nslots = parse[CMD.SMP_INFO](await rq(req.smpInfo())).nslots;   /* (a backup of three slots onto two: USR3 is left out) */
  const total = [...m.values()].reduce((s, d) => s + d.length, 0) || 1;
  let done = 0;
  for (const id of BK.RESTORE) {
    if (!m.has(id)) continue;
    const d = m.get(id);
    let r = parse[CMD.BK_PUT](await rq(req.bkBegin(id, d.length, crc32(d)), { timeout: 1500, retries: 1 }));
    if (r.rc === 1 && BK.TRK58.includes(id)) continue;   /* firmware of four tracks: no tracks 5..8 to restore */
    if (r.rc) throw new BackupError("bkWrite", `begin ${id} rc ${r.rc}`);
    for (let off = 0; off < d.length; off += 256) {
      r = parse[CMD.BK_PUT](await rq(req.bkData(id, off, d.subarray(off, off + 256)), { timeout: 1500, retries: 1 }));
      if (r.rc) throw new BackupError("bkWrite", `data ${id}+${off} rc ${r.rc}`);
      done += Math.min(256, d.length - off);
      progress(done, total);
    }
    r = parse[CMD.BK_PUT](await rq(req.bkCommit(id), { timeout: 5000, retries: 0 }));
    if (r.rc === 3) throw new BackupError("bkStop", "stop the song first");
    if (r.rc) throw new BackupError("bkWrite", `commit ${id} rc ${r.rc}`);
  }
  for (const id of BK.SAMPLES) {
    if (!m.has(id) || id - 32 >= nslots) continue;
    const d = m.get(id), k = id - 32;
    if (!d.length) {
      const e = parse[CMD.SMP_ERASE](await rq(req.smpErase(k), { timeout: 2500, retries: 0 }));
      if (e.rc) throw new BackupError("bkWrite", `erase USR${k + 1} rc ${e.rc}`);
      continue;
    }
    let r = parse[CMD.SMP_BEGIN](await rq(req.smpBegin(k), { timeout: 1000, retries: 0 }));
    if (r.rc) throw new BackupError("bkWrite", `USR${k + 1} begin rc ${r.rc}`);
    const data = d.subarray(SMP.DATA_OFF);
    for (let off = 0; off < data.length; off += 256) {
      const w = parse[CMD.SMP_WRITE](await rq(req.smpWrite(k, SMP.DATA_OFF + off, data.subarray(off, off + 256)), { timeout: 1000, retries: 1 }));
      if (w.rc) throw new BackupError("bkWrite", `USR${k + 1} write rc ${w.rc}`);
      done += Math.min(256, data.length - off);
      progress(done, total);
    }
    r = parse[CMD.SMP_END](await rq(req.smpEnd(k, d.subarray(0, SMP.HDR_LEN)), { timeout: 2000, retries: 0 }));
    if (r.rc) throw new BackupError("bkWrite", `USR${k + 1} end rc ${r.rc}`);
  }
  return true;
}

async function capturePatch(rq, info, name) {
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const steps = [];
  for (let i = 0; i < UP.PAT && i < info.nstep; i++) steps.push(parse[CMD.STEP_GET](await rq(req.stepGet(i))));
  return { patch: cleanPatch({ name, engine: dump.engine, engineName: info.engines[dump.engine], p: dump.p, pattern: patternFromSteps(steps) }), dump, steps };
}

/* what loading a sound leaves alone (firmware ui.c param_kept): the mix (LEVEL, PAN, MUTE), the pattern
   parameters (LEN, DIV, SWG, GATE) and the key the part plays in (ROOT, SCL, QNT; CHORD from SLOOP 2.0) */
const keptIds = (info) => new Set([0, 25, 26, 27, 29, 30, 31, 32, 39, 40, ...(info.pe0 > 49 ? [49] : [])]);
/* play a patch without writing flash, as UP_LOAD would load it: SET the engine (G_ENGSEL, engine defaults),
   then every parameter of the sound that differs. Never the pattern (LIVE: a sound never changes the
   sequence), the mix or the key. opt: {gEng: G_ENGSEL id, progress(i, n)} -> {wrote: false} */
async function auditionPatch(rq, info, pt, opt = {}) {
  await rq(req.set(1, opt.gEng ?? 20, pt.engine));
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const n = Math.min(info.pcount, pt.p.length), kept = keptIds(info);
  for (let i = 0; i < n; i++) {
    const v = pt.p[i];
    if (opt.progress) opt.progress(i, n);
    if (v == null || kept.has(i) || v === dump.p[i]) continue;
    await rq(req.set(0, i, v));
  }
  return { wrote: false };
}

/* WATCH on (asking for TRACK_CHANGED too): false when the firmware does not know it (older than protocol v2),
   else 1, or 3 when it also has TRACK_PARAM / TRACK_CHANGED (protocol v4) */
async function startWatch(rq) {
  try { const on = parse[CMD.WATCH](await rq(req.watch(3), { timeout: 300, retries: 1, quiet: true })).on; return on & 1 ? on & 3 : false; }
  catch (e) { if (e.message === "closed") throw e; return false; }
}

/* ------------------------------------------------------------ mixer (v3) --- */
/* The TRACKS page in the editor: TRACK (engine, preset, level, mute, armed of all four) and TRACK_DUMP
   of each track for its P_PAN. Level and mute go through TRACK_MIX (any track; the drum level is
   G_DRLVL). Pan: TRACK_PARAM (v4, any track); with v3 firmware a plain SET, which reaches only the
   selected track: another track is selected for it and the selection is put back (TRACK pushes no
   RELOAD). ids: {pan: P_PAN id} */
const mixer = {
  async read(rq, info, ids) {
    const tr = parse[CMD.TRACK](await rq(req.track()));
    for (let i = 0; i < tr.ntrk; i++) {
      const d = parse[CMD.TRACK_DUMP](await rq(req.trackDump(i)), info);
      tr.tracks[i].pan = ids.pan == null ? null : d.p[ids.pan];
      tr.tracks[i].e0 = d.p[info.pe0];               /* the drum track: its kit */
    }
    return tr;
  },
  /* -> {track, level, mute} as the device has them now */
  async setMix(rq, track, level, mute, opt) { return parse[CMD.TRACK_MIX](await rq(req.trackMix(track, level, mute), opt)); },
  /* -> the pan value after clamping. v4: TRACK_PARAM, the selection stays */
  async setPan(rq, track, sel, panId, v, v4) {
    if (v4) return parse[CMD.TRACK_PARAM](await rq(req.trackParam(track, panId, v), { key: "pan:" + track })).value;
    if (track === sel) return parse[CMD.SET](await rq(req.set(0, panId, v))).value;
    await rq(req.track(track));
    try { return parse[CMD.SET](await rq(req.set(0, panId, v))).value; }
    finally { await rq(req.track(sel)).catch(() => {}); }
  },
};

function sayK(k, arg = "") { lastKey = k; lastArg = arg; $("status").textContent = t(k) + arg; }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((e) => setLabel(e, t(e.dataset.t)));
  $("lang").textContent = t("other");
  setLabel($("connect"), t(dev ? "disconnect" : "connect"));
  if (lastKey) $("status").textContent = t(lastKey) + lastArg;
  $("libq").placeholder = t("libSearch");
  renderLive();
  renderLib();
  renderBank();
  renderPanels();
  if (dev) { renderSlots(); renderStepHead(); renderSamples(); renderTrackbar(); renderMixer(); renderSysinfo(); }
}
$("lang").addEventListener("click", () => { lang = lang === "ja" ? "en" : "ja"; applyLang(); });
