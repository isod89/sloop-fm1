  @font-face { font-family: "Fukiai"; src: url("fukiai.ttf") format("truetype"); font-display: block; unicode-range: U+EA00-EB09; }
  :root {
    --bg: #000; --s1: #0b0b0e; --s2: #1a1a1e; --s3: #36363c; --line: #232329; --dim: #76767e; --fg2: #c4c4cc; --fg: #f2f2f2;
    --red: #ff2c34; --t1: #287cff; --t2: #1ecc70; --t3: #ffc618; --t4: #ff621a; --trk: var(--t1);
    --font: "SLOOP Terminus", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg2); font: 16px/20px var(--font); -webkit-font-smoothing: none;
         font-smooth: never; text-rendering: optimizeSpeed; font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  h1, h2, h3 { font-weight: 400; margin: 0; font-size: 16px; line-height: 20px; }
  ::selection { background: var(--trk); color: #000; }
  [hidden] { display: none !important; }
  .dim { color: var(--dim); }
  .ic { font-family: "Fukiai"; font-style: normal; font-weight: 400; font-synthesis: none; line-height: 1; margin-right: .4em;
        -webkit-font-smoothing: antialiased; }
  html:not(.fk) .ic { display: none; }

  /* ---- controls ---- */
  button { font: inherit; color: var(--fg); background: var(--s2); border: 0; padding: 6px 12px; cursor: pointer;
           white-space: nowrap; text-transform: lowercase; }
  button:hover:not(:disabled) { background: var(--s3); }
  button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--trk); outline-offset: 1px; }
  button:disabled { color: var(--s3); background: var(--s1); cursor: default; }
  button.pri { background: var(--trk); color: #000; }
  button.pri:hover:not(:disabled) { background: var(--fg); }
  button.pri:disabled { background: var(--s2); color: var(--s3); }
  button.warn:hover:not(:disabled) { background: var(--red); color: #000; }
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--s3); padding: 3px 6px; border-radius: 0; min-width: 0; }
  select { appearance: none; padding-right: 22px; cursor: pointer;
           background: var(--bg) linear-gradient(45deg, transparent 50%, var(--dim) 50%) no-repeat calc(100% - 9px) 55% / 5px 5px,
                       linear-gradient(-45deg, transparent 50%, var(--dim) 50%) no-repeat calc(100% - 4px) 55% / 5px 5px; }
  select[size], select[multiple] { background: var(--bg); padding: 0; }
  select option { background: var(--bg); color: var(--fg); }
  select[size] option { padding: 2px 8px; }
  select[size] option:checked { background: var(--trk); color: #000; }
  input[type=search] { padding-left: 8px; }
  input::placeholder { color: var(--s3); }
  input[type=checkbox] { appearance: none; width: 16px; height: 16px; margin: 0; border: 1px solid var(--dim); background: var(--bg);
                         vertical-align: -3px; cursor: pointer; display: inline-grid; place-content: center; }
  input[type=checkbox]:checked { background: var(--trk); border-color: var(--trk); }
  input[type=checkbox]:checked::after { content: ""; width: 8px; height: 8px; background: #000; }
  /* a slider: a thin bar filled to the value (--p, set by the editor), a small white handle; no native chrome */
  input[type=range] { appearance: none; -webkit-appearance: none; width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px;
    background: linear-gradient(90deg, var(--s3) var(--a, 0%), var(--c, var(--trk)) var(--a, 0%), var(--c, var(--trk)) var(--p, 0%), var(--s3) var(--p, 0%)); }
  input[type=range]::-moz-range-track { height: 4px;
    background: linear-gradient(90deg, var(--s3) var(--a, 0%), var(--c, var(--trk)) var(--a, 0%), var(--c, var(--trk)) var(--p, 0%), var(--s3) var(--p, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 14px; margin-top: -5px; background: var(--fg); border: 0; border-radius: 0; }
  input[type=range]::-moz-range-thumb { width: 6px; height: 14px; background: var(--fg); border: 0; border-radius: 0; }
  input[type=range]:disabled { opacity: .3; }
  progress { appearance: none; -webkit-appearance: none; height: 6px; border: 0; background: var(--s3); vertical-align: middle; }
  progress::-webkit-progress-bar { background: var(--s3); }
  progress::-webkit-progress-value { background: var(--trk); }
  progress::-moz-progress-bar { background: var(--trk); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 8px; }
  .bar .grow { flex: 1; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; }
  .seg button, button.tog { background: var(--s2); color: var(--dim); }
  .seg button[aria-pressed="true"], button.tog[aria-pressed="true"] { background: var(--trk); color: #000; }
  .seg.ids button { text-transform: none; }
  button:disabled .ic { opacity: .5; }
  label { white-space: nowrap; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: var(--dim); text-align: left; padding: 0 12px 4px 0; text-transform: lowercase; }
  td { padding: 2px 12px 2px 0; }
  td.i { color: var(--dim); text-align: right; }

  /* ---- the frame: the side bar (logo, pages, the device), the page ---- */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px;
          border-right: 1px solid var(--line); overflow-y: auto; }
  .brand { display: flex; align-items: flex-end; gap: 10px; color: var(--fg); text-decoration: none; }
  .brand svg { width: 132px; height: auto; display: block; }
  .brand span { color: var(--dim); text-transform: lowercase; padding-bottom: 2px; }
  .tabs { display: flex; flex-direction: column; gap: 2px; }
  .tabs .navh { color: var(--s3); margin: 14px 0 4px 12px; text-transform: lowercase; }
  .tabs .navh:first-child { margin-top: 0; }
  .tabs button { background: none; color: var(--dim); text-align: left; padding: 6px 12px; border-left: 4px solid transparent; }
  .tabs button:hover { color: var(--fg); background: var(--s1); }
  .tabs button[aria-selected="true"] { color: var(--fg); background: var(--s2); border-left-color: var(--trk); }
  .devcard { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  .devline { display: flex; align-items: center; gap: 8px; color: var(--fg); }
  .led { width: 10px; height: 10px; background: var(--s3); flex: none; }
  .led.on { background: var(--t2); box-shadow: 0 0 8px var(--t2); }
  .led.busy { background: var(--t3); }
  #version { color: var(--fg2); overflow-wrap: anywhere; }
  #live, #mock { color: var(--dim); }
  #connect { width: 100%; }
  .devcard .links { display: flex; justify-content: space-between; gap: 8px; }
  .lang { background: none; color: var(--dim); padding: 0; text-decoration: underline; text-transform: none; }
  .lang:hover:not(:disabled) { background: none; color: var(--fg); }

  .main { min-width: 0; padding: 0 32px 32px; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 20px 0 12px; border-bottom: 1px solid var(--line); }
  .titlebar { display: flex; align-items: flex-end; gap: 16px; min-height: 32px; }
  #pagetitle { font-size: 32px; line-height: 32px; color: var(--trk); text-transform: uppercase; white-space: nowrap; flex: none; }
  #status { margin-left: auto; color: var(--dim); text-align: right; min-height: 20px; overflow-wrap: anywhere; max-width: 70%;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #status.err { color: var(--red); }
  .trackbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
  .trackbar > .dim { text-transform: lowercase; margin-right: 4px; }
  #trackbtns { gap: 8px; }
  #trackbtns button { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 0; background: var(--s1); color: var(--fg2);
                      text-transform: none; min-width: 150px; max-width: 240px; overflow: hidden; }
  #trackbtns button .no { width: 32px; height: 32px; display: grid; place-content: center; background: var(--s2); color: var(--c); font-size: 16px; flex: none; }
  #trackbtns button .nm { overflow: hidden; text-overflow: ellipsis; }
  #trackbtns button[aria-pressed="true"] { background: var(--s2); color: var(--fg); box-shadow: inset 0 -2px var(--c); }
  #trackbtns button[aria-pressed="true"] .no { background: var(--c); color: #000; }
  .hint { margin: 32px 0; color: var(--dim); }
  .panel { padding-top: 20px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--s3); }
  footer a { color: var(--dim); }

  /* ---- cards and the parameter pages (the device's 4 knobs a page, one colour per knob) ---- */
  .card { background: var(--s1); border: 1px solid var(--line); padding: 14px 16px 16px; margin: 0 0 16px; min-width: 0; }
  .card > h2, .group > h2 { color: var(--fg); text-transform: uppercase; margin: 0 0 12px; display: flex; align-items: center; gap: 8px;
                            font-size: 32px; line-height: 32px; }
  .card > h2 .ic, .group > h2 .ic { font-size: 20px; }
  .card > h2 .sub, .group > h2 .sub { color: var(--dim); text-transform: lowercase; margin-left: auto; font-size: 16px; line-height: 16px; }
  .card > p.dim { margin: 0 0 12px; }
  .groups + .card { margin-top: 16px; }
  .cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 0 16px; align-items: start; }
  .groups { columns: 2 520px; column-gap: 16px; }
  .group { background: var(--s1); border: 1px solid var(--line); padding: 14px 16px 12px; min-width: 0; break-inside: avoid; margin: 0 0 16px; }
  .group h3 { color: var(--dim); text-transform: uppercase; margin: 10px 0 6px; display: flex; align-items: center; }
  .group h2 + h3 { margin-top: 0; }
  .knobs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  /* 2.5: the DRUM SYNTH page */
  .dslanes { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin: 6px 0 10px; }
  .dslanes button { --c: var(--t4); padding: 8px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dslanes button[aria-pressed=true] { background: var(--c); border-color: var(--c); color: #000; }
  .dsrng { display: inline-flex; align-items: center; gap: 6px; }
  .dsrng input[type=range] { width: 110px; --c: var(--t4); }
  #dsgroups .knob { --c: var(--t4); }
  .knob { --c: var(--t1); position: relative; padding: 8px 10px 10px; min-width: 0; border-left: 1px solid var(--line);
          display: flex; flex-direction: column; gap: 4px; }
  .knob:first-child { border-left: 0; padding-left: 0; }
  .knobs > .knob:nth-child(4n + 2) { --c: var(--t2); }
  .knobs > .knob:nth-child(4n + 3) { --c: var(--t3); }
  .knobs > .knob:nth-child(4n + 4) { --c: var(--t4); }
  .knob .kl { color: var(--c); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .knob .v { color: var(--fg); font-size: 32px; line-height: 32px; white-space: nowrap; overflow: hidden; cursor: ns-resize;
             user-select: none; touch-action: none; }
  .knob .v small { font-size: 16px; line-height: 16px; color: var(--dim); margin-left: 4px; }
  .knob .v.long { font-size: 16px; line-height: 32px; }
  .knob select { width: 100%; color: var(--fg); border-color: var(--s3); font-size: 16px; }
  .knob.enum .v { display: none; }
  .knob.enum select { margin-top: 6px; height: 34px; color: var(--c); border-color: var(--line); background-color: var(--s2); }
  .knob.pushed .v, .knob.pushed select { color: var(--trk); }
  /* wave choices: a page-drawn picker so the options carry an icon (Chrome 135+); native menus get words only */
  @supports (appearance: base-select) {
    select.wave, select.wave::picker(select) { appearance: base-select; }
    select.wave > button { font: inherit; background: none; color: inherit; padding: 0; text-align: start; text-transform: none; }
    select.wave::picker(select) { border: 1px solid var(--s3); background: var(--bg); color: var(--fg); padding: 0; }
    select.wave option { padding: 2px 8px; min-block-size: 0; }
    select.wave option:checked { color: var(--trk); }
    select.wave option:hover, select.wave option:focus-visible { background: var(--trk); color: #000; }
    select.wave option::checkmark { display: none; }
  }

  /* ---- sound: the engine and its presets ---- */
  .browser { display: grid; grid-template-columns: 200px minmax(220px, 360px) 1fr; gap: 16px; align-items: start; }
  .browser .fld { display: flex; flex-direction: column; gap: 6px; color: var(--dim); text-transform: lowercase; }
  .browser select:not([size]) { width: 100%; }
  .browser select[size] { width: 100%; height: 200px; }
  .browser .acts { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding-top: 26px; }
  .browser .acts .bar { margin: 0; }
  #engine { height: 34px; }

  /* ---- sequencer: the steps as the device's tiles, the drum lanes ---- */
  .grid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; margin: 8px 0 16px; }
  .grid button { background: var(--s2); color: var(--dim); padding: 4px 5px; min-width: 0; height: 58px; display: flex; flex-direction: column;
                 justify-content: space-between; text-align: left; overflow: hidden; text-transform: none; }
  .grid button:hover:not(:disabled) { background: var(--s3); }
  .grid button .n { color: var(--s3); }
  .grid button.beat .n { color: var(--dim); }
  .grid button .x { overflow: hidden; overflow-wrap: anywhere; color: var(--fg2); line-height: 16px; max-height: 32px; }
  .grid button.on { background: var(--trk); }
  .grid button.on .n, .grid button.on .x { color: #000; }
  .grid button.acc { box-shadow: inset 0 3px var(--fg); }
  .grid button.tie { background: repeating-linear-gradient(-45deg, var(--s2) 0 6px, var(--s3) 6px 8px); }
  .grid button.lk .n::after { content: " \25AA"; }
  .grid button.fc1 .n::before { content: "F "; }
  .grid button.fc2 .n::before { content: "\00d7 "; }
  .grid button.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
  .stepdetail { margin: 0 0 16px; padding: 12px 0 0; border-top: 1px solid var(--line); }
  .stepdetail .bar > * { margin-right: 8px; }
  .stepdetail input[type=number] { width: 70px; }
  .stepcols { columns: 520px; column-gap: 32px; }
  .stepcols table { break-inside: avoid; margin-bottom: 12px; }
  #steps input[type=text] { width: 140px; }
  #steps input[type=number] { width: 60px; }
  #steps .bad { border-color: var(--red); color: var(--red); }
  #steps tr.off td { color: var(--s3); }
  #steps tr.hl td { background: var(--s2); }
  /* ---- 2.5: LEN at hand, the piano roll, the MIDI preview, the song order ---- */
  .seqtools input[type=number] { width: 64px; text-align: center; }
  .seqtools .sq { min-width: 34px; padding: 0 8px; }
  .seqtools > * { margin-right: 6px; }
  .rollbox { overflow-x: auto; margin: 8px 0; border: 1px solid var(--line); }
  .rollbox canvas { display: block; touch-action: none; }
  .midiprev { border: 1px solid var(--line); padding: 12px; margin: 8px 0 16px; }
  .midiprev ul { margin: 6px 0; padding-left: 20px; }
  .midiprev ul.warn li { color: var(--t3); }
  table.song td, table.song th { padding: 4px 8px; text-align: left; }
  table.song input[type=number] { width: 64px; }
  table.song td.acts button { min-width: 34px; padding: 0 6px; margin-right: 4px; }
  table.song tr.bad td { color: var(--red); }
  #p-song .bad { color: var(--red); }
  details.more { margin-top: 8px; }
  details.more > summary { cursor: pointer; color: var(--dim); text-transform: lowercase; list-style: none; padding: 6px 0; }
  details.more > summary::before { content: "\25B8  "; }
  details.more[open] > summary::before { content: "\25BE  "; }
  .dgrid { display: grid; gap: 2px; margin: 8px 0 16px; overflow-x: auto; }
  .dgrid .ln { color: var(--fg2); white-space: nowrap; padding-right: 10px; align-self: center; text-transform: lowercase; }
  .dgrid .hd { color: var(--dim); }
  .dgrid .gap { grid-column: 1 / -1; height: 12px; }
  .dgrid button { background: var(--s2); color: #000; padding: 0; min-width: 18px; height: 22px; line-height: 22px; text-align: center; }
  .dgrid button.beat { background: var(--s3); }
  .dgrid button:hover { outline: 1px solid var(--dim); }
  .dgrid button.on { background: var(--t4); }
  .dgrid button.on.l1 { background: color-mix(in srgb, var(--t4) 35%, var(--s2)); }
  .dgrid button.on.l2 { background: color-mix(in srgb, var(--t4) 65%, var(--s2)); }
  .dgrid button.on.l3 { background: var(--fg); }

  /* ---- mixer: the device's TRACKS strips ---- */
  .mixer { display: grid; grid-template-columns: repeat(4, minmax(0, 170px)); gap: 12px; margin: 4px 0 12px; }
  .strip { --c: var(--t1); background: var(--bg); border: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column;
           align-items: center; gap: 8px; min-width: 0; }
  .strip.sel { border-color: var(--c); }
  .strip button.num { width: 48px; height: 48px; font-size: 32px; padding: 0; background: var(--s2); color: var(--c); }
  .strip.sel button.num { background: var(--c); color: #000; }
  .strip .snd { width: 100%; text-align: center; color: var(--fg); overflow-wrap: anywhere; min-height: 40px; }
  .strip .rec, .strip .solo { color: var(--s3); text-transform: lowercase; }
  .strip .rec.on { color: #000; background: var(--red); padding: 0 6px; }
  .strip .rec:not(.on) .ic { visibility: hidden; }
  .strip .solo { visibility: hidden; }
  .strip .solo.on { visibility: visible; color: #000; background: var(--fg); padding: 0 6px; }
  .strip input.fader { writing-mode: vertical-lr; direction: rtl; width: 32px; height: 180px; }
  .strip input.fader::-webkit-slider-runnable-track { width: 6px; height: 100%; background: linear-gradient(0deg, var(--c) var(--p, 0%), var(--s3) var(--p, 0%)); }
  .strip input.fader::-moz-range-track { width: 6px; background: linear-gradient(0deg, var(--c) var(--p, 0%), var(--s3) var(--p, 0%)); }
  .strip input.fader::-webkit-slider-thumb { width: 18px; height: 8px; margin-top: 0; margin-left: -6px; }
  .strip input.fader::-moz-range-thumb { width: 18px; height: 8px; }
  .strip .lv { color: var(--fg); font-size: 32px; line-height: 32px; }
  .strip .v { white-space: nowrap; }
  .strip .pan { width: 100%; }
  .strip.muted .fader, .strip.muted .lv { opacity: .35; }
  .strip button { width: 100%; }
  .strip button.tog[aria-pressed="true"] { background: var(--c); color: #000; }
  .strip button.selb:disabled { background: none; color: var(--c); }

  /* ---- library and the device bank ---- */
  .libcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
  .libcols > .card { margin: 0; }
  .libcols .bar input[type=search] { flex: 1 1 140px; }
  .list { height: 360px; overflow: auto; border: 1px solid var(--line); background: var(--bg); resize: vertical; }
  .list table { width: 100%; table-layout: fixed; }
  .list th { position: sticky; top: 0; background: var(--s1); padding: 4px 8px; }
  .list td { padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg2); }
  .list tr[data-id]:hover td, .list tr[data-slot]:hover td { background: var(--s2); }
  .list tr[data-id], .list tr[data-slot] { cursor: pointer; }
  .list tr.sel td, .list tr.sel:hover td { background: var(--trk); color: #000; }
  .list tr.empty td { color: var(--s3); }
  .list tr.over td { outline: 1px dashed var(--trk); outline-offset: -1px; }
  .list.over { outline: 1px solid var(--trk); }
  .list .none { padding: 12px; color: var(--dim); }
  .list col.n { width: 52px; } .list col.e { width: 96px; } .list col.d { width: 110px; }

  /* ---- samples: CHOP and the user slots ---- */
  .smp { background: var(--s1); border: 1px solid var(--line); padding: 14px 16px; margin: 0 0 16px; }
  .smp.over { outline: 2px dashed var(--trk); outline-offset: -2px; }
  .smp .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 8px; }
  .smp .head b { font-weight: 400; color: var(--fg); min-width: 48px; }
  .smp > .head:first-child b { font-size: 32px; line-height: 32px; color: var(--trk); }
  .smp progress { width: 180px; }
  .smp table { margin: 8px 0 0; }
  .smp input.name { width: 110px; text-transform: uppercase; }
  .smp input.root { width: 60px; }
  .smp .bad { color: var(--red); }
  .chop canvas.wave { display: block; width: 100%; height: 150px; margin: 8px 0; background: var(--bg); border: 1px solid var(--line);
                      cursor: default; touch-action: none; }
  .chop .sep { width: 12px; }
  .chop input.num { width: 70px; }
  .chop input[type=range] { width: 110px; }
  .chop button.tap { min-width: 80px; }
  .chop .chops { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0; }
  .chop .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--s2); color: var(--fg2); padding: 3px 8px; cursor: pointer;
                user-select: none; text-transform: none; }
  .chop .chip.on { background: var(--trk); color: #000; }
  .chop .chip.off { color: var(--s3); text-decoration: line-through; }
  .chop input.len { width: 180px; }
  .chop .selrow[hidden] { display: none; }

  /* ---- drum kit: 16 pads, one per drum lane, as the white keys ---- */
  .kithead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: end; }
  .kitmeter { display: flex; align-items: center; gap: 10px; }
  .kitmeter progress { width: 220px; height: 8px; }
  .kitmeter.over progress::-webkit-progress-value { background: var(--red); }
  .kitmeter.over span { color: var(--red); }
  .pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
  .pad { --c: var(--t4); background: var(--bg); border: 1px solid var(--line); padding: 10px; min-width: 0; display: flex; flex-direction: column;
         gap: 6px; position: relative; min-height: 170px; }
  .pad.over { outline: 2px dashed var(--c); outline-offset: -2px; }
  .pad .ph { display: flex; align-items: baseline; gap: 8px; }
  .pad .ph b { font-weight: 400; color: var(--c); text-transform: uppercase; }
  .pad .ph .key { color: var(--s3); margin-left: auto; }
  .pad canvas { width: 100%; height: 48px; display: block; background: var(--s1); cursor: pointer; }
  .pad .fn { color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pad .empty { flex: 1; display: grid; place-content: center; color: var(--s3); text-align: center; cursor: pointer; border: 1px dashed var(--s3); }
  .pad .empty:hover { color: var(--fg2); border-color: var(--dim); }
  .pad .row3 { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; color: var(--dim); }
  .pad .row3 .val { color: var(--fg2); min-width: 64px; text-align: right; }
  .pad .acts { display: flex; gap: 4px; }
  .pad .acts button { padding: 3px 8px; }
  .pad.playing canvas { outline: 1px solid var(--c); }
  .kstep { border-top: 1px solid var(--line); padding: 16px 0 4px; margin-top: 8px; }
  .kstep > h3 { display: flex; align-items: center; gap: 12px; color: var(--fg); text-transform: uppercase; margin: 0 0 10px; }
  .kstep > h3 .num { width: 32px; height: 32px; display: grid; place-content: center; background: var(--trk); color: #000; font-size: 32px; line-height: 32px; }
  .dest { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 10px; }
  .dest button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 12px; background: var(--bg);
                 border: 1px solid var(--s3); text-transform: none; white-space: normal; text-align: left; min-height: 92px; }
  .dest button b { font-weight: 400; font-size: 32px; line-height: 32px; color: var(--fg); }
  .dest button .cap { color: var(--dim); }
  .dest button .now { color: var(--s3); overflow-wrap: anywhere; }
  .dest button.full .now { color: var(--fg2); }
  .dest button.big { border-color: var(--t4); }
  .dest button.big b { color: var(--t4); }
  .dest button[aria-checked="true"] { background: var(--s2); border-color: var(--trk); box-shadow: inset 0 0 0 1px var(--trk); }
  .dest button[aria-checked="true"] b { color: var(--trk); }
  .dest button:disabled { opacity: .35; }
  .destnote { color: var(--fg2); margin: 0 0 10px; }
  .destnote .warn, .warn-t { color: var(--t3); }

  /* ---- samples: the slots, files or CHOP, send ---- */
  .dest.slots4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dest.slots4 button progress { width: 100%; height: 4px; }
  .modes { margin: 0 0 10px; }
  .modes button { padding: 8px 16px; text-transform: none; }
  .modes button[aria-selected="true"] { background: var(--trk); color: #000; }
  .modehelp { color: var(--fg2); margin: 0 0 12px; max-width: 980px; }
  .modehelp p { margin: 0 0 4px; }
  .modehelp p:first-child { color: var(--fg); }
  .dropzone { border: 1px dashed var(--s3); padding: 28px 16px; display: grid; place-items: center; gap: 6px; cursor: pointer;
              text-align: center; margin: 0 0 12px; background: var(--bg); }
  .dropzone b { font-weight: 400; color: var(--fg); }
  .dropzone:hover, .dropzone.over { border-color: var(--trk); }
  .dropzone.over { outline: 2px dashed var(--trk); outline-offset: -2px; }
  canvas.keymap { display: block; width: 100%; height: 44px; margin: 8px 0 12px; }
  .flist { display: grid; gap: 2px; margin: 0 0 8px; }
  .frow { --c: var(--t1); display: grid; grid-template-columns: 40px minmax(0, 1fr) 80px 120px 80px 40px; gap: 8px; align-items: center;
          background: var(--bg); padding: 4px 8px; border-left: 4px solid var(--c); }
  .frow.fhead { background: none; border-left-color: transparent; color: var(--dim); text-transform: lowercase; }
  .frow .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .frow input.root { width: 72px; }
  .frow button { padding: 3px 0; }
  .pane .smp.chop { border: 0; padding: 0; margin: 0; background: none; }
  .seg button.trk[aria-pressed], .seg button.trk { color: var(--c); }
  .seg button.trk:hover:not(:disabled) { background: var(--c); color: #000; }
  .seg button.trk:disabled { color: var(--s3); }
  /* ---- projects, settings ---- */
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .slot { background: var(--bg); border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .slot b { font-weight: 400; font-size: 32px; line-height: 32px; color: var(--fg); }
  .slot .st { color: var(--dim); text-transform: lowercase; }
  .slot.used .st { color: var(--t2); }
  .slot .bar { margin: 0; }
  #sysinfo th { padding-right: 24px; }
  #sysinfo td { color: var(--fg); }
  .fm6ops { overflow-x: auto; }
  .fm6list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px; margin: 6px 0 10px; }
  .fm6v { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .fm6v button { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none; }
  .fm6v .dim { width: 2.6em; }
  #fm6panel.drop { outline: 2px dashed var(--trk); outline-offset: -6px; }
  .fm6ops td, .fm6ops th { padding: 1px 3px; }
  input.fm6n { width: 3.6em; padding: 2px 3px; }
  #fm6panel h3 { margin: 16px 0 6px; color: var(--dim); text-transform: uppercase; }

  /* ---- narrow screens: the side bar becomes a top bar ---- */
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px;
            border-right: 0; border-bottom: 1px solid var(--line); }
    .brand svg { width: 96px; }
    .tabs { flex-direction: row; overflow-x: auto; order: 3; width: 100%; }
    .tabs .navh { display: none; }
    .tabs button { border-left: 0; border-bottom: 3px solid transparent; }
    .tabs button[aria-selected="true"] { border-bottom-color: var(--trk); }
    .devcard { margin: 0 0 0 auto; padding: 0; border: 0; flex-direction: row; flex-wrap: wrap; align-items: center; }
    #connect { width: auto; }
    .main { padding: 0 16px 24px; }
    .top { position: static; }
    .browser { grid-template-columns: 1fr; }
    .browser .acts { padding-top: 0; }
    .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    .mixer { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pads { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .knobs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dslanes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .knobs > .knob:nth-child(2n + 1) { border-left: 0; padding-left: 0; }
    .kithead { grid-template-columns: 1fr; }
    .dest, .dest.slots4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .frow { grid-template-columns: 32px minmax(0, 1fr) 64px 40px; }
    .frow > :nth-child(4), .frow > :nth-child(5) { display: none; }
    .dest button.big { grid-column: 1 / -1; }
  }
</style>

<script>
"use strict";
/*PROTO-BEGIN*/
/* ---------------------------------------------------------------- protocol --- */
const HDR = [0x7D, 0x46, 0x4C];
const CMD = { INFO: 1, GET: 2, SET: 3, DUMP: 4, DESC: 5, STEP_GET: 6, STEP_SET: 7, PRESET: 8, PROJECT: 9, NAMES: 10,
  SMP_BEGIN: 11, SMP_WRITE: 12, SMP_END: 13, SMP_ERASE: 14, SMP_INFO: 15,
  UP_LIST: 16, UP_GET: 17, UP_PUT: 18, UP_STORE: 19, UP_LOAD: 20, UP_ERASE: 21,
  WATCH: 22, CHANGED: 23, RELOAD: 24, PING: 25, STEP_CHANGED: 26,
  TRACK: 27, TRACK_MIX: 28, TRACK_DUMP: 29, TRACK_STEP: 30,
  TRACK_PARAM: 31, TRACK_CHANGED: 32,
  DRUM_STEP: 33,
  BK_LIST: 34, BK_GET: 35, BK_PUT: 36,                /* v6: backup / restore */
  LOCK_GET: 37, LOCK_SET: 38, MICRO_GET: 39, MICRO_SET: 40,     /* v7 (SLOOP 2.4): parameter locks, nudges */
  FILL_GET: 41, FILL_SET: 42,                         /* v8 (SLOOP 2.4): the steps' fill conditions */
  FM6_GET: 68, FM6_PUT: 69, FM6_LIST: 70, FM6_ERASE: 71,    /* v9 (SLOOP 2.4): the FM6 engine's patches (Felucca 1.0's numbers) */
  DSYN_LIST: 72, DSYN_GET: 73, DSYN_PUT: 74, DSYN_STORE: 75, DSYN_PLAY: 76 };   /* v10 (SLOOP 2.5): the SYN drum kits */
/* v7: the parameters a step can lock (firmware seq.c p_lockable: the sound, not the sequencer / arp / key / voice
   mode); ids as core.h: LEVEL .. LFO dests, GATE, the sends, GLIDE, PAN, DETUNE, the SLICER, FILTER, the engine's 8;
   from 2.6 (pe0 63) also the INSERT's A B C and MIX (54..57). pe0: the device's (the newest when none) */
const lockable = (id, pe0 = typeof dev !== "undefined" && dev && dev.info ? dev.info.pe0 : 63) => id <= 16 || id === 32 || (id >= 33 && id <= 36) || id === 38 || id === 39
  || id === 44 || (id >= 45 && id <= 48) || id === 50 || (pe0 >= 63 && id >= 54 && id <= 57) || (id >= pe0 && id <= pe0 + 7);
const MICRO = { MIN: -32, MAX: 31 };                 /* a step's nudge in 1/64 of a step (- early, + late), sent + 64 */
/* v8: a step's fill condition (firmware core.h FC_*): 0 normal, 1 plays only during a fill, 2 silent during one; 2 bits a
   step, 4 steps a byte (step i: byte i >> 2, bits 2 (i & 3)..), the 16 bytes sent pack7 */
const FC = { NORM: 0, FILL: 1, NOFILL: 2, NAMES: ["normal", "fill only", "no fill"] };
const fillGet = (bytes, i) => ((bytes[i >> 2] || 0) >> (2 * (i & 3))) & 3;
const fillSet = (bytes, i, c) => { bytes[i >> 2] = (bytes[i >> 2] & ~(3 << (2 * (i & 3)))) | ((c & 3) << (2 * (i & 3))); };
/* frames the device sends on its own (while WATCH is on); never replies */
const PUSH = new Set([CMD.CHANGED, CMD.RELOAD, CMD.STEP_CHANGED, CMD.TRACK_CHANGED]);
/* user preset bank: name 1..12 printable ASCII, a 16-step pattern of (note, flags 1 acc 2 slide 4 tie) */
const UP = { NAME_MAX: 12, PAT: 16, LIST_MAX: 16 };
const F = { INT: 0, PCT: 1, BIPCT: 2, TIME: 3, LFOHZ: 4, CUTOFF: 5, DB: 6, SEMI: 7, ENUM: 8, BPM: 9, NOTE: 10, ONOFF: 11, OCT: 12, STEPS: 13,
  SWING: 14, FILT: 15 };
/* v5 (SLOOP 2.0): the drum track's 16 sounds (firmware drums.c LANE_NOTE / LANE_NAME), one per white key
   F3..G5; a hit has a level (NORM, GHOST, SOFT, HARD: OCT- / OCT+ held on the device) and a ratchet x1..x4 */
const DRUM_LANES = [[36, "KICK"], [35, "KICK 2"], [38, "SNARE"], [39, "CLAP"], [42, "HAT"], [46, "OPEN HAT"], [44, "PEDAL"], [37, "RIM"],
  [40, "SNARE 2"], [43, "LOW TOM"], [48, "HI TOM"], [49, "CRASH"], [51, "RIDE"], [70, "SHAKER"], [63, "CONGA"], [56, "COWBELL"]];
const LV_NAMES = ["NORM", "GHOST", "SOFT", "HARD"];
const LV_ORDER = [1, 2, 0, 3];                       /* by loudness: GHOST SOFT NORM HARD (as the device's LEVEL knob) */
/* an empty drum step: no lane on */
const emptyDrum = () => ({ on: 0, lvl: new Array(16).fill(0), rat: new Array(16).fill(0) });

const v14enc = (v) => { const u = Math.max(-8192, Math.min(8191, Math.round(v))) + 8192; return [u & 0x7F, (u >> 7) & 0x7F]; };
const v14dec = (lo, hi) => (lo | (hi << 7)) - 8192;
function strEnc(s) { const a = []; for (const c of String(s)) a.push(c.charCodeAt(0) & 0x7F); a.push(0); return a; }

/* only ever builds F0 7D 46 4C ... F7 */
function frame(cmd, args = []) {
  for (const b of args) if (!(Number.isInteger(b) && b >= 0 && b <= 0x7F)) throw new Error("bad data byte " + b);
  return [0xF0, ...HDR, cmd & 0x7F, ...args, 0xF7];
}
/* -> {cmd, a} or null when it is not an editor frame */
function unframe(d) {
  if (!d || d.length < 6 || d[0] !== 0xF0 || d[d.length - 1] !== 0xF7) return null;
  if (d[1] !== HDR[0] || d[2] !== HDR[1] || d[3] !== HDR[2]) return null;
  return { cmd: d[4], a: Array.from(d.slice(5, d.length - 1)) };
}

class Reader {
  constructor(a) { this.a = a; this.i = 0; }
  b() { if (this.i >= this.a.length) throw new Error("short reply"); return this.a[this.i++]; }
  v() { const lo = this.b(); return v14dec(lo, this.b()); }
  s() { let s = ""; for (;;) { const c = this.b(); if (!c) return s; s += String.fromCharCode(c); } }
}

/* v5 steps end with level / ratchet (2 bits per note, 7-bit bytes: lvl, hi (bit 0 lvl, bit 1 rat), rat) */
function stepExt(r, a, o) {
  if (r.i + 3 <= a.length) {
    const lo = r.b(), hi = r.b(), rt = r.b();
    o.lvl = lo | ((hi & 1) << 7);
    o.rat = rt | (((hi >> 1) & 1) << 7);
  }
  return o;
}

const parse = {
  [CMD.INFO](a) {
    const r = new Reader(a);
    const o = { version: r.s(), nengines: r.b(), pcount: r.b(), gcount: r.b(), nstep: r.b(), pe0: r.b(), engines: [] };
    for (let i = 0; i < o.nengines; i++) o.engines.push(r.s());
    o.ntrk = r.i < a.length ? r.b() : 0;             /* v3: tracks (0 = older firmware, one instrument) */
    o.proto = r.i < a.length ? r.b() : 0;            /* v5: the protocol version (0 = older firmware) */
    return o;
  },
  [CMD.GET](a) { const r = new Reader(a); return { scope: r.b(), id: r.b(), value: r.v() }; },
  [CMD.SET](a) { return parse[CMD.GET](a); },
  /* needs the counts from INFO */
  [CMD.DUMP](a, info) {
    const r = new Reader(a);
    const o = { engine: r.b(), preset: r.b(), p: [], g: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < info.gcount; i++) o.g.push(r.v());
    return o;
  },
  [CMD.DESC](a) {
    const r = new Reader(a);
    const o = { scope: r.b(), id: r.b(), fmt: r.b(), min: r.v(), max: r.v(), def: r.v(), label: r.s(), unit: r.s(), names: [] };
    if (o.fmt === F.ENUM) for (let i = 0; i <= o.max - o.min && i < 64 && r.i < a.length; i++) o.names.push(r.s());
    return o;
  },
  [CMD.STEP_GET](a) {
    const r = new Reader(a);
    const o = { index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() };
    return stepExt(r, a, o);
  },
  [CMD.STEP_SET](a) { return parse[CMD.STEP_GET](a); },
  [CMD.PRESET](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b() }; },
  [CMD.PROJECT](a) { const r = new Reader(a); return { op: r.b(), slot: r.b(), used: r.b(), busy: a.length > 3 && a[3] === 1 }; },
  [CMD.NAMES](a) {
    const r = new Reader(a);
    const o = { engine: r.b(), names: [] };
    const n = r.b();
    for (let i = 0; i < n; i++) o.names.push(r.s());
    o.titles = [];
    try { o.titles.push(r.s(), r.s()); } catch (e) { o.titles = []; }   /* older firmware: no page titles */
    return o;
  },
  [CMD.SMP_BEGIN](a) { const r = new Reader(a); return { slot: r.b(), rc: r.b() }; },
  [CMD.SMP_WRITE](a) { const r = new Reader(a); return { slot: r.b(), offset: r.b() | (r.b() << 7) | (r.b() << 14), rc: r.b() }; },
  [CMD.SMP_END](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_INFO](a) {
    const r = new Reader(a);
    const o = { nslots: r.b(), slotKiB: r.b(), slots: [] };
    for (let i = 0; i < o.nslots; i++) o.slots.push({ zones: r.b(), name: r.s(), kib: r.b() });
    return o;
  },
  [CMD.UP_LIST](a) {
    const r = new Reader(a);
    const o = { start: r.b(), count: r.b(), total: r.b(), slots: [] };
    for (let i = 0; i < o.count; i++) o.slots.push({ slot: o.start + i, used: r.b(), engine: r.b(), name: r.s() });
    return o;
  },
  /* needs P_COUNT from INFO */
  [CMD.UP_GET](a, info) {
    const r = new Reader(a);
    const o = { slot: r.b(), used: r.b(), engine: r.b(), name: r.s(), p: [], pattern: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < UP.PAT; i++) o.pattern.push([r.b(), r.b()]);
    return o;
  },
  [CMD.UP_PUT](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_STORE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_LOAD](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.WATCH](a) { return { on: new Reader(a).b() }; },
  [CMD.CHANGED](a) { return parse[CMD.GET](a); },
  [CMD.RELOAD](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  [CMD.PING](a) { return {}; },
  [CMD.STEP_CHANGED](a) { const r = new Reader(a); return { index: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  /* v3: tracks. engine === NENGINES: the drum track */
  [CMD.TRACK](a) {
    const r = new Reader(a);
    const o = { sel: r.b(), ntrk: r.b(), tracks: [] };
    for (let i = 0; i < o.ntrk; i++) o.tracks.push({ engine: r.b(), preset: r.b(), level: r.v(), mute: r.b(), armed: r.b() });
    o.solo = r.i < a.length ? r.b() : 0;             /* v5: the tracks soloed (bit per track) */
    return o;
  },
  [CMD.TRACK_MIX](a) { const r = new Reader(a); return { track: r.b(), level: r.v(), mute: r.b() }; },
  [CMD.TRACK_DUMP](a, info) {
    const r = new Reader(a);
    const o = { track: r.b(), engine: r.b(), preset: r.b(), p: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    return o;
  },
  [CMD.TRACK_STEP](a) {
    const r = new Reader(a);
    return stepExt(r, a, { track: r.b(), index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() });
  },
  /* v6: backup. LIST: rc, then per object id, length, CRC-32 (5 x 7 bit each) */
  [CMD.BK_LIST](a) {
    const r = new Reader(a), rc = r.b(), n = r.b(), items = [];
    for (let i = 0; i < n; i++) items.push({ id: r.b(), len: u35dec(r), crc: u35dec(r) >>> 0 });
    return { rc, items };
  },
  [CMD.BK_GET](a) {
    const r = new Reader(a), id = r.b(), rc = r.b(), off = u35dec(r), count = r.b() | (r.b() << 7);
    return { id, rc, off, count, data: unpack7(a.slice(r.i)) };
  },
  [CMD.BK_PUT](a) { const r = new Reader(a); return { op: r.b(), id: r.b(), rc: r.b() }; },
  /* v5: the drum track's step: the lanes on (16 bits), their levels and ratchets (2 bits each) */
  [CMD.DRUM_STEP](a) {
    const r = new Reader(a);
    const o = { index: r.b(), on: r.b() | (r.b() << 7) | ((r.b() & 3) << 14), lvl: [], rat: [] };
    let lv = 0, rt = 0;
    for (let k = 0; k < 5; k++) lv += r.b() * 2 ** (7 * k);
    for (let k = 0; k < 5; k++) rt += r.b() * 2 ** (7 * k);
    for (let l = 0; l < 16; l++) {
      const on = (o.on >> l) & 1;
      o.lvl.push(on ? Math.floor(lv / 4 ** l) % 4 : 0);
      o.rat.push(on ? Math.floor(rt / 4 ** l) % 4 : 0);
    }
    return o;
  },
  /* v4: a parameter of any track (the selection stays), and its push for a track that is not selected */
  [CMD.TRACK_PARAM](a) { const r = new Reader(a); return { track: r.b(), id: r.b(), value: r.v() }; },
  [CMD.TRACK_CHANGED](a) { return parse[CMD.TRACK_PARAM](a); },
  /* v7: a track's parameter locks: n x {step, param, value}; a set: rc (0 ok, 1 arguments, 2 not lockable, 3 full) */
  [CMD.LOCK_GET](a) {
    const r = new Reader(a), o = { track: r.b(), locks: [] }, n = r.b();
    for (let i = 0; i < n; i++) o.locks.push({ step: r.b(), param: r.b(), value: r.v() });
    return o;
  },
  [CMD.LOCK_SET](a) { const r = new Reader(a); const o = { track: r.b(), step: r.b(), param: r.b(), rc: r.b(), has: r.b() }; o.value = r.v(); if (!o.has) o.value = null; return o; },
  /* v7: a track's nudges (NSTEP bytes, each + 64) */
  [CMD.MICRO_GET](a) { const r = new Reader(a), o = { track: r.b(), micro: [] }; while (r.i < a.length) o.micro.push(r.b() - 64); return o; },
  [CMD.MICRO_SET](a) { const r = new Reader(a); return { track: r.b(), step: r.b(), micro: r.b() - 64 }; },
  /* v8: a track's fill conditions (16 bytes, pack7; 3 reads as normal) and a set */
  [CMD.FILL_GET](a) { const r = new Reader(a), o = { track: r.b() }; o.fill = Array.from(unpack7(a.slice(r.i))).slice(0, 16); while (o.fill.length < 16) o.fill.push(0); return o; },
  [CMD.FILL_SET](a) { const r = new Reader(a); return { track: r.b(), step: r.b(), cond: r.b() % 3 }; },
  /* v9 FM6 patches: target 0 a track (0..2), 1 a bank slot, 2 a factory patch; packed: the 128-byte record */
  [CMD.FM6_GET](a) { return { target: a[0], index: a[1], rc: a[2], packed: a[2] ? null : a.slice(3, 3 + 128) }; },
  [CMD.FM6_PUT](a) { return { target: a[0], index: a[1], rc: a[2] }; },
  [CMD.FM6_LIST](a) {
    const r = new Reader(a), o = { factory: r.b(), bank: r.b(), slots: [] };
    for (let i = 0; i < o.factory + o.bank; i++) { const used = r.b(); o.slots.push({ used, name: used ? r.s() : (r.b(), "") }); }
    return o;
  },
  [CMD.FM6_ERASE](a) { return { index: a[0], rc: a[1] }; },
  /* v10: the SYN drum kits (editor_dsyn.c) */
  [CMD.DSYN_LIST](a) {
    const r = new Reader(a), o = { factory: r.b(), user: r.b(), stored: !!r.b(), names: [], kits: [] };
    for (let i = 0; i < o.factory; i++) o.names.push(r.s());
    for (let i = 0; i < o.user; i++) o.kits.push({ name: r.s(), src: r.b() });
    return o;
  },
  [CMD.DSYN_GET](a) {
    const r = new Reader(a), o = { which: r.b(), rc: r.b() };
    if (o.rc) return o;
    o.name = r.s();
    const d = unpack7(a.slice(r.i));
    o.crush = d[0]; o.src = d[1];
    o.sounds = Array.from({ length: DSYN.LANES }, (_, l) => d.slice(2 + l * DSYN.SIZE, 2 + (l + 1) * DSYN.SIZE));
    if (d.length < 2 + DSYN.LANES * DSYN.SIZE) o.rc = 2;
    return o;
  },
  [CMD.DSYN_PUT](a) { return { k: a[0], part: a[1], rc: a[2] }; },
  [CMD.DSYN_STORE](a) { return { rc: a[0] }; },
  [CMD.DSYN_PLAY](a) { return { k: a[0], lane: a[1], rc: a[2] }; },
};

/* a name the device accepts: printable ASCII, 1..12 characters */
function upName(s) { return String(s ?? "").replace(/[^\x20-\x7E]/g, "").trim().slice(0, UP.NAME_MAX) || "PATCH"; }

const req = {
  info: () => [CMD.INFO, []],
  get: (scope, id) => [CMD.GET, [scope, id]],
  set: (scope, id, v) => [CMD.SET, [scope, id, ...v14enc(v)]],
  dump: () => [CMD.DUMP, []],
  desc: (scope, id) => [CMD.DESC, [scope, id]],
  stepGet: (i) => [CMD.STEP_GET, [i]],
  stepSet: (i, st) => {
    const n = Math.max(0, Math.min(4, st.n | 0));
    const notes = [0, 1, 2, 3].map((k) => (st.notes[k] | 0) & 0x7F);
    const ext = st.lvl == null && st.rat == null ? []   /* v5: level / ratchet kept (older firmware ignores them) */
      : [(st.lvl | 0) & 0x7F, (((st.lvl | 0) >> 7) & 1) | ((((st.rat | 0) >> 7) & 1) << 1), (st.rat | 0) & 0x7F];
    return [CMD.STEP_SET, [i, n, ...notes, Math.max(0, Math.min(2, st.time | 0)), st.flags & 3, (st.vel | 0) & 0x7F, ...ext]];
  },
  /* v5: get (d == null) or set the drum track's step i: {on: 16 bits, lvl[16], rat[16]} */
  drumStep: (i, d) => {
    if (!d) return [CMD.DRUM_STEP, [i & 0x7F]];
    let lv = 0, rt = 0;
    for (let l = 0; l < 16; l++) if ((d.on >> l) & 1) { lv += ((d.lvl[l] | 0) & 3) * 4 ** l; rt += ((d.rat[l] | 0) & 3) * 4 ** l; }
    const g7 = (x, n) => Array.from({ length: n }, (_, k) => Math.floor(x / 2 ** (7 * k)) & 0x7F);
    return [CMD.DRUM_STEP, [i & 0x7F, ...g7(d.on & 0xFFFF, 3), ...g7(lv, 5), ...g7(rt, 5)]];
  },
  preset: (e, p) => [CMD.PRESET, [e & 0x7F, p & 0x7F]],
  project: (op, slot) => { if (![0, 1, 2].includes(op)) throw new Error("bad PROJECT op"); return [CMD.PROJECT, [op, slot & 3]]; },   /* 0 load, 1 save, 2 query */
  names: (e) => [CMD.NAMES, [e & 0x7F]],
  smpBegin: (s) => [CMD.SMP_BEGIN, [s & 0x7F]],
  smpWrite: (s, off, bytes) => [CMD.SMP_WRITE, [s & 0x7F, off & 0x7F, (off >> 7) & 0x7F, (off >> 14) & 0x7F, ...pack7(bytes)]],
  smpEnd: (s, hdr) => [CMD.SMP_END, [s & 0x7F, ...pack7(hdr)]],
  smpErase: (s) => [CMD.SMP_ERASE, [s & 0x7F]],
  smpInfo: () => [CMD.SMP_INFO, []],
  upList: (start, count) => [CMD.UP_LIST, [start & 0x7F, Math.max(1, Math.min(UP.LIST_MAX, count | 0))]],
  upGet: (s) => [CMD.UP_GET, [s & 0x7F]],
  /* patch: {engine, name, p: P_COUNT values, pattern: 16 x [note, flags]} */
  upPut: (s, pt) => [CMD.UP_PUT, [s & 0x7F, pt.engine & 0x7F, ...strEnc(upName(pt.name)), ...pt.p.flatMap((v) => v14enc(v ?? 0)),
    ...Array.from({ length: UP.PAT }, (_, i) => { const x = (pt.pattern || [])[i] || [0, 0]; return [x[0] & 0x7F, x[1] & 7]; }).flat()]],
  upStore: (s, name) => [CMD.UP_STORE, [s & 0x7F, ...strEnc(name ? upName(name) : "")]],   /* "": the device names it ("ANALOG 07") */
  upLoad: (s) => [CMD.UP_LOAD, [s & 0x7F]],
  upErase: (s) => [CMD.UP_ERASE, [s & 0x7F]],
  /* on: 1 = pushes; 3 = also TRACK_CHANGED (v4 firmware answers 3, older firmware 1) */
  watch: (on) => [CMD.WATCH, [on === 3 ? 3 : on ? 1 : 0]],
  ping: () => [CMD.PING, []],
  /* v3: tracks 0..3 (3 = drums) */
  track: (sel) => [CMD.TRACK, sel == null ? [] : [sel & 0x7F]],
  trackMix: (tr, level, mute) => [CMD.TRACK_MIX, level == null ? [tr & 0x7F] : [tr & 0x7F, ...v14enc(level), mute ? 1 : 0]],
  trackDump: (tr) => [CMD.TRACK_DUMP, [tr & 0x7F]],
  trackStep: (tr, i, st) => [CMD.TRACK_STEP, st ? [tr & 0x7F, ...req.stepSet(i, st)[1]] : [tr & 0x7F, i & 0x7F]],
  /* v4: get (v == null) or set parameter id (P_*) of track tr, clamped as SET */
  trackParam: (tr, id, v) => [CMD.TRACK_PARAM, v == null ? [tr & 0x7F, id & 0x7F] : [tr & 0x7F, id & 0x7F, ...v14enc(v)]],
  /* v6: backup / restore */
  bkList: () => [CMD.BK_LIST, []],
  bkGet: (id, off, n) => [CMD.BK_GET, [id & 0x7F, ...u35enc(off), n & 0x7F, (n >> 7) & 0x7F]],
  bkBegin: (id, len, crc) => [CMD.BK_PUT, [0, id & 0x7F, ...u35enc(len), ...u35enc(crc)]],
  bkData: (id, off, bytes) => [CMD.BK_PUT, [1, id & 0x7F, ...u35enc(off), ...pack7(bytes)]],
  bkCommit: (id) => [CMD.BK_PUT, [2, id & 0x7F]],
  bkAbort: (id) => [CMD.BK_PUT, [3, id & 0x7F]],
  /* v7: the locks of a track; set (v a number) or delete (v == null) the lock of (step, param) */
  lockGet: (tr) => [CMD.LOCK_GET, [tr & 0x7F]],
  lockSet: (tr, step, param, v) => [CMD.LOCK_SET, v == null ? [tr & 0x7F, step & 0x7F, param & 0x7F] : [tr & 0x7F, step & 0x7F, param & 0x7F, ...v14enc(v)]],
  /* v7: the nudges of a track; set one (m: MICRO.MIN..MAX, sent + 64) */
  microGet: (tr) => [CMD.MICRO_GET, [tr & 0x7F]],
  microSet: (tr, step, m) => [CMD.MICRO_SET, [tr & 0x7F, step & 0x7F, (Math.max(MICRO.MIN, Math.min(MICRO.MAX, Math.round(m))) + 64) & 0x7F]],
  /* v8: the fill conditions of a track; set one (c: FC.NORM / FILL / NOFILL) */
  fillGet: (tr) => [CMD.FILL_GET, [tr & 0x7F]],
  fillSet: (tr, step, c) => [CMD.FILL_SET, [tr & 0x7F, step & 0x7F, (c % 3) & 0x7F]],
  /* v9: FM6 patches (firmware proto >= 9) */
  fm6Get: (target, i) => [CMD.FM6_GET, [target & 0x7F, i & 0x7F]],
  fm6Put: (target, i, packed) => [CMD.FM6_PUT, [target & 0x7F, i & 0x7F, ...Array.from(packed, (x) => x & 0x7F)]],
  fm6List: () => [CMD.FM6_LIST, []],
  fm6Erase: (i) => [CMD.FM6_ERASE, [i & 0x7F]],
  /* v10: the SYN drum kits (firmware proto >= 10). which: a factory kit 0.., or DSYN.USER + k */
  dsynList: () => [CMD.DSYN_LIST, []],
  dsynGet: (which) => [CMD.DSYN_GET, [which & 0x7F]],
  dsynSound: (k, lane, bytes22) => [CMD.DSYN_PUT, [k & 0x7F, lane & 0x7F, ...pack7(bytes22)]],
  dsynHead: (k, name, crush, src) => [CMD.DSYN_PUT, [k & 0x7F, 16, ...pack7(Uint8Array.from([...DSYN.name8(name), crush & 255, src & 255]))]],
  dsynCopy: (k, src) => [CMD.DSYN_PUT, [k & 0x7F, 17, ...pack7(Uint8Array.of(src & 255))]],
  dsynStore: () => [CMD.DSYN_STORE, []],
  dsynPlay: (k, lane, vel = 110) => [CMD.DSYN_PLAY, [k & 0x7F, lane & 0x7F, Math.max(1, Math.min(127, vel | 0))]],
};

/* which reply belongs to which request (the device echoes these) */
function replyMatches(cmd, args, a) {
  switch (cmd) {
    case CMD.GET: case CMD.SET: case CMD.DESC: return a[0] === args[0] && a[1] === args[1];
    case CMD.STEP_GET: case CMD.STEP_SET: case CMD.NAMES:
    case CMD.SMP_BEGIN: case CMD.SMP_END: case CMD.SMP_ERASE: return a[0] === args[0];
    case CMD.SMP_WRITE: return a[0] === args[0] && a[1] === args[1] && a[2] === args[2] && a[3] === args[3];
    case CMD.PROJECT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UP_LIST: case CMD.UP_GET: case CMD.UP_PUT: case CMD.UP_STORE: case CMD.UP_LOAD: case CMD.UP_ERASE:
    case CMD.TRACK_MIX: case CMD.TRACK_DUMP: case CMD.DRUM_STEP: return a[0] === args[0];
    case CMD.WATCH: return (a[0] & 1) === (args[0] & 1);   /* bit 1: v4 firmware only */
    case CMD.TRACK_STEP: case CMD.TRACK_PARAM: return a[0] === args[0] && a[1] === args[1];
    case CMD.BK_GET: return a[0] === args[0] && [0, 1, 2, 3, 4].every((k) => a[2 + k] === args[1 + k]);
    case CMD.BK_PUT: return a[0] === args[0] && a[1] === args[1];
    case CMD.LOCK_GET: case CMD.MICRO_GET: case CMD.FILL_GET: return a[0] === args[0];
    case CMD.LOCK_SET: return a[0] === args[0] && a[1] === args[1] && a[2] === args[2];
    case CMD.MICRO_SET: case CMD.FILL_SET: return a[0] === args[0] && a[1] === args[1];
    case CMD.FM6_GET: case CMD.FM6_PUT: return a[0] === args[0] && a[1] === args[1];
    case CMD.FM6_ERASE: return a[0] === args[0];
    case CMD.DSYN_GET: return a[0] === args[0];
    case CMD.DSYN_PUT: case CMD.DSYN_PLAY: return a[0] === args[0] && a[1] === args[1];
    default: return true;
  }
}

/* strict request/response: one frame in flight, the rest queued. Push frames (CHANGED, RELOAD,
   STEP_CHANGED) can come at any time, also between a request and its reply: they go to onPush. */
class Link {
  constructor(send, opts = {}) {
    this.sendRaw = send;
    this.q = [];
    this.cur = null;
    this.closed = false;
    this.lastSent = 0;                              /* Date.now() of the last frame sent (WATCH keep-alive) */
    this.timeout = opts.timeout || 300;
    this.onUnknown = opts.onUnknown || (() => {});
    this.onTimeout = opts.onTimeout || (() => {});
    this.onPush = opts.onPush || (() => {});
    this.onGap = opts.onGap || (() => {});         /* (ms) nothing was sent for that long (WATCH may have ended) */
  }
  get idle() { return !this.cur && !this.q.length; }
  hasQueued(key) { return this.q.some((r) => r.key === key); }
  /* r = [cmd, args]; opt: {timeout, retries, key (coalesce queued requests: the latest args win), front,
     quiet (a timeout is expected: no onTimeout)} */
  request(r, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    const [cmd, args] = r;
    if (opt.key) {
      const old = this.q.find((x) => x.key === opt.key);
      if (old) { old.cmd = cmd; old.args = args; return old.promise; }
    }
    let res, rej;
    const promise = new Promise((a, b) => { res = a; rej = b; });
    const item = { cmd, args, key: opt.key, res, rej, promise, quiet: !!opt.quiet,
      timeout: opt.timeout || this.timeout, retries: opt.retries ?? 1 };
    if (opt.front) this.q.unshift(item); else this.q.push(item);
    this.pump();
    return promise;
  }
  pump() {
    if (this.cur || this.closed || !this.q.length) return;
    this.cur = this.q.shift();
    this.fire();
  }
  fire() {
    const c = this.cur;
    const now = Date.now();
    if (this.lastSent && now - this.lastSent > 2500) this.onGap(now - this.lastSent);
    this.lastSent = now;
    try { this.sendRaw(frame(c.cmd, c.args)); } catch (e) { this.finish(null, e); return; }
    c.timer = setTimeout(() => {
      if (this.cur !== c) return;
      if (c.retries-- > 0) { this.fire(); return; }
      if (!c.quiet) this.onTimeout(c.cmd);
      this.finish(null, new Error("timeout (cmd " + c.cmd + ")"));
    }, c.timeout);
  }
  finish(val, err) {
    const c = this.cur;
    if (!c) return;
    clearTimeout(c.timer);
    this.cur = null;
    if (err) c.rej(err); else c.res(val);
    this.pump();
  }
  /* raw incoming MIDI bytes */
  receive(data) {
    const f = unframe(data);
    if (!f) return;                                  /* not ours (notes, clock, other SysEx) */
    if (PUSH.has(f.cmd)) { this.onPush(f); return; }
    const c = this.cur;
    if (!c || f.cmd !== c.cmd || !replyMatches(c.cmd, c.args, f.a)) { this.onUnknown(f); return; }
    this.finish(f.a);
  }
  close() {
    this.closed = true;
    const all = (this.cur ? [this.cur] : []).concat(this.q);
    if (this.cur) clearTimeout(this.cur.timer);
    this.cur = null;
    this.q = [];
    for (const r of all) r.rej(new Error("closed"));
  }
}

/* ------------------------------------------------------------- formatting --- */
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = (n) => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);   /* 60 = C4 */
/* GM drum notes (35..81) by short names, for the drum track's steps */
const GM_DRUM = { 35: "KICK2", 36: "KICK", 37: "RIM", 38: "SNARE", 39: "CLAP", 40: "SNARE2", 41: "LTOM2", 42: "CHH", 43: "LTOM",
  44: "PHH", 45: "MTOM2", 46: "OHH", 47: "MTOM", 48: "HTOM2", 49: "CRASH", 50: "HTOM", 51: "RIDE", 52: "CHINA", 53: "BELL",
  54: "TAMB", 55: "SPLASH", 56: "COWBELL", 57: "CRASH2", 58: "VIBRA", 59: "RIDE2", 60: "HBONGO", 61: "LBONGO", 62: "MCONGA",
  63: "HCONGA", 64: "LCONGA", 65: "HTIMB", 66: "LTIMB", 67: "HAGOGO", 68: "LAGOGO", 69: "CABASA", 70: "MARACA", 71: "SWHIS",
  72: "LWHIS", 73: "SGUIRO", 74: "LGUIRO", 75: "CLAVES", 76: "HWOOD", 77: "LWOOD", 78: "MCUICA", 79: "OCUICA", 80: "MTRI", 81: "OTRI" };
const GM_DRUM_BY_NAME = Object.fromEntries(Object.entries(GM_DRUM).map(([n, s]) => [s, +n]));
const drumName = (n) => GM_DRUM[n] || String(n);
/* a note token: a number, a note name (C4, F#3, Bb2) or a GM drum name (KICK, CHH) */
function parseNote(tok) {
  const dn = GM_DRUM_BY_NAME[tok.toUpperCase()];
  if (dn != null) return dn;
  if (/^\d+$/.test(tok)) { const n = +tok; return n <= 127 ? n : null; }
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(tok);
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1].toUpperCase()];
  const n = base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return n >= 0 && n <= 127 ? n : null;
}
/* "C4 E4 G4" -> [60, 64, 67]; null on a bad token or more than 4 notes */
function parseNotes(s) {
  const t = s.trim().split(/[\s,]+/).filter(Boolean);
  if (t.length > 4) return null;
  const out = t.map(parseNote);
  return out.includes(null) ? null : out;
}

/* close to the device's param_format (params.c), tables from tools/gen_tables.py */
function fmtValue(d, v) {
  const sign = (x) => (x > 0 ? "+" + x : String(x));
  switch (d.fmt) {
    case F.PCT: return [String(d.max > 0 ? Math.trunc((v * 100 + Math.trunc(d.max / 2)) / d.max) : v), "%"];
    case F.SWING: return [String(Math.max(0, Math.min(100, v))), ""];   /* 0 straight .. 100 the most (as the FM-1, 2.5) */
    case F.FILT: return !v ? ["OFF", ""] : v < 0 ? ["LP" + Math.trunc((-v * 100 + 32) / 64), "%"] : ["HP" + Math.trunc((v * 100 + 31) / 63), "%"];
    case F.BIPCT: return [sign(Math.trunc(v * 100 / 64)), "%"];
    case F.TIME: {
      const ms10 = Math.round(10 * Math.pow(10000, (v & 127) / 127));
      if (ms10 < 100) return [(ms10 / 10).toFixed(1), "ms"];
      if (ms10 < 10000) return [String(Math.round(ms10 / 10)), "ms"];
      return [(ms10 / 10000).toFixed(2), "s"];
    }
    case F.LFOHZ: { const h = 0.05 * Math.pow(800, (v & 127) / 127); return [h < 10 ? h.toFixed(2) : h.toFixed(1), "Hz"]; }
    case F.CUTOFF: { const h = 30 * Math.pow(16000 / 30, (v & 127) / 127); return h < 1000 ? [String(Math.round(h)), "Hz"] : [(h / 1000).toFixed(1), "kHz"]; }
    case F.DB: return v <= 0 ? ["OFF", ""] : [((v - 112) / 2).toFixed(1), "dB"];
    case F.SEMI: return [sign(v), "st"];
    case F.ENUM: return [d.names[v - d.min] ?? String(v), d.unit || ""];
    case F.BPM: return [String(v), "BPM"];
    case F.NOTE: return [NOTE_NAMES[((v % 12) + 12) % 12], ""];
    case F.ONOFF: return [v ? "ON" : "OFF", ""];
    case F.STEPS: return [String(v), "STEP"];
    default: return [d.names && d.names[v - d.min] != null ? d.names[v - d.min] : String(v), d.unit || ""];
  }
}

/* ---------------------------------------------------------- user samples --- */
/* A port of tools/sampleio.py (read_any_wav, resample, to_int16, ima_encode, user_slot),
   byte for byte: web/test_web.mjs compares them. */
const SMP = { SLOT_SIZE: 0x14000, DATA_OFF: 512, RATE: 22050, HDR_LEN: 32 + 16 * 28, MAX_ZONES: 16 };
SMP.MAX_DATA = SMP.SLOT_SIZE - SMP.DATA_OFF;

/* groups of up to 7 bytes, each preceded by their top bits */
function pack7(b) {
  const out = [];
  for (let i = 0; i < b.length; i += 7) {
    const g = Array.from(b.slice(i, i + 7));
    out.push(g.reduce((m, x, j) => m | (((x >> 7) & 1) << j), 0));
    for (const x of g) out.push(x & 0x7F);
  }
  return out;
}
function unpack7(a) {
  const out = [];
  for (let i = 0; i < a.length; i += 8) {
    const top = a[i];
    for (let j = 0; j < 7 && i + 1 + j < a.length; j++) out.push(a[i + 1 + j] | (((top >> j) & 1) << 7));
  }
  return Uint8Array.from(out);
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

const IMA_STEP = [7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88,
  97, 107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658,
  724, 796, 876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660,
  4026, 4428, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818,
  18500, 20350, 22385, 24623, 27086, 29794, 32767];
const IMA_IDX = [-1, -1, -1, -1, 2, 4, 6, 8];
/* IMA ADPCM, 4 bit, low nibble first, from predictor 0 / index 0 -> {data, pred, idx} (state at loopStart) */
function imaEncode(s, loopStart = 0) {
  let pred = 0, idx = 0, atLoop = [0, 0];
  const nib = new Uint8Array(s.length + (s.length & 1));
  for (let n = 0; n < s.length; n++) {
    if (n === loopStart) atLoop = [pred, idx];
    const step = IMA_STEP[idx];
    let diff = s[n] - pred, code = 0;
    if (diff < 0) { code = 8; diff = -diff; }
    let vd = step >> 3;
    if (diff >= step) { code |= 4; diff -= step; vd += step; }
    if (diff >= step >> 1) { code |= 2; diff -= step >> 1; vd += step >> 1; }
    if (diff >= step >> 2) { code |= 1; vd += step >> 2; }
    pred = Math.max(-32768, Math.min(32767, code & 8 ? pred - vd : pred + vd));
    idx = Math.max(0, Math.min(88, idx + IMA_IDX[code & 7]));
    nib[n] = code;
  }
  const out = new Uint8Array(nib.length >> 1);
  for (let k = 0; k < nib.length; k += 2) out[k >> 1] = nib[k] | (nib[k + 1] << 4);
  return { data: out, pred: atLoop[0], idx: atLoop[1] };
}

/* WAV: PCM 8/16/24/32 or float, any channel count, mixed to mono -> {sr, x} (gen_samples.read_any_wav) */
function parseWav(buf) {
  const d = new Uint8Array(buf), v = new DataView(d.buffer, d.byteOffset, d.byteLength);
  const id = (i) => String.fromCharCode(d[i], d[i + 1], d[i + 2], d[i + 3]);
  if (d.length < 12 || id(0) !== "RIFF" || id(8) !== "WAVE") throw new Error("not a WAV file");
  let i = 12, fmt = null, data = null;
  while (i + 8 <= d.length) {
    const cid = id(i), n = v.getUint32(i + 4, true);
    if (cid === "fmt ") {
      let tag = v.getUint16(i + 8, true);
      const ch = v.getUint16(i + 10, true), sr = v.getUint32(i + 12, true), bits = v.getUint16(i + 22, true);
      if (tag === 0xFFFE) tag = v.getUint16(i + 32, true);
      fmt = { tag, ch, sr, bits };
    } else if (cid === "data") {
      data = [i + 8, Math.min(d.length, i + 8 + n)];
      break;
    }
    i += 8 + n + (n & 1);
  }
  if (!fmt || !data) throw new Error("WAV without fmt/data");
  const { tag, ch, sr, bits } = fmt, bps = bits >> 3, frame = bps * ch;
  if (!(tag === 1 || tag === 3) || !bps || !ch) throw new Error("unsupported WAV format");
  const nfr = Math.floor((data[1] - data[0]) / frame), x = new Float64Array(nfr);
  for (let f = 0; f < nfr; f++) {
    let acc = 0;
    for (let c = 0; c < ch; c++) {
      const o = data[0] + f * frame + c * bps;
      let s;
      if (tag === 3) s = bps === 4 ? v.getFloat32(o, true) : v.getFloat64(o, true);
      else if (bps === 2) s = v.getInt16(o, true) / 32768;
      else if (bps === 3) s = (((d[o] | (d[o + 1] << 8) | (d[o + 2] << 16)) << 8) >> 8) / 8388608;
      else if (bps === 4) s = v.getInt32(o, true) / 2147483648;
      else s = (d[o] - 128) / 128;
      acc += s;
    }
    x[f] = acc / ch;
  }
  return { sr, x };
}

/* gen_samples.resample: moving average over the ratio, then linear interpolation */
function resample(x, sr, to) {
  if (sr === to) return Array.from(x);
  if (sr > to) {
    const k = Math.max(1, pyRound(sr / to));
    if (k > 1) {
      const y = new Array(x.length);
      for (let i = 0; i < x.length; i++) { let s = 0; for (let j = i; j < Math.min(x.length, i + k); j++) s += x[j]; y[i] = s / k; }
      x = y;
    }
  }
  const step = sr / to, out = [];
  let p = 0;
  while (p < x.length - 1) { const i = Math.floor(p), f = p - i; out.push(x[i] * (1 - f) + x[i + 1] * f); p += step; }
  return out;
}
function pyRound(v) { const f = Math.floor(v), r = v - f; return r > 0.5 ? f + 1 : r < 0.5 ? f : (f % 2 ? f + 1 : f); }

/* mono float -> int16, peak normalised to 30000 */
function normalize(x) {
  let pk = 1e-9;
  for (const v of x) pk = Math.max(pk, Math.abs(v));
  return Int16Array.from(x, (v) => Math.max(-32768, Math.min(32767, Math.trunc(v / pk * 30000))));
}

/* root from a file name like "piano_C4" or "F#3" (C4 = 60), else 60 (sampleio.note_from_name) */
function rootFromName(name) {
  const m = /(?<![A-Za-z])([A-G])([#b]?)(-?\d)(?!\d)/.exec(name);
  if (!m) return 60;
  const n = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return Math.max(0, Math.min(127, n));
}

/* zones: [{s: Int16Array (22050 Hz), root, lo?, hi?}] -> {hdr (480 B), data, zones} (sampleio.user_slot) */
function buildSlot(name, zonesIn) {
  const zones = [], parts = [];
  let len = 0;
  for (const z of zonesIn) {
    const e = imaEncode(z.s, 0);
    zones.push({ off: len, n: z.s.length, ls: 0, le: z.s.length - 1, root: z.root, lo: z.lo ?? null, hi: z.hi ?? null, pred: e.pred, idx: e.idx });
    parts.push(e.data);
    len += e.data.length;
  }
  const data = new Uint8Array(len);
  let o = 0;
  for (const p of parts) { data.set(p, o); o += p.length; }
  if (len > SMP.MAX_DATA) throw new Error(`too long: ${len} B (max ${SMP.MAX_DATA} B)`);
  if (!zones.length || zones.length > SMP.MAX_ZONES) throw new Error("1..16 files per slot");
  zones.sort((a, b) => a.root - b.root);
  zones.forEach((z, j) => {
    if (z.lo == null) {
      z.lo = j === 0 ? 0 : Math.floor((zones[j - 1].root + z.root) / 2) + 1;
      z.hi = j === zones.length - 1 ? 127 : Math.floor((z.root + zones[j + 1].root) / 2);
    }
  });
  const hdr = new Uint8Array(SMP.HDR_LEN), v = new DataView(hdr.buffer);
  v.setUint32(0, 0x504D5346, true);
  v.setUint16(4, 1, true);
  hdr[6] = zones.length;
  const nm = String(name).toUpperCase().replace(/[^\x20-\x7E]/g, "").slice(0, 8);
  for (let i = 0; i < nm.length; i++) hdr[8 + i] = nm.charCodeAt(i);
  v.setUint32(16, len, true);
  v.setUint32(20, crc32(data), true);
  const rate = pyRound(SMP.RATE / 44100 * 65536);
  zones.forEach((z, j) => {
    const b = 32 + j * 28;
    [z.off, z.n, z.ls, z.le, rate].forEach((x, k) => v.setUint32(b + k * 4, x >>> 0, true));
    v.setInt16(b + 20, z.root * 16, true);
    v.setInt16(b + 22, z.pred, true);
    hdr[b + 24] = z.idx; hdr[b + 25] = z.lo; hdr[b + 26] = z.hi; hdr[b + 27] = 0;
  });
  return { hdr, data, zones };
}

/* ------------------------------------------------------------------- chop --- */
/* Chopping a recording into a slot (the CHOP block of the samples tab). All at SMP.RATE, positions
   in samples. These are pure: test_web.mjs runs them. */
const CHOP = { HOP: 128, MAX: 16, FADE_IN: 22, FADE_OUT: 132, PRE: 32 };   /* 5.8 ms frames; fades 1 / 6 ms; start 1.5 ms early */

/* onset novelty per frame: the rise of the log energy of the signal's first difference (the attack
   of a hit, not its body), over the louder of the two frames before */
function chopNovelty(x) {
  const H = CHOP.HOP, F = Math.ceil(x.length / H), L = new Float64Array(F), P = new Float64Array(F), nov = new Float64Array(F);
  let top = 1e-12, ptop = 1e-12;
  for (let f = 0; f < F; f++) {
    let e = 0, p = 0;
    for (let i = f * H, n = Math.min(x.length, i + H); i < n; i++) { const d = x[i] - (i ? x[i - 1] : 0); e += d * d; p += x[i] * x[i]; }
    L[f] = e;
    P[f] = p;
    if (e > top) top = e;
    if (p > ptop) ptop = p;
  }
  for (let f = 0; f < F; f++) { L[f] = Math.log10(L[f] / top + 1e-9); P[f] = Math.log10(P[f] / ptop + 1e-9); }   /* 0 = the loudest */
  for (let f = 0; f < F; f++) {
    const before = Math.max(f ? L[f - 1] : -9, f > 1 ? L[f - 2] : -9);
    nov[f] = L[f] > -3.5 ? Math.max(0, L[f] - before) : 0;              /* (under -35 dB: no hit) */
  }
  nov.level = P;                                                         /* (log10 power, 0 = the loudest frame) */
  return nov;
}

/* the first sample of the hit in frame f: where the signal first reaches 30 % of its peak over the
   frames f-1..f+2, then PRE samples earlier (the attack is kept whole) */

  return a;
}

/* hits: sens 1 (only the hardest and loudest) .. 10 (every small one); at least 60 ms apart. A hit is a
   sharp rise (nov over thr) to a level (its loudest frame within 3) over the gate */
function chopHits(x, nov, sens) {
  const k = Math.max(1, Math.min(10, sens)), thr = 0.15 + (10 - k) * 0.08, gate = -(0.5 + k * 0.35);

    if (L && Math.max(L[f], L[Math.min(L.length - 1, f + 1)], L[Math.min(L.length - 1, f + 2)]) < gate) continue;
    if (f - last < gap) {
      if (out.length && nov[f] > nov[last]) { out[out.length - 1] = chopAttack(x, f); last = f; }
      continue;

   opt[i] (optional) = {off: left out of the slot, len: its own length in samples, over maxLen};

/* chops -> slot zones {s (Int16Array, one gain for all: their levels are kept), root, lo, hi, fname}.

    const slots = first.slots.slice();

      if (!r.count) break;

  /* -> rc (0 ok) */
  async put(rq, slot, pt) { return parse[CMD.UP_PUT](await rq(req.upPut(slot, pt), FLASH_OPT)).rc; },
  async store(rq, slot, name) { return parse[CMD.UP_STORE](await rq(req.upStore(slot, name), FLASH_OPT)).rc; },
  async load(rq, slot) { return parse[CMD.UP_LOAD](await rq(req.upLoad(slot), { timeout: 1000 })).rc; },
  async erase(rq, slot) { return parse[CMD.UP_ERASE](await rq(req.upErase(slot), FLASH_OPT)).rc; },
